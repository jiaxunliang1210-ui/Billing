<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETK · L3H 开单系统</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#141a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="开单">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#141a22; --panel:#1b232e; --panel2:#222c39; --line:#2e3a4a;
  --ink:#e6ebf1; --mute:#8d9aab; --amber:#f2a900; --amber-ink:#1a1400;
  --ok:#3fb27f; --bad:#e5534b; --warnc:#e0a02a; --night:#7c8cff; --day:#f2c14e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --line:#d5dbe3;
  --ink:#18202b; --mute:#5d6b7c; --amber:#c98a00; --amber-ink:#ffffff;
  --warnc:#a86d00; --night:#4a5bd6; --day:#a07400;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--amber)}
.mute{color:var(--mute)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.stripe{width:28px;height:18px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--amber) 0 6px,transparent 6px 12px);border:1px solid var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--amber);color:var(--amber-ink);font-weight:600}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--mute)}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.btn .badge,nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{max-width:1800px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px} h3{font-size:15px;margin:16px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
.pair{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f input,label.f select,label.f textarea,.inp{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0;width:100%}
label.f input.auto{border-style:dashed}
label.f textarea,textarea.inp{min-height:64px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.calc{display:flex;flex-wrap:wrap;gap:22px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.calc div{font-size:13px;color:var(--mute)} .calc b{display:block;font-size:20px;color:var(--ink)}
.calc .total b{color:var(--amber)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--amber);color:var(--amber-ink);display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.tag.Night{color:var(--night)} .tag.Day{color:var(--day)}
.tag.ok,.tag.Paid{color:var(--ok)} .tag.bad,.tag.Overdue{color:var(--bad)} .tag.Partial,.tag.warn{color:var(--warnc)} .tag.Unpaid,.tag.mute{color:var(--mute)}
.warn{color:var(--bad);font-size:13px;margin-top:8px}
.note{color:var(--warnc);font-size:13px;margin-top:8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label.f{min-width:150px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
main .tw{max-height:calc(100vh - 140px);overflow:auto}
main .tw tfoot td{position:sticky;bottom:0;z-index:1}
main .tw thead th{z-index:2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips button{border:1px solid var(--line);background:var(--panel);color:var(--text,inherit);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--accent,#f5a623);color:#111;border-color:transparent}.chips b{font-weight:600;opacity:.75;margin-left:2px}
.colpick{position:relative;align-self:end}.colpick summary{list-style:none;cursor:pointer}.colpick summary::-webkit-details-marker{display:none}
.colpick .colbox{position:absolute;z-index:30;top:110%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:4px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#undoT{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#undoT b{font-size:12px;opacity:.6;min-width:16px}
#toTop{position:fixed;right:18px;bottom:18px;z-index:120;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:inherit;font-size:18px;cursor:pointer;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toTop.show{display:block}
.rcw{color:var(--red,#e5484d);font-weight:600;margin:6px 0}
.bkbar{background:#c62828;color:#fff;padding:6px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#updBar{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:9999;background:#f5b301;color:#1a1a1a;font-weight:600;padding:8px 12px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.brand .ver{font-size:11px;font-weight:400;opacity:.55;margin-left:6px}
[data-drop].dropping{outline:3px dashed var(--amber,#f5a623);outline-offset:3px}
.pdfFill{background:rgba(245,179,1,.18)!important;outline:1px solid #f5b301}
label.file.dropping{outline:3px dashed var(--amber,#f5a623);outline-offset:3px;position:relative}
label.file.dropping::after{content:"放开就上传";position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--amber,#f5a623);color:#111;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.pvbox.dropping{outline:3px dashed var(--amber,#f5a623);outline-offset:-6px}
.pdot.click{cursor:pointer}.pdot.click:hover{border-color:var(--acc,#f0b400)}
.pdot{display:inline-block;min-width:22px;padding:1px 5px;margin-right:3px;border-radius:6px;font-size:12px;text-align:center;border:1px solid var(--line);color:var(--mute)}
.pdot.on{background:color-mix(in srgb,var(--ok,#2ecc71) 22%,transparent);color:var(--ok,#2ecc71);border-color:transparent}
.btn.ib{padding:1px 6px;margin-left:2px;font-size:12px;line-height:1.4}
.tiin{background:color-mix(in srgb,#f5a623 14%,var(--panel));border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:inherit}.tiin.miss{background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
@media (max-width:700px){
  main .tw{max-height:none;overflow:visible;border:0}
  main .tw table,main .tw tbody,main .tw tfoot,main .tw tr,main .tw td{display:block;width:100%}
  main .tw thead{display:none}
  main .tw tr{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:6px 0;background:var(--panel)}
  main .tw td{border:0;white-space:normal;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:3px 12px;text-align:right;min-width:0}
  main .tw td.wrap{min-width:0}
  main .tw td::before{content:attr(data-l);color:var(--mute);text-align:left;font-size:12px;flex:0 0 auto;max-width:45%}
  main .tw td:empty{display:none}
  main .tw tfoot td{position:static}
}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);color:var(--mute);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:200px}
tr.click{cursor:pointer} tr.off td{opacity:.45} tr.amb td{background:color-mix(in srgb,#f5a623 10%,transparent)} tr.click:hover td{background:var(--panel2)}
tr.red td{background:color-mix(in srgb,var(--bad) 10%,transparent)}
tr.soaOR td{background:color-mix(in srgb,var(--ok) 9%,transparent)}
tfoot td{font-weight:600;background:var(--panel2)}
main .tw td{white-space:normal}main .tw td.num{white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 14px;cursor:pointer;color:var(--mute)}
.sub button.on{border-color:var(--amber);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.urgent{border-left:4px solid var(--bad)} .card.follow{border-left:4px solid var(--warnc)}
.card h3{margin:0 0 8px}
.card ul{list-style:none;margin:0;padding:0;font-size:14px}
.card li{padding:5px 0;border-bottom:1px dashed var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.card li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;font-size:14px}
.kv div span{display:block;font-size:12px;color:var(--mute)}
.att ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.att .x{border:0;background:none;color:var(--bad);cursor:pointer}
.attadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attadd select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
label.file{cursor:pointer}
.lines td{vertical-align:top}
.lines textarea{min-height:56px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 10px calc(40px + env(safe-area-inset-bottom,0px))}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:1000px;padding:18px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mhead h2{margin:0;margin-right:auto}
.close{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute);line-height:1}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .panel{width:100%;max-width:360px}
.login h1{font-size:22px;margin:0 0 4px}
.login p{color:var(--mute);margin:0 0 18px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:600px){.top{padding:8px 12px} main{padding:12px} .grid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 打印 / PDF ===== */
#cropOv{position:fixed;inset:0;z-index:200;background:rgba(5,8,12,.82);display:flex;align-items:center;justify-content:center;padding:12px}
#cropOv .cropbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(960px,100%);max-height:100%;overflow:auto}
#cropOv .crophead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
#cropOv .cropstage{position:relative;display:flex;justify-content:center;touch-action:none;user-select:none;background:#0b0f14;border-radius:8px;padding:8px}
#cropOv canvas{display:block;max-width:100%}
#cropOv svg.quad{position:absolute;pointer-events:none;overflow:visible}#cropOv svg.quad polygon{fill:rgba(245,166,35,.12);stroke:var(--amber);stroke-width:2}
#cropOv .qh{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--amber);border:2px solid #fff;border-radius:50%;cursor:grab;touch-action:none;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
#cropOv .cropsel{position:absolute;border:2px solid var(--amber);box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;touch-action:none}
#cropOv .cropsel i{position:absolute;width:22px;height:22px;background:var(--amber);border-radius:50%;border:2px solid #fff}
#cropOv .cropsel i[data-h=nw]{left:-12px;top:-12px;cursor:nwse-resize}#cropOv .cropsel i[data-h=ne]{right:-12px;top:-12px;cursor:nesw-resize}
#cropOv .cropsel i[data-h=sw]{left:-12px;bottom:-12px;cursor:nesw-resize}#cropOv .cropsel i[data-h=se]{right:-12px;bottom:-12px;cursor:nwse-resize}
#cropOv .actions{margin-top:10px;flex-wrap:wrap}
.dobig{font:700 26px/1.1 "IBM Plex Sans",system-ui,sans-serif;color:var(--amber);letter-spacing:.5px}
#photoOv{position:fixed;inset:0;z-index:190;background:rgba(5,8,12,.82);display:flex;align-items:center;justify-content:center;padding:12px}
#photoOv .pvbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(1100px,100%);max-height:100%;overflow:auto}
#photoOv .pvhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#photoOv .pvbody{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:16px}
#photoOv .pvimg img{width:100%;border-radius:6px;background:#0b0f14;margin-bottom:8px}
#photoOv .pvnone,#photoOv .gnone{display:flex;align-items:center;justify-content:center;text-align:center;min-height:180px;border:1px dashed var(--line);border-radius:8px;color:var(--mute)}
#photoOv .kv1 div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}#photoOv .kv1 span{color:var(--mute);min-width:70px}
#photoOv.qov .pvbody{grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr)}
#photoOv .qpages{max-height:calc(100vh - 170px);overflow:auto;background:#0b0f14;border-radius:6px;padding:6px}#photoOv .qpages img{width:100%;display:block;margin-bottom:6px;background:#fff}
#photoOv .qright{max-height:calc(100vh - 120px);overflow:auto}#photoOv .qright table{font-size:13px}
@media(max-width:760px){#photoOv.qov .pvbody{grid-template-columns:1fr}#photoOv .qpages{max-height:55vh}#photoOv .qright{max-height:none}}
#photoOv .tl{border:1px solid var(--line);border-radius:8px;overflow:hidden}#photoOv .tlr{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid var(--line);font-size:12px}
#photoOv .tlr>span{padding:3px 6px;color:var(--mute);white-space:nowrap}#photoOv .tlr.sun>span{color:#e57373}#photoOv .tlr.hd{font-size:11px}
#photoOv .tlr .bar{position:relative;min-height:22px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
#photoOv .tlr .bar.none{background-color:rgba(127,127,127,.08)}#photoOv .tlr.hd .bar{background:none}#photoOv .tlr.hd i{position:absolute;font-style:normal;color:var(--mute);transform:translateX(2px)}
#photoOv .seg{position:absolute;top:2px;bottom:2px;background:#2e7d32;color:#fff;border-radius:4px;font-size:11px;line-height:18px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer}
#photoOv .seg.nt{background:#3949ab}#photoOv .seg.bad{background:#d32f2f;box-shadow:0 0 0 2px #ffcdd2}
.seg-k{display:inline-block;width:10px;height:10px;border-radius:2px;background:#2e7d32;margin:0 3px 0 8px;vertical-align:middle}.seg-k.nt{background:#3949ab}.seg-k.bad{background:#d32f2f}
td.isscell{white-space:normal!important;min-width:200px;max-width:300px}td.isscell .tag{display:inline-block;margin:2px 3px 2px 0;white-space:nowrap}
table.chg .inp{min-width:0;width:100%}table.chg tr.chgd td{background:rgba(245,166,35,.14)}
.calc .why{flex-basis:100%;width:100%;grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}.calc .why .w{color:#f5a623}
label.f.need input{border-color:#f5a623!important;box-shadow:0 0 0 2px rgba(245,166,35,.25)}
.ckl{margin-top:12px;padding:12px 14px}.ck{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.ck>b{width:20px;text-align:center}.ck.ok>b{color:#4caf50}.ck.bad>b{color:#e53935}.ck.warn>b{color:#f5a623}
#photoOv .seg.ld{background:#6d6d6d}#photoOv .seg.still{outline:2px solid #f5b301;outline-offset:-1px}#photoOv .tlr .bar i.gps{position:absolute;bottom:0;height:3px;background:#9e9e9e;opacity:.9}#photoOv .tlr .gday{cursor:pointer;text-decoration:underline dotted}#photoOv .gflag{color:#f5b301}#photoOv .tlflag{font-size:11px;color:#f5b301;padding:2px 8px 4px 68px;border-bottom:1px solid var(--line)}#photoOv .gpsbox{position:sticky;bottom:0;max-height:55vh;overflow:auto;background:var(--card,#1b2230);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;box-shadow:0 -6px 20px rgba(0,0,0,.4)}.l3chk{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#photoOv .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
#photoOv .gcell{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--panel2)}
#photoOv .gcell img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b0f14}
#photoOv .gcell .gnone{aspect-ratio:4/3;min-height:0;border:0}
#photoOv .gcap{display:flex;flex-direction:column;padding:6px 8px;font-size:13px}#photoOv .gcap b{color:var(--amber);font-size:15px}#photoOv .gcap span{color:var(--mute)}

const NO_ID=new Set();
async function fetchAll(build){let out=[],i=0,useId=true;
  for(;;){let b=build();const tbl=b?.url?.pathname?.split("/").pop()||"";if(useId&&!NO_ID.has(tbl)&&typeof b.order==="function")b=b.order("id",{ascending:true});
    const{data,error}=await b.range(i,i+999);
    if(error){if(useId&&/\bid\b/i.test(error.message||"")&&/column|does not exist/i.test(error.message||"")){NO_ID.add(tbl);useId=false;out=[];i=0;continue}throw error}
    out=out.concat(data);if(data.length<1000)break;i+=1000}
  if(out.length>1000&&out[0]&&out[0].id!=null){const seen=new Set();out=out.filter(r=>seen.has(r.id)?false:(seen.add(r.id),true))}
  return out}

/* ---- 价钱：客户 + 车牌 + 材料，越准确越优先；没指定客户 = 所有客户 ---- */
function findL3Rate(cid,svc,plate,date,material){
  return S.d.rates.filter(r=>r.service===svc&&inRange(date,r.effective_from,r.effective_to)&&(!r.customer_id||r.customer_id===cid)&&(!r.plate||r.plate===plate)&&(!r.material||r.material===material))
    .map(r=>({r,k:(r.customer_id?4:0)+(r.plate?2:0)+(r.material?1:0)})).sort((a,b)=>b.k-a.k||String(b.r.effective_from).localeCompare(String(a.r.effective_from)))[0]?.r||null}
const rateFor=(r,night)=>r?Number(night&&r.price_night!=null?r.price_night:r.price):null;
/* 17:00 前开工 = 白天价；17:00 或以后 = 晚上价（所有车） */
const isNightStart=t=>!!t&&mins(String(t).slice(0,5))>=17*60;
/* Lifting Supervisor 跟开工时间对不上 → 要确认 */
function supWarn(d){if(d.service!=="Lorry Crane"||!d.start_time||d.record_only)return"";const night=isNightStart(d.start_time),sup=d.lifting_sup!==false,dr=drvOf(d.driver),t=tShort(d.start_time);
  if(dr?.usual_sup&&night)return L(`${dr.name} 的单 ${t} 开工，算晚上价，请确认有没有 Lifting Supervisor`,`${dr.name} started ${t} — night rate; check lifting supervisor`);
  if(night&&sup)return L(`${t} 开工（晚上价）却勾了 Lifting Supervisor，请确认`,`Night start ${t} but supervisor ticked`);
  if(!night&&!sup)return L(`${t} 开工（白天价）却没勾 Lifting Supervisor，请确认`,`Day start ${t} without supervisor`);
  return""}
const exactHours=(s,e)=>{const a=mins(s),b=mins(e);if(a==null||b==null)return null;let d=b-a;if(d<=0)d+=1440;return d/60};
const isTipLoad=d=>d.service==="Tipper"&&!d.start_time&&!d.end_time&&Number(d.loads)>0;
function lineTitle(l){if(l.desc)return l.desc;const m=l.material?l.material+" ":"";
  return {"Supply":`Supply ${m}inclusive transportation`,"Disposal":`Disposal of ${m}inclusive transportation`,"Disposal Only":`Disposal fee only${l.material?" – "+l.material:""}`,"Transfer":`Transfer ${l.material||""}`.trim(),
    "Internal Work":"Internal Work Charges","Lorry Crane":"Lorry Crane Charges","Excavator":"Excavator Rental"}[l.item]||l.item||""}
function calcLine(f,l){l.uom=l.uom||itemUom(l.item);
  const r=findL3Rate(f.customer_id,l.item,f.plate,f.do_date,l.material||null);l._auto=r?Number(r.price):null;
  if(!l._rt)l.rate=l._auto;
  if(!l._qt)l.qty=l.uom==="hr"?(f.billable_hours??null):(l.qty??1);
  l.amount=(l.qty!=null&&l.rate!=null)?r2(Number(l.qty)*Number(l.rate)):0;
  l._chg=l._auto!=null&&l.rate!=null&&Number(l.rate)!==l._auto;return l}
function recomputeL3(f){
  const crane=f.service==="Lorry Crane",why=[];f._otHours=null;f._otRate=null;
  const night=isNightStart(f.start_time);f.shift=f.start_time?(night?"Night":"Day"):null;
  if(crane){if(!f._supTouched){const dr=drvOf(f.driver);f.lifting_sup=!!dr?.usual_sup||!night}}else f.lifting_sup=null;
  if(f.hourly==null)f.hourly=true;
  f.charges=(f.charges||[]).map(l=>calcLine(f,l));
  f._tipLoad=f.service==="Tipper"&&!f.start_time&&!f.end_time;
  f.actual_hours=actualHours(f.start_time,f.end_time);
  if(f.record_only){f._rateRow=null;if(!f._rateTouched)f.rate=null;f.billable_hours=f.start_time?f.billable_hours:null;f._main=0;f.amount=0;f._autoRate=null;f._priceChanged=false;f._why=[L("只记录（NIL），不收钱 —— 例：Samwoh 的料","Record only (NIL) — not charged")];return f}
  if(f._tipLoad){const r=findL3Rate(f.customer_id,"Tipper Load",f.plate,f.do_date,null);f._rateRow=r;f._autoRate=r?Number(r.price):null;
    if(!f._rateTouched)f.rate=f._autoRate;f.billable_hours=null;f._hx=null;
    if(!f._surTouched)f.surcharge=0;
    const n=Number(f.loads)||0;f._main=n&&f.rate!=null?r2(n*f.rate):0;
    why.push(n?L(`没写时间 → 按 load：${n} load × $${money(f.rate)} = $${money(f._main)}`,`No time → by load: ${n} × $${money(f.rate)}`):L("没写时间 → 填「Load 数量」按 load 算","No time → enter loads"));
  }else{
    const rate=findL3Rate(f.customer_id,f.service,f.plate,f.do_date,null);f._rateRow=rate;
    if(!f.hours_overridden){let h=exactHours(f.start_time,f.end_time);
      if(h!=null)why.push(L(`实际 ${fmtH(h)} 小时`,`Actual ${fmtH(h)} hrs`));
      const after=rate?.break_after_hours!=null?Number(rate.break_after_hours):8,brk=rate?.break_hours!=null?Number(rate.break_hours):1;
      if(h!=null&&after&&h>after&&isCHC(f.customer_id)){h-=brk;why.push(L(`超过 ${after} 小时 → 扣 ${brk} 小时吃饭 → ${fmtH(h)}`,`Over ${after} hrs → minus ${brk} meal → ${fmtH(h)}`))}
      const cm=custOf(f.customer_id).min_hours_crane,min=crane&&cm!=null&&cm!==""?Number(cm):Number(rate?.min_hours)||0;
      if(h!=null&&min&&h<min){h=min;why.push(L(`不够最少 ${min} 小时 → 算 ${min}`,`Below min ${min} hrs → ${min}`))}
      f._hx=h;f.billable_hours=h==null?null:r2(h)}else{f._hx=f.billable_hours;why.push(L(`手动小时 ${f.billable_hours}`,`Manual hrs ${f.billable_hours}`))}
    const per8=isDayRate(rate);f._autoRate=rateFor(rate,night);
    if(!f._rateTouched)f.rate=f._autoRate;
    const dn=night?L("晚上价（17:00 或以后开工）","Night rate (start 17:00+)"):L("白天价（17:00 前开工）","Day rate (start before 17:00)");
    if(!f._surTouched)f.surcharge=findSurcharge(f.customer_id,f.service,f.do_date);
    if(per8&&f.hourly){const base=baseHrsOf(rate),otr=Number(night&&rate.ot_rate_night!=null?rate.ot_rate_night:rate.ot_rate)||0,ot=f._hx!=null?Math.max(0,f._hx-base):0;
      f._otHours=r2(ot);f._otRate=otr;f._main=f._hx!=null&&f.rate!=null?r2(Number(f.rate)+ot*otr):0;
      if(f.rate!=null)why.push(`${dn} ${f.plate||""} ${L(`${base} 小时 $${money(f.rate)}`,`${base} hrs $${money(f.rate)}`)}${ot?L(` + OT ${r2(ot)} 小时 × $${money(otr)}`,` + OT ${r2(ot)} × $${money(otr)}`):""}`)}
    else{f._main=f.hourly&&f._hx!=null&&f.rate!=null?r2(f._hx*f.rate):0;
      if(f.hourly&&f.rate!=null)why.push(`${dn} ${f.plate||f.service} $${money(f.rate)}/hr`)}
    const sw=supWarn(f);if(sw)why.push("⚠ "+sw);
    if(!f.hourly)why.push(L("不按小时收","Not charged by the hour"));
  }
  if(Number(f.surcharge))why.push(`Diesel Surcharge $${money(f.surcharge)}`);
  const mainChg=(f._tipLoad||f.hourly)&&f._autoRate!=null&&f.rate!=null&&Number(f.rate)!==Number(f._autoRate);
  if(mainChg)why.push(L(`⚠ 手动改价：系统价 $${money(f._autoRate)}，现在 $${money(f.rate)}`,`⚠ Price changed: system $${money(f._autoRate)}`));
  for(const l of f.charges)if(l._chg)why.push(L(`⚠ ${lineTitle(l)} 手动改价：系统价 $${money(l._auto)}`,`⚠ ${lineTitle(l)} price changed`));
  f._priceChanged=mainChg||f.charges.some(l=>l._chg);
  const empty=!f._tipLoad&&f.hourly&&f._hx==null&&!f.charges.length;
  f.amount=empty?null:r2(f._main+sum(f.charges,l=>l.amount)+(Number(f.surcharge)||0));
  {const sp=shareOf(f);f._shHrs=null;f._shSur=null;
    if(sp&&!f.record_only){const k=sp/100,full=f.amount;f._shHrs=f.billable_hours==null?null:r2(f.billable_hours*k);f._shSur=r2((Number(f.surcharge)||0)*k);f._main=r2(f._main*k);
      if(f.amount!=null)f.amount=r2(f._main+sum(f.charges,l=>l.amount)+f._shSur);
      why.push(L(`分摊 ${sp}%：计费小时 ${f.billable_hours??"—"} → ${f._shHrs??"—"}，Surcharge $${money(f.surcharge)} → $${money(f._shSur)}，金额 $${money(full)} → $${money(f.amount)}`,`${sp}% share: hrs ${f.billable_hours} → ${f._shHrs}, amount $${money(full)} → $${money(f.amount)}`))}}
  f._why=why;
  return f}
function calcViewL3(f){const ex=sum(f.charges||[],l=>l.amount);
  return `<div>Day/Night<b>${f.shift?`<span class="tag ${f.shift}">${f.shift}</span>`:"—"}</b></div>${f.service==="Lorry Crane"?`<div>Lifting Sup<b>${f.lifting_sup?`<span class="tag Day">✓ ${L("有","Yes")}</span>`:`<span class="tag mute">${L("没有","No")}</span>`}</b></div>`:""}
  ${f._otHours?`<div>OT<b>${f._otHours} hr × $${money(f._otRate)}</b></div>`:""}

/* ---- 时间重叠 / 可能重复 / ETK-L3H 交叉（同一辆车） ---- */
function spanOf(d,base){const s=mins(String(d.start_time||"").slice(0,5)),e=mins(String(d.end_time||"").slice(0,5));if(s==null||e==null)return null;
  let dur=e-s;if(dur<=0)dur+=1440;const off=daysBetween(base,d.do_date)*1440;return[off+s,off+s+dur]}
const overlap=(a,b)=>a&&b&&a[0]<b[1]&&b[0]<a[1];
const sameTxt=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
const isDupPair=(a,b)=>a.do_date===b.do_date&&(a.start_time&&b.start_time?String(a.start_time).slice(0,5)===String(b.start_time).slice(0,5)&&String(a.end_time||"").slice(0,5)===String(b.end_time||"").slice(0,5)
  :(!a.start_time&&!b.start_time&&sameTxt(a.from_loc,b.from_loc)&&sameTxt(a.to_loc,b.to_loc)&&sameTxt(a.description,b.description)));
let ovlTimer=null;
function checkOverlap(){clearTimeout(ovlTimer);ovlTimer=setTimeout(async()=>{const f=S.doForm,box=$("#ovl");if(!f||!box)return;
  const out=[];
  try{if(f.plate&&f.do_date){const{data}=await sb.from("delivery_orders").select("id,company,do_no,do_date,start_time,end_time,project,customer_id,plate,from_loc,to_loc,description,record_only,share_of").eq("plate",f.plate)
      .gte("do_date",addDays(f.do_date,-1)).lte("do_date",addDays(f.do_date,1));
    const me=spanOf(f,f.do_date);
    for(const d of data||[]){if(d.id===f.id||d.record_only||d.id===f.share_of||(f.id&&d.share_of===f.id))continue;const dup=isDupPair(f,d),ov=!dup&&overlap(me,spanOf(d,f.do_date));if(dup||ov)out.push({d,dup})}}
    if(String(f.do_no||"").trim()){const{data}=await sb.from("delivery_orders").select("id,company,do_no,do_date").eq("do_no",f.do_no.trim()).neq("company",S.company);
      for(const d of data||[])out.push({d,xco:true})}}catch(e){}
  if(S.doForm!==f)return;f._ovl=out;box.innerHTML=ovlMsg(f,out)},350)}
const coTag=d=>d.company&&d.company!==S.company?` <b class="tag warn" style="display:inline-block;width:auto">${esc(d.company)}</b>`:"";
const ovlMsg=(f,hit)=>(hit||[]).length?`<div class="note" style="border-color:#d9534f">${hit.map(({d,dup,xco})=>xco?`⚠ ${L(`${d.company} 也有 DO ${esc(d.do_no)}（${dmy(d.do_date)}），确认不是同一张。`,`${d.company} also has DO ${esc(d.do_no)} (${dmy(d.do_date)}).`)}`
  :dup?`⚠ ${L("可能重复：","Possible duplicate: ")}DO ${esc(d.do_no)}${coTag(d)}（${dmy(d.do_date)} ${tShort(d.start_time)}${d.start_time?"–"+tShort(d.end_time):""}${d.project?" · "+esc(d.project):""}）${L("—— 同一辆车同一份工，是不是录了两次？","— same vehicle, same job. Keyed in twice?")}`
  :`⚠ ${L("时间重叠：","Time overlap: ")}${esc(f.plate)} ${tShort(f.start_time)}–${tShort(f.end_time)} ${L("跟","overlaps")} DO ${esc(d.do_no)}${coTag(d)}（${dmy(d.do_date)} ${tShort(d.start_time)}–${tShort(d.end_time)}${d.project?" · "+esc(d.project):""} · ${esc(custName(d.customer_id)||"")}）${L("—— 同一辆车不能同时在两个地方。","— same vehicle can't be in two places.")}`).join("<br>")}<div class="mute" style="font-size:12px;margin-top:4px">${L("还是可以保存，但开单前要查清楚。","You can still save — check before billing.")}</div></div>`:"";
function overlapPairs(list){const out=[],by={};for(const d of list)if(d.plate&&!d.record_only)(by[d.plate]=by[d.plate]||[]).push(d);
  for(const ds of Object.values(by)){ds.sort((a,b)=>a.do_date.localeCompare(b.do_date));
    for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++){if(daysBetween(ds[i].do_date,ds[j].do_date)>1)break;
      if(ds[i].share_of===ds[j].id||ds[j].share_of===ds[i].id||(ds[i].share_of&&ds[i].share_of===ds[j].share_of))continue;const dup=isDupPair(ds[i],ds[j]);if(dup||overlap(spanOf(ds[i],ds[i].do_date),spanOf(ds[j],ds[i].do_date)))out.push([ds[i],ds[j],dup])}}

let GPS=null;
function gpsSave(){try{const keep=new Set([...(S.d.vehicles||[]).map(v=>normPlate(v.plate)),...S.d.delivery_orders.map(d=>normPlate(d.plate))]);const v={};
    for(const[k,a]of Object.entries(GPS.v))if(keep.has(k))v[k]=a.map(x=>[x.t.getTime(),x.e.getTime(),x.st,x.from,x.to]);

    for(const[k,a]of Object.entries(o.v))v[k]=a.map(([t,e,st,from,to])=>({t:new Date(t),e:new Date(e),st,from,to}));GPS={...o,v,co:S.company}}catch(e){}}
const normPlate=p=>String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const tHm=m=>{m=Math.round(m);return `${z2(Math.floor(m/60)%24)}:${z2(m%60)}`};
function gpsDur(v){if(typeof v==="number")return v*1440;const p=String(v||"").trim().split(":").map(Number);if(p.some(isNaN))return 0;return p.length===4?p[0]*1440+p[1]*60+p[2]+p[3]/60:p.length===3?p[0]*60+p[1]+p[2]/60:p.length===2?p[0]+p[1]/60:0}
function gpsParse(wb){const ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});const v={};let cur=null,from=null,to=null;
  for(const r of rows){const a=r[0];
    if(a instanceof Date){if(!cur)continue;const dur=gpsDur(r[1]),st=String(r[2]||"").trim().toLowerCase();cur.push({t:a,e:new Date(a.getTime()+dur*60000),st:st.startsWith("run")?"run":st.startsWith("idle")?"idle":st,km:String(r[3]||"").trim(),from:String(r[5]||"").trim(),to:String(r[6]||"").trim()});
      if(!from||a<from)from=a;if(!to||a>to)to=a;continue}
    if(typeof a==="string"&&a.trim()&&(r[1]===""||r[1]==null)&&!/^(total|period|\*|start)/i.test(a.trim())){const m=a.toUpperCase().replace(/\s+/g,"").match(/^[A-Z]{1,3}\d{1,4}[A-Z]?/);if(m){cur=v[m[0]]=v[m[0]]||[]}else cur=null}}
  return Object.keys(v).length?{v,from:from?dmy(ymdOf(from)):"",to:to?dmy(ymdOf(to)):""}:null}
const ymdOf=d=>`${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
function gpsDay(G,date){const d0=new Date(date+"T00:00:00"),d1=new Date(d0.getTime()+86400000),out=[];
  for(const x of G){if(x.e<=d0||x.t>=d1)continue;const a=Math.max(0,(x.t-d0)/60000),b=Math.min(1440,(x.e-d0)/60000);out.push({...x,a,b})}return out}
async function gpsFile(input){const f=input.files?.[0];input.value="";if(!f)return;

S.df=S.df||{};S.sort=S.sort||{};S.invSel=S.invSel||new Set();S.siSel=S.siSel||new Set();S.colHide=S.colHide||{};S.siAll=!!S.siAll;S.scr=S.scr||{};

  switch(f.p){case"tm":return mr(y,m);case"lm":return m===1?mr(y-1,12):mr(y,m-1);case"ty":return[`${y}-01-01`,`${y}-12-31`];case"ly":return[`${y-1}-01-01`,`${y-1}-12-31`];
    case"y":return f.y?[`${f.y}-01-01`,`${f.y}-12-31`]:[null,null];case"m":return f.y&&f.m?mr(+f.y,+f.m):f.y?[`${f.y}-01-01`,`${f.y}-12-31`]:[null,null];

const cssArgb=c=>{const m=String(c||"").match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);if(!m||(m[4]!=null&&+m[4]===0))return null;
  const h=[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,"0")).join("").toUpperCase();return h==="FFFFFF"?null:"FF"+h};
function cellNum(t){const s=String(t).replace(/ /g," ").trim();if(!s||s==="-"||s==="$ -"||s==="$-")return null;const neg=/^\(.*\)$/.test(s.replace(/^\$\s*/,""));
  const x=s.replace(/[$,\s()]/g,"");return /^-?\d+(\.\d+)?$/.test(x)?{v:(neg?-1:1)*Number(x),cur:s.includes("$"),dec:x.includes(".")}:null}
function tablesToSheets(wb,root){const pages=[...root.querySelectorAll(".pg")];const groups=new Map();
  for(const pg of pages){const headEl=[...pg.children].find(e=>e.tagName!=="TABLE"&&!e.classList.contains("pno")&&!e.classList.contains("mtt"));
    const head=headEl?headEl.innerText.split("\n").map(x=>x.trim()).filter(Boolean):[];
    for(const t of pg.querySelectorAll("table")){const pre=t.previousElementSibling?.classList.contains("mtt")?t.previousElementSibling.innerText.trim():"";
      const key=[...head,pre].join("|");if(!groups.has(key))groups.set(key,{head,pre,tables:[]});groups.get(key).tables.push(t)}}
  for(const g of groups.values()){const nm=g.pre||g.head.find(x=>!/^(INV NO|Customer|No\.|FOR MONTH|Transporter)/i.test(x))||"Summary";
    const ws=wb.addWorksheet(xlName(wb,nm));let r=1;for(const h of g.head){const c=ws.getRow(r++).getCell(1);c.value=h;c.font={bold:true}}
    if(g.pre){const c=ws.getRow(r++).getCell(1);c.value=g.pre;c.font={bold:true}}r++;
    let headDone=false,dataStart=null,widths=[];
    for(const t of g.tables){for(const tr of t.querySelectorAll("tr")){const isHead=!!tr.closest("thead");if(isHead&&headDone)continue;
        const isTot=tr.classList.contains("tt")||tr.classList.contains("st")||tr.classList.contains("crtt");
        const row=ws.getRow(r);let col=1;
        for(const td of tr.children){const span=+td.getAttribute("colspan")||1,txt=td.innerText.replace(/\s*\n\s*/g," ").trim(),cell=row.getCell(col);
          const num=isHead?null:cellNum(txt);
          if(isTot&&num&&dataStart!=null&&r>dataStart){const L1=ws.getColumn(col).letter;cell.value={formula:`SUM(${L1}${dataStart}:${L1}${r-1})`,result:num.v}}
          else cell.value=num?num.v:txt;
          if(num)cell.numFmt=num.cur?'"$"#,##0.00':num.dec?MONEY:"0.##";
          if(isHead){cell.font={bold:true};const fill=cssArgb(getComputedStyle(td).backgroundColor);if(fill)cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:fill}};cell.alignment={horizontal:"center",vertical:"middle",wrapText:true}}
          else{cell.alignment={horizontal:num?"right":"center",vertical:"top",wrapText:txt.length>40}}
          if(isTot)cell.font={bold:true};if(!isTot||txt)cell.border=isTot?{bottom:{style:"double"}}:BOX;
          widths[col]=Math.max(widths[col]||6,Math.min(45,txt.length+2));col+=span}
        if(isHead){headDone=true;row.height=30;dataStart=r+1}r++}}
    widths.forEach((w,i)=>{if(i)ws.getColumn(i).width=w});
    ws.pageSetup={paperSize:9,orientation:g.tables[0]?.closest(".land")?"landscape":"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}}
  return groups.size}

    ...ex.map(x=>({supplier_invoice_id:null,description:x.d||"",amount:Number(x.a)||0}))].map((l,i)=>({...l,line_no:i+1}));
  const row={company:S.company,supplier_id:f.supplier_id,pv_date:f.pv_date||(f.id&&pvById(f.id)?.pv_date)||today(),date_blank:!f.pv_date,account:f.account||null,cheque_no:f.cheque_no||null,prepared_by:f.prepared_by||null,remark:f.remark||null,total:r2(sum(lines,l=>l.amount))};
  let id=f.id;const old=id?pvById(id):null,oldIds=id?pvLines(id).map(l=>l.supplier_invoice_id).filter(Boolean):[];
  if(old&&(old.status||"Pending")!=="Pending"){const why=prompt(L(`这张 PV 已经是「${old.status}」。修改原因：`,`PV is ${old.status}. Reason for the change:`),"");if(!why)return;
    row.remark=[old.remark||"",`[${dmy(today())} ${L("修改","edited")}: ${why}]`].filter(Boolean).join(" ")}
  const noCol=e=>e&&/date_blank/i.test(e.message||"");let warnDB=false;
  if(id){let{error}=await sb.from("payment_vouchers").update(row).eq("id",id);if(noCol(error)){warnDB=true;delete row.date_blank;({error}=await sb.from("payment_vouchers").update(row).eq("id",id))}if(error)return w.textContent=error.message}
  else{let{data,error}=await sb.from("payment_vouchers").insert({...row,status:"Pending"}).select().single();if(noCol(error)){warnDB=true;delete row.date_blank;({data,error}=await sb.from("payment_vouchers").insert({...row,status:"Pending"}).select().single())}if(error)return w.textContent=error.message;id=data.id}
  if(warnDB&&!f.pv_date)alert(L("PV 已保存，但日期没办法留空：还没跑「补充-PV日期空白-Supabase.sql」。跑完再打开这张 PV 保存一次就好。","Saved, but run the PV blank-date SQL so the date can stay blank."));
  {const oldL=id&&f.id?pvLines(id).map(l=>l.id):[];const{error}=await sb.from("payment_voucher_lines").insert(lines.map(l=>({...l,pv_id:id})));if(error)return w.textContent=error.message;
    if(oldL.length)await sb.from("payment_voucher_lines").delete().in("id",oldL)}
  if(old&&old.status==="Paid"){const now=new Set(lines.map(l=>l.supplier_invoice_id).filter(Boolean)),rem=oldIds.filter(x=>!now.has(x)),add=[...now].filter(x=>!oldIds.includes(x));

    if(add.length)await sb.from("supplier_invoices").update({payment_date:old.paid_at||today(),status:"Paid"}).in("id",add)}

/* 合成 PDF：项目可以是附件（扫描 / PDF）或 HTML 页 */
async function buildPdf(items,filename,opt={}){await loadPdfLibs();const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true}),box=$("#print"),warn=[];let first=true,n=0;

      if(it.att){try{for(const src of await attPages(it.att,it.max||20)){await addImagePage(pdf,first,src,0);first=false}continue}catch(e){warn.push(`${it.label||""}: ${e.message}`);if(!it.html)continue}}
      if(it.html){box.innerHTML=it.html;box.classList.add("cap");if(document.fonts?.ready)await document.fonts.ready;await new Promise(r=>setTimeout(r,40));
        for(const el of box.querySelectorAll(".pg")){const land=el.classList.contains("land"),W=land?297:210,H=land?210:297,cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false});
          if(!first)pdf.addPage("a4",land?"landscape":"portrait");first=false;let w=W,h=cv.height*W/cv.width;if(h>H){h=H;w=cv.width*H/cv.height}

    toast(`${a.download} · ${kb(blob.size)}${warn.length?" · ⚠ "+warn.length:""}`);return warn}
  finally{box.classList.remove("cap");box.innerHTML=keep;if(pv)box.classList.add("pv")}}

/* ================= L3H 第二批：Excavator / 机械 ================= */
const FAR="9999-12-31";
const mOf=code=>S.d.machines.find(m=>m.code===code);
const mName=(code,b)=>{const m=mOf(code);return `${m?.model||code}${b?" with breaker":""} (${code})`};
const mRates=(code,b)=>{const m=mOf(code)||{};return b?{d:m.rate_day_b,w:m.rate_week_b,m:m.rate_month_b}:{d:m.rate_day,w:m.rate_week,m:m.rate_month}};
const dCount=(a,b)=>daysBetween(a,b)+1;
const oneMonthEnd=s=>{const d=parseD(s);return ymd(new Date(d.getFullYear(),d.getMonth()+1,d.getDate()-1))};
const dmyDash=s=>{const[y,m,d]=s.split("-");return `${d}-${m}-${y.slice(2)}`};
const isBilledRef=l=>/^L3H\s*\//i.test(String(l.invoice_ref||"").trim());
const isNARef=l=>/^n\/?a$/i.test(String(l.invoice_ref||"").trim());
const logEnd=l=>l.end_date||FAR;
const activeLog=l=>!l.cancelled&&(l.status==="Rental"||l.status==="Standby");
/* 计价方式：不到 7 天按日；不到 1 个月按周；满 1 个月按月（看整笔租期） */
function rateTypeOf(l,asOf){if(l.rate_type)return l.rate_type;const e=l.end_date||asOf||today(),n=dCount(l.start_date,e);
  if(n<7)return"Daily";if(e<oneMonthEnd(l.start_date))return"Weekly";return"Monthly"}
function rateOf(l,type){if(l.rate!=null&&l.rate!=="")return Number(l.rate);const r=mRates(l.machine_code,l.breaker);const v=type==="Daily"?r.d:type==="Weekly"?r.w:r.m;return v==null||v===""?null:Number(v)}
const fullMonth=(a,b)=>a.slice(8)==="01"&&b===lastDayOf(a.slice(0,7));
function amtFor(type,rate,a,b){const n=dCount(a,b);if(rate==null)return null;
  if(type==="Daily")return r2(rate*n);if(type==="Weekly")return r2(rate/7*n);return fullMonth(a,b)?r2(rate):r2(rate/30*n)}
const typeZh=t=>({Daily:L("按日","Daily"),Weekly:L("按周","Weekly"),Monthly:L("按月","Monthly")}[t]||t);

/* ---- 检查：撞期 / 同 project 月租已包 / Standby ---- */
function mIssues(){const out={},add=(id,x)=>(out[id]=out[id]||[]).push(x),by={};
  for(const l of S.d.mlogs){if(activeLog(l))(by[l.machine_code]=by[l.machine_code]||[]).push(l);if(activeLog(l)&&l.status==="Rental"&&isBilledRef(l)&&!l.end_date)add(l.id,{k:"openref"})}
  for(const ls of Object.values(by))for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const a=ls[i],b=ls[j];
    if(!(a.start_date<=logEnd(b)&&b.start_date<=logEnd(a)))continue;
    const ov=[a.start_date>b.start_date?a.start_date:b.start_date,logEnd(a)<logEnd(b)?logEnd(a):logEnd(b)];
    if(a.status==="Rental"&&b.status==="Rental"){
      if((a.project||"")===(b.project||"")){const ma=rateTypeOf(a)==="Monthly",mb=rateTypeOf(b)==="Monthly";
        if(ma!==mb){const mon=ma?a:b,oth=ma?b:a;add(oth.id,{k:"cover",o:mon,ov});add(mon.id,{k:"covers",o:oth,ov})}
        else{add(a.id,{k:"dup",o:b,ov});add(b.id,{k:"dup",o:a,ov})}}
      else{add(a.id,{k:"clash",o:b,ov});add(b.id,{k:"clash",o:a,ov})}}
    else{add(a.id,{k:"standby",o:b,ov});add(b.id,{k:"standby",o:a,ov})}}
  return out}
const ovTxt=ov=>`${dmy(ov[0])}–${ov[1]===FAR?L("现在","now"):dmy(ov[1])}`;
function issueTags(list,max){const all=list||[],more=max&&all.length>max?all.length-max:0;return(max?all.slice(0,max):all).map(x=>x.k==="clash"?`<span class="tag bad" title="${esc(L(`跟 ${x.o.project||"?"} 撞期`,`Clash with ${x.o.project}`))}">${L("撞期","Clash")} ${esc(x.o.project||"")} ${ovTxt(x.ov)}</span>`
  :x.k==="dup"?`<span class="tag bad">${L("同 project 重复","Duplicate")} ${ovTxt(x.ov)}</span>`
  :x.k==="cover"?`<span class="tag mute">${L("已包括在月租","In monthly")} ${ovTxt(x.ov)}</span>`
  :x.k==="standby"?`<span class="tag warn">${L("Standby 期间又有记录","Standby overlap")} ${ovTxt(x.ov)}</span>`
  :x.k==="openref"?`<span class="tag warn" title="${esc(L("有旧 Invoice No. 但没有结束日期：请把结束日期填成已经 bill 到的那天，之后继续用的另外新增一笔","Old invoice no. but no end date"))}">${L("有 Invoice 但没结束日期","Invoice but open")}</span>`:"").join(" ")+(more?` <span class="tag mute" title="${esc(all.slice(max).map(x=>x.k).join(", "))}">+${more}</span>`:"")}
/* 同一台机、同一个 project 的月租盖住的日子 */
function monthlyCover(l){if(rateTypeOf(l)==="Monthly")return[];
  return S.d.mlogs.filter(o=>o.id!==l.id&&activeLog(o)&&o.status==="Rental"&&o.machine_code===l.machine_code&&(o.project||"")===(l.project||"")&&rateTypeOf(o)==="Monthly"&&o.start_date<=logEnd(l)&&l.start_date<=logEnd(o)).map(o=>[o.start_date,logEnd(o)])}
const inRanges=(d,rs)=>rs.some(([a,b])=>a<=d&&d<=b);
function dayRanges(days){const out=[];for(const d of days){const last=out.at(-1);if(last&&addDays(last[1],1)===d)last[1]=d;else out.push([d,d])}return out}

/* ---- 开单：这个 project 这段期间可以 bill 的机械 ---- */
function machineBillRows(project,from,to,invId){const rows=[],skipped=[];
  for(const l of S.d.mlogs){if(!activeLog(l)||l.status!=="Rental"||(l.project||"")!==(project||""))continue;
    if(!(l.start_date<=to&&logEnd(l)>=from))continue;
    if(isBilledRef(l)){skipped.push({l,why:l.end_date?L(`已 bill（${l.invoice_ref}）`,`Billed (${l.invoice_ref})`):L(`有旧 Invoice No.（${l.invoice_ref}）但没有结束日期 —— 请填已 bill 到哪天，之后的另外新增一笔，才可以开单`,`Old invoice ${l.invoice_ref} but no end date — set billed-through date first`)});continue}
    if(isNARef(l)){skipped.push({l,why:L("Invoice 写 NA，不收钱","NA — not billed")});continue}
    const a=l.start_date>from?l.start_date:from,b=logEnd(l)<to?logEnd(l):to;
    const billed=S.d.mbills.filter(x=>x.log_id===l.id&&x.invoice_id!==invId).map(x=>[x.period_from,x.period_to]),cover=monthlyCover(l);
    const days=[],cov=[],dup=[];for(let d=a;d<=b;d=addDays(d,1)){if(inRanges(d,billed))dup.push(d);else if(inRanges(d,cover))cov.push(d);else days.push(d)}
    if(dup.length)skipped.push({l,why:L(`${dayRanges(dup).map(([x,y])=>dmy(x)+"–"+dmy(y)).join(", ")} 已经 bill 过`,`Already billed`)});
    if(cov.length)skipped.push({l,why:L(`${dayRanges(cov).map(([x,y])=>dmy(x)+"–"+dmy(y)).join(", ")} 已包括在同 project 月租`,`In monthly rental`)});
    const type=rateTypeOf(l,to),rate=rateOf(l,type);
    for(const[x,y]of dayRanges(days))rows.push({l,from:x,to:y,days:dCount(x,y),type,rate,amount:amtFor(type,rate,x,y)})}
  rows.sort((p,q)=>p.l.machine_code.localeCompare(q.l.machine_code)||p.from.localeCompare(q.from));
  return{rows,skipped}}
function machineLines(rows){return rows.map(r=>{const l=r.l,loc=l.loc_to||l.loc_from||"",fm=fullMonth(r.from,r.to)&&r.type==="Monthly";
  const head=`${mName(l.machine_code,l.breaker)}${loc?` (${loc})`:""}`,per=`Period rental : ${dmyDash(r.from)} to ${dmyDash(r.to)}`;
  if(fm)return{description:`${head}\n${per}`,qty:1,unit:"mth",unit_price:r.rate,amount:r.amount};
  if(r.type==="Daily")return{description:`${head}\n${per}`,qty:r.days,unit:"day",unit_price:r.rate,amount:r.amount};
  return{description:`${head}\n${per}\n(${r.type==="Weekly"?L("Weekly","Weekly"):"Monthly"} $${money(r.rate)} ÷ ${r.type==="Weekly"?7:30} × ${r.days} days)`,qty:r.days,unit:"days",unit_price:null,amount:r.amount}})}
const isMachInv=i=>i?.kind==="machine";
/* ---- 运输 invoice 里面加 Excavator 月租 ---- */
const sumTitleAuto=inv=>inv.kind==="machine"?"PROVIDE MACHINERY / EQUIPMENT":(inv.id&&mxBills(inv.id).length)||(inv.lines||[]).some(l=>l._mx)?"TRANSPORT SERVICES / MACHINERY RENTAL":"TRANSPORT SERVICES";
const mxBills=invId=>S.d.mbills.filter(b=>b.invoice_id===invId);
const mxRowsFromBills=invId=>mxBills(invId).map(b=>({l:S.d.mlogs.find(l=>l.id===b.log_id)||{machine_code:""},from:b.period_from,to:b.period_to,days:b.days,type:b.rate_type,rate:Number(b.rate),amount:Number(b.amount)})).sort((p,q)=>String(p.l.machine_code).localeCompare(String(q.l.machine_code))||p.from.localeCompare(q.from));
function mxPeriod(f){const a=f.period_from||String(f.invoice_date||today()).slice(0,7)+"-01",b=f.period_to||(()=>{const y=+a.slice(0,4),m=+a.slice(5,7);return `${a.slice(0,7)}-${z2(lastDay(y,m))}`})();return[a,b]}
function mxLoad(){const f=S.modal.f;if(!f.project)return toast(L("先选 Project","Choose a project first"));const[a,b]=mxPeriod(f);
  f._mx=machineBillRows(f.project,a,b,f.id);const had=new Set(mxBills(f.id).map(x=>x.log_id));
  f.mxsel=new Set(f._mx.rows.map((r,i)=>had.size?(had.has(r.l.id)?i:-1):i).filter(i=>i>=0));
  if(!f._mx.rows.length)toast(L(`${f.project} 在 ${dmy(a)}–${dmy(b)} 没有要 bill 的机械`,"Nothing to bill"));render()}
function mxApply(){const f=S.modal.f;if(!f._mx)return;const rows=f._mx.rows.filter((_,i)=>f.mxsel.has(i));
  const np=rows.filter(r=>r.rate==null);if(np.length)return toast(L(`${np.map(r=>r.l.machine_code).join(", ")} 没有价钱，先到 Excavator → 机器 & 价钱 填好`,"Missing rates"));
  /* 拿掉之前加的月租明细（这次画面加的 + 已经存过的那几行） */
  let keep=f.lines.filter(l=>!l._mx);if(!f._mxStripped&&f.id){const n=mxBills(f.id).length;if(n&&keep.length>n)keep=keep.slice(0,keep.length-n);f._mxStripped=true}
  f.lines=[...keep,...machineLines(rows).map(l=>({...l,_mx:true}))];f._mxchosen=rows;mxDesc(f,rows.length>0);render();
  toast(rows.length?L(`已加 ${rows.length} 行 Excavator 月租到明细`,`${rows.length} rental line(s) added`):L("已拿掉 Excavator 月租","Rental lines removed"))}

async function excSave(){const e=S.exc.edit,fd=new FormData($("#excForm")),w=$("#excWarn"),g=k=>{const v=fd.get(k);return v===""||v==null?null:String(v).trim()};
  const row={company:S.company,machine_code:g("machine_code"),breaker:fd.get("breaker")==="true",status:g("status")||"Rental",project:g("project"),person:g("person"),phone:g("phone"),
    loc_from:g("loc_from"),loc_to:g("loc_to"),start_date:g("start_date"),end_date:g("end_date"),rate_type:g("rate_type"),rate:g("rate")==null?null:Number(g("rate")),invoice_ref:g("invoice_ref"),remark:g("remark"),cancelled:fd.get("cancelled")==="on"};
  if(!row.machine_code||!row.start_date){w.textContent=L("请选机器、填开始日期","Machine and start date are required");return}
  if(row.end_date&&row.end_date<row.start_date){w.textContent=L("结束日期不能早过开始日期","End date is before start");return}
  if(row.status==="Rental"&&!row.project&&!confirm(L("没有填 Project，开单时会找不到。还是要保存？","No project — it won't be billed. Save anyway?")))return;
  if(e.id){const bills=S.d.mbills.filter(b=>b.log_id===e.id);
    if(bills.length&&(row.start_date!==e.start_date||row.end_date!==(e.end_date||null)||row.project!==(e.project||null)||row.machine_code!==e.machine_code)){
      const minB=bills.map(b=>b.period_from).sort()[0],maxB=bills.map(b=>b.period_to).sort().at(-1);
      if(row.start_date>minB||(row.end_date&&row.end_date<maxB)||row.project!==(e.project||null)||row.machine_code!==e.machine_code){w.textContent=L(`这笔已经开单（${dmy(minB)}–${dmy(maxB)}），不能改掉已开单的日子、Project 或机器。要改请先删除那张 invoice。`,"Billed dates/project/machine can't be changed.");return}}}
  const res=e.id?await sb.from("machine_logs").update(row).eq("id",e.id).select().single():await sb.from("machine_logs").insert(row).select().single();
  if(res.error){w.textContent=res.error.message;return}

  render()}
async function excDel(id){if(S.d.mbills.some(b=>b.log_id===id))return toast(L("这笔已经开单，要先删除那张 invoice 才可以删除。","Billed — delete the invoice first."));

  toast(L("已删除","Deleted"));S.exc.edit=null;done();await loadAll();render()}

function excConfirm(){const t=today(),open=S.d.mlogs.filter(l=>activeLog(l)&&l.start_date<=t&&(!l.end_date||l.end_date>=addDays(t,-7)));

  else if(lines.length&&Math.abs(ls-(Number(i.amount_before_gst)||0))>0.01)iss.push(L(`明细合计 $${money(ls)} ≠ Amt before GST $${money(i.amount_before_gst)}`,`Lines $${money(ls)} ≠ subtotal`));

function parseReceipt(lines){const T=lines.join("\n"),amts=l=>(l.match(/-?\d{1,3}(?:,\d{3})+\.\d{2}\b|-?\d+\.\d{2}\b/g)||[]).map(x=>Number(x.replace(/,/g,"")));
  let amount=null;for(const rx of[/total\s*(amount|paid|payment)|amount\s*(paid|transferred|debited|credited)|payment\s*amount|transfer\s*amount|you\s*(paid|sent|transferred)/i,/amount|sgd|s\$|total|paid/i]){const v=lines.filter(l=>rx.test(l)).flatMap(amts).filter(v=>v>0);if(v.length){amount=Math.max(...v);break}}
  if(amount==null){const v=amts(T).filter(v=>v>0);if(v.length)amount=Math.max(...v)}
  let date=null;for(const l of lines)if(/date|on\b|time/i.test(l)){const d=dateIn2(l);if(d){date=d;break}}if(!date)for(const l of lines){const d=dateIn2(l);if(d){date=d;break}}
  const rm=T.match(/(?:ref(?:erence)?|transaction|txn|trans(?:fer)?)\s*(?:no\.?|id|number|ref(?:erence)?)?\.?\s*[:：#]?\s*([A-Z0-9\-\/]*\d[A-Z0-9\-\/]{4,})/i);
  const method=/paynow/i.test(T)?"PayNow":/cheque|chq\b/i.test(T)?"Cheque":/giro|fast|transfer|ibg|meps|\btt\b|remittance/i.test(T)?"Bank Transfer":null;
  let cust="",bl=0;const N=" "+normCo(T)+" ";for(const c of S.d.customers){const n=normCo(c.name);if(n.length<4)continue;if(N.includes(" "+n+" ")&&n.length>bl){bl=n.length;cust=c.id}}
  if(!cust){for(const c of S.d.customers){const w=normCo(c.name).split(" ").filter(x=>x.length>3&&!/^(PTE|LTD|PRIVATE|LIMITED|CONSTRUCTION|ENGINEERING|SERVICES|COMPANY|AND)$/.test(x));if(w.length&&w.every(x=>N.includes(" "+x+" "))&&w.join("").length>bl){bl=w.join("").length;cust=c.id}}}
  const A=suAn(T),invs=S.d.invoices.filter(i=>i.company===S.company&&(!cust||i.customer_id===cust)&&suAn(i.invoice_no).length>=6&&A.includes(suAn(i.invoice_no)));
  return{amount,date,ref:rm?rm[1]:"",method,cust,invs}}

const soaOff=cid=>(S.soaOff=S.soaOff||{})[cid]||(S.soaOff[cid]=new Set());
function soaData(cid,asOf,all){const off=all?new Set():soaOff(cid);
  const rows=S.d.invoices.filter(i=>i.customer_id===cid&&i.status!=="Cancelled"&&i.invoice_date<=asOf&&balOf(i)>0.005&&!off.has(i.id)).sort((a,b)=>a.invoice_date.localeCompare(b.invoice_date));
  const ag={cur:0,d30:0,d60:0,d90:0,over:0};
  for(const i of rows){const d=overdueDays(i,asOf),b=balOf(i);if(!d)ag.cur+=b;else if(d<=30)ag.d30+=b;else if(d<=60)ag.d60+=b;else if(d<=90)ag.d90+=b;else ag.over+=b}
  for(const k in ag)ag[k]=r2(ag[k]);
  const credit=r2(S.d.payments.filter(p=>p.customer_id===cid).reduce((s,p)=>s+Number(p.amount)-sum(S.d.payment_allocations.filter(a=>a.payment_id===p.id),a=>a.amount),0));
  const bal=sum(rows,balOf),intr=sum(rows,i=>interestOf(i,asOf));
  return{rows,ag,credit,bal,intr,total:r2(bal+intr-credit)};
}

  const text=`Dear ${c.attention||c.name||"Sir/Madam"},\n\nPlease find our statement of account as at ${dmy(S.soaAsOf)}:\n${lines}\n${D.intr?`Interest: $${money(D.intr)}\n`:""}${D.credit>0.005?`Less credit: $${money(D.credit)}\n`:""}Total outstanding: $${money(D.total)}\n\nKindly arrange payment. Please ignore if payment has been made.\n\nThank you.\n${s.name}`;
  openOut(via,c,`Statement of Account as at ${dmy(S.soaAsOf)} - ${s.name}`,text);
  setTimeout(async()=>{if(confirm(L("已经发送 SOA 了吗？按确定记录。","Statement sent? Press OK to record it."))){
    const{error}=await sb.from("soa_sends").insert({company:S.company,customer_id:cid,as_of:S.soaAsOf,sent_at:today(),sent_via:via});if(error)return toast(error.message);await printSOA("save");await loadAll();render()}},900)}

function actionLists(){const td=today(),inv=S.d.invoices.filter(i=>i.status!=="Cancelled"),m=td.slice(0,7)+"-01";
  return{overdue:inv.filter(i=>overdueDays(i)>0).sort((a,b)=>overdueDays(b)-overdueDays(a)),
    apOver:S.d.supplier_invoices.filter(s=>siMine(s)&&!s.payment_date&&s.due_date&&s.due_date<td),
    mism:S.d.supplier_invoices.filter(s=>siMine(s)&&!surchargeCheck(s).ok),
    unchecked:inv.filter(i=>!i.checked),unsent:inv.filter(i=>i.checked&&!i.sent_at),
    unsigned:inv.filter(i=>i.checked&&!signedOf(i)&&!i.sent_at),signedUnsent:inv.filter(i=>signedOf(i)&&!i.sent_at),
    noPhoto:S.d.delivery_orders.filter(d=>!doPhotos(d.id).length),
    mfPend:S.d.monthly_fix.filter(mfApplies(m)).filter(c=>!["Billed","Skipped"].includes(mfLog(c.id,m)?.status)),
    apSoon:S.d.supplier_invoices.filter(s=>siMine(s)&&!s.payment_date&&s.due_date&&s.due_date>=td&&s.due_date<=addDays(td,7))}}
const siMine=x=>!x.charged_to||x.charged_to===S.company;
function dataIssues(){const out=[],td=today(),lo="2015-01-01",hi=addDays(td,60),co=S.company;
  const odd=d=>d&&(d<lo||d>hi),why=d=>d<lo?L(`日期太早 ${dmy(d)}`,`too early ${dmy(d)}`):L(`未来日期 ${dmy(d)}`,`future ${dmy(d)}`);
  const sis=S.d.supplier_invoices.filter(x=>!x.charged_to||x.charged_to===co),seen=new Map();
  for(const x of sis){const go=`S.tab='sup';S.sub.sup='supplier_invoices';gEdit('supplier_invoices','${x.id}')`,t=`${supName(x.supplier_id)} · ${x.invoice_no}`;
    if(odd(x.invoice_date))out.push({t,why:why(x.invoice_date),go});
    if(!(Number(x.total)>0)&&!(Number(x.total)<0))out.push({t,why:L("金额是 0","zero amount"),go});
    if(!x.charged_to)out.push({t,why:L("To 谁 空白","no company"),go});
    const k=x.supplier_id+"|"+sqComp(x.invoice_no);if(seen.has(k))out.push({t,why:L("重复单号","duplicate no."),go});else seen.set(k,1)}
  const seenI=new Map();
  for(const i of S.d.invoices){const go=`openInv('${i.id}')`,t=`${i.invoice_no} · ${custName(i.customer_id)}`;
    if(odd(i.invoice_date))out.push({t,why:why(i.invoice_date),go});
    if(!(Number(i.total)>0)&&!(Number(i.total)<0)&&i.status!=="Cancelled")out.push({t,why:L("金额是 0","zero amount"),go});
    const k=normNo(i.invoice_no);if(seenI.has(k))out.push({t,why:L("重复单号","duplicate no."),go});else seenI.set(k,1)}
  for(const p of S.d.payments)if(odd(p.payment_date))out.push({t:`${L("收款","Payment")} · ${custName(p.customer_id)} · $${money(p.amount)}`,why:why(p.payment_date),go:`S.tab='pay';render();openPayForm(S.d.payments.find(x=>x.id==='${p.id}'))`});
  return out}

      <td><input class="inp" value="${esc(l?.remark||"")}" onchange="mfSet('${c.id}','remark',this.value)"></td>

function newWorker(){const w={busy:false,p:null};w.p=Tesseract.createWorker("eng").catch(e=>{TWP.splice(TWP.indexOf(w),1);throw e});TWP.push(w);return w}
async function withWorker(fn){await loadTess();let w=TWP.find(x=>!x.busy);if(!w&&TWP.length<OCR_N)w=newWorker();
  if(!w){await new Promise(r=>TWQ.push(r));return withWorker(fn)}
  w.busy=true;try{return await fn(await w.p)}finally{w.busy=false;const n=TWQ.shift();if(n)n()}}
function warmOCR(){if(navigator.onLine===false)return;setTimeout(()=>loadTess().then(()=>{if(!TWP.length)newWorker()}).catch(()=>{}),300)}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const x=items[i++];try{await fn(x)}catch(e){}}}))}
async function readDocLines(file,pages=2){const isPdf=/pdf/i.test(file.type||file.name);let lines=[];
  if(isPdf){try{lines=await pdfLines(file,pages)}catch(e){lines=[]}}
  if(lines.join("").replace(/\s/g,"").length>=30)return{lines,ocr:false};
  try{lines=await ocrLines(file)}catch(e){return{lines:[],ocr:true,fail:true}}
  return{lines,ocr:true}}
async function ocrLines(file,maxPages=1){let imgs=[];
  if(/pdf/i.test(file.type||file.name)){await loadPdfJs();const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.78}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;imgs.push(c)}}
  else imgs=[file];
  const out=[];for(const im of imgs){const r=await withWorker(w=>w.recognize(im));out.push(...String(r?.data?.text||"").split("\n"))}
  return out.map(x=>x.trim()).filter(Boolean)}

let SU=null;
function suUp(){SU={files:[],take:new Set()};suRender();warmOCR()}
async function suFiles(input){const fs=[...input.files];input.value="";const add=[];const pg=$("#suProg");if(pg)pg.textContent=L("读取中…","Reading…");
  for(const f of fs){if(/\.zip$/i.test(f.name)){try{await loadJSZip();const z=await JSZip.loadAsync(await f.arrayBuffer());
        for(const e of Object.values(z.files)){if(e.dir||!/\.(pdf|jpe?g|png)$/i.test(e.name)||/(^|\/)__MACOSX\//.test(e.name))continue;const nm=e.name.split("/").pop();add.push(new File([await e.async("blob")],nm,{type:/\.pdf$/i.test(nm)?"application/pdf":"image/jpeg"}))}}
      catch(e){alert(f.name+": "+e.message)}}
    else if(/\.(pdf|jpe?g|png)$/i.test(f.name))add.push(f)}
  for(const f of add)if(!SU.files.some(x=>x.name===f.name))SU.files.push({name:f.name,file:f});
  suAnalyse();suRender();suRead()}
const suAn=s=>String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function suFind(text){const b=suAn(text);if(b.length<4)return null;let best=null,bl=0,tie=false;
  for(const i of S.d.invoices){const k=suAn(i.invoice_no);if(k.length<5)continue;const kk=k.replace(new RegExp("^"+S.company),"");
    const hit=b===k||b.includes(k)||(kk.length>=5&&b.includes(kk)&&/\d/.test(kk));if(!hit)continue;const len=b.includes(k)?k.length+10:kk.length;
    if(len>bl){best=i;bl=len;tie=false}else if(len===bl&&best&&best.id!==i.id)tie=true}
  return tie?null:best}
function suAnalyse(){for(const x of SU.files){
    if(x.manual){const i=S.d.invoices.find(v=>suAn(v.invoice_no)===suAn(x.manual));x.inv=i||null}
    else if(x.inv===undefined){const i=suFind(x.name);if(i)x.inv=i;else if(/\.(pdf|jpe?g|png)$/i.test(x.name)){x.inv=null;x.reading=true}else x.inv=null}
    const i=x.inv;x.st=x.reading?"reading":!i?"none":S.d.attachments.some(a=>a.entity_type==="invoice"&&a.entity_id===i.id&&a.kind===SIGNED_KIND&&a.file_name===x.name)?"same":signedOf(i)?"has":"ok";
    if(!x._init&&x.st!=="reading"){if(x.st==="ok")SU.take.add(x.name);x._init=1}}}
async function suRead(){if(SU._busy)return;SU._busy=true;try{await pool(SU.files.filter(f=>f.reading),OCR_N,async x=>{try{const{lines,ocr}=await readDocLines(x.file,1),r=parseInvText(lines);x.ocr=ocr;
      let i=r.no?suFind(r.no):null;if(!i){const hit=lines.join(" ").match(new RegExp(S.company+"\\s*[\\/\\-]\\s*(INV\\s*[\\/\\-]\\s*)?\\d{4}\\s*[\\/\\-]\\s*\\d{1,3}","i"));if(hit)i=suFind(hit[0])}
      x.inv=i||null;x.readNo=r.no||""}catch(e){x.inv=null}
    x.reading=false;suAnalyse();if($("#suGo")||$("#photoOv"))suRender()})}finally{SU._busy=false}if(SU.files.some(f=>f.reading))setTimeout(suRead,0)}
function suSet(name,v){const x=SU.files.find(f=>f.name===name);if(!x)return;x.manual=String(v||"").trim();x._init=0;suAnalyse();suRender()}
const SU_ST={ok:["ok",["配对到","Matched"]],has:["warn",["已经有签名页（要换就打勾）","Has a signed page (tick to replace)"]],same:["mute",["已经上传过","Already uploaded"]],none:["bad",["配不到","No match"]],reading:["mute",["读取中…","Reading…"]]};
function suRender(){const F=SU.files,cnt=k=>F.filter(x=>x.st===k).length,go=F.filter(x=>SU.take.has(x.name)&&["ok","has"].includes(x.st));
  const order={reading:0,none:1,has:2,ok:3,same:4},rows=[...F].sort((a,b)=>order[a.st]-order[b.st]||String(a.inv?.invoice_no||a.name).localeCompare(String(b.inv?.invoice_no||b.name)));
  pvOv(`<div class="pvhead"><h3 style="margin:0">⬆ ${L("上传 Sales Invoice","Upload sales invoices")} · ${S.company}</h3><span style="flex:1"></span><button class="btn sec sm" data-a="x">✕</button></div>
  <p class="mute" style="font-size:13px;margin-top:0">${L("你以前做好的 Sales Invoice（签好的或原本的 PDF / 照片）。可以一次选很多个，或直接选整包 zip。系统先看文件名里的单号（例：ETK-INV-2609-17.pdf、L3H_2607_32.pdf），没有就读 PDF 里的 Invoice No。放进去当作那张 invoice 的签名页：月底签名第一页合并、寄客户版本都会用到；导入的旧单按 👁 / ⬇ 会直接打开这个原本的 PDF。","Your earlier sales invoices (PDF / photo). Matched by invoice no in the file name, else read from the PDF. Saved as the signed page.")}</p>
  <label class="btn file">⬆ ${L("选 PDF / 照片 / zip","Choose PDF / photo / zip")}<input type="file" accept=".pdf,.zip,.jpg,.jpeg,.png" multiple hidden onchange="suFiles(this)"></label>
  ${F.length?`<ul style="margin:8px 0 4px 18px;font-size:14px"><li>${L("配对到","Matched")}: <b>${cnt("ok")}</b></li><li>${L("已经有签名页","Already has a signed page")}: ${cnt("has")}</li><li>${L("已经上传过，跳过","Already uploaded")}: ${cnt("same")}</li>
    ${cnt("reading")?`<li>⏳ ${L(`读取 / 认字中，还有 ${cnt("reading")} 个（扫描件每个约 10–20 秒）`,`Reading / OCR: ${cnt("reading")} left`)}</li>`:""}${F.some(x=>x.ocr&&!x.reading)?`<li><span class="tag bad">OCR</span> ${L("扫描件认字配对的，要检查单号对不对","Matched via OCR — check the number")}</li>`:""}${cnt("none")?`<li><b style="color:var(--bad)">${L("配不到（可以在旁边打单号）","No match (type the invoice no.)")}: ${cnt("none")}</b></li>`:""}</ul>
  <p style="font-size:13px;margin:6px 0"><a href="#" onclick="event.preventDefault();SU.files.forEach(x=>{if(['ok','has'].includes(x.st))SU.take.add(x.name)});suRender()">${L("全选","All")}</a> · <a href="#" onclick="event.preventDefault();SU.take.clear();suRender()">${L("全不选","None")}</a></p>

function repricePlan(dos){const out=[];for(const d of dos){if(d.record_only||d.price_note)continue;
    const f=recompute({...unshare(d),start_time:d.start_time?.slice(0,5)||"",end_time:d.end_time?.slice(0,5)||"",_rateTouched:false,_surTouched:true,_descTouched:true,_supTouched:d.lifting_sup!=null,
      charges:(d.charges||[]).map(x=>({...x,_rt:true,_qt:true}))});
    if(f.rate==null||f.amount==null)continue;
    if(Math.abs((Number(d.rate)||0)-Number(f.rate))>0.005||Math.abs((Number(d.amount)||0)-Number(f.amount))>0.005)out.push({d,rate:f.rate,amount:f.amount,hrs:f._shHrs??f.billable_hours,shift:f.shift})}
  return out}
async function repriceApply(plan){for(const x of plan){const{error}=await sb.from("delivery_orders").update({rate:x.rate,amount:x.amount,billable_hours:x.hrs,shift:x.shift}).eq("id",x.d.id);if(error)throw error;
    Object.assign(x.d,{rate:x.rate,amount:x.amount,billable_hours:x.hrs,shift:x.shift})}}

    const sent=new Set(S.d.invoices.filter(i=>i.sent_at).map(i=>i.id)),open=dos.filter(d=>!d.invoice_id||!sent.has(d.invoice_id)),plan=repricePlan(open);const scan=()=>invScan({customer_id:r.customer_id||undefined,quiet:true,why:L("价钱改了，这些还没寄出的 invoice 还是旧金额：","Price changed — these unsent invoices still show the old amount:")});if(!plan.length)return scan();
    const ex=plan.slice(0,8).map(x=>`DO ${x.d.do_no} ${dmy(x.d.do_date)}: $${money(x.d.amount)} → $${money(x.amount)}`).join("\n"),inInv=plan.filter(x=>x.d.invoice_id).length;

const SVC_UNITS=["per night","per day","per trip","LS","per hr","per 8 hrs","per load"];
const svcDefs=()=>(S.d.services||[]).filter(s=>s.company===S.company&&s.active!==false);

const cSvc=name=>{const d=svcDef(name);if(!d||svcKind(d)==="time"||(isL3()&&L3_BUILT.has(name)))return null;return d};
const svcKind=d=>!d?null:/night|day/i.test(d.unit)?"rent":/trip/i.test(d.unit)?"trip":/^ls$|job|time/i.test(d.unit)?"ls":/load/i.test(d.unit)?"trip":"time";

const rateSvcNames=()=>[...new Set([...RATE_SERVICES[S.company],...svcDefs().map(s=>s.name)])];
const dmyz=d=>d?`${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}`:"";
const nightsOf=f=>f.do_date&&f.end_date?Math.max(1,daysBetween(f.do_date,f.end_date)):1;
const unitWord=d=>/night/i.test(d.unit)?"Night":/day/i.test(d.unit)?"Day":/trip/i.test(d.unit)?"Trip":/load/i.test(d.unit)?"Load":"LS";
const NOUL="\u200B";const noUl=t=>String(t||"").startsWith(NOUL);
const svcTitle=(d,n)=>String(d.line_title||d.name).replace(/\{n\}/g,n??1);
function recomputeSvc(f,d){const k=svcKind(d),rate=findRate(f.customer_id,f.service,f.do_date)||(isL3()?findRate(null,f.service,f.do_date):null);f._priceChanged=false;f._tipLoad=false;f._rateRow=rate;f.shift=null;f._otHours=null;f._otRate=null;
  if(!f._rateTouched)f.rate=rate?Number(rate.price):null;if(!f._surTouched)f.surcharge=0;
  const u=Number(f.units)>0?Number(f.units):1;
  if(!f._descTouched)f.description=k==="rent"?svcTitle(d,u):svcTitle(d,u);
  if(k==="rent"){f.billable_hours=nightsOf(f);f.amount=f.rate!=null?r2(f.billable_hours*u*f.rate+(Number(f.surcharge)||0)):null}
  else{f.billable_hours=u;f.amount=f.rate!=null?r2(u*f.rate+(Number(f.surcharge)||0)):null}

function calcSvc(f,d){const k=svcKind(d),u=Number(f.units)>0?Number(f.units):1;

    :`<div>${k==="trip"?L("趟数","Trips"):L("次数","Qty")}<b>${u}</b></div><div>${L("单价","Rate")}<b>${f.rate!=null?"$"+money(f.rate):"—"}</b></div><div class="total">${L("金额","Amount")}<b>${f.amount!=null?"$"+money(f.amount):"—"}</b></div>`}

function svcLines(chosen){const out=[],rest=[];const by={};

function tiAnalyse(){const an=s=>String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,""),nz=s=>s.replace(/(^|[A-Z])0+(?=\d)/g,"$1");
  const sis=S.d.supplier_invoices,byAn=new Map();for(const si of sis){const k=an(si.invoice_no);if(!byAn.has(k))byAn.set(k,[]);byAn.get(k).push(si)}
  for(const x of TI.files){x.si=null;x.warn="";
    if(x.src==null){const m=x.name.match(TI_RX);if(m){x.src="name";x.date=m[1];x.sup=m[2].trim();x.no=m[3].trim();x.total=r2(numOr(m[4],0))}
      else if(/\.(pdf|jpe?g|png)$/i.test(x.name)){const h=tiHint(x.name,sis,an);if(h){x.src="hint";x.date=h.invoice_date;x.sup=supName(h.supplier_id);x.no=h.invoice_no;x.total=r2(Number(h.total)||0)}else{x.src="pdf";x.reading=true}}else x.src="bad"}
    x.std=x.date&&x.sup&&x.no&&x.total!=null?`${x.date}_${x.sup}_${String(x.no).replace(/[\\/:*?"<>|]+/g,"-")}_${Number(x.total).toFixed(2)}.${(x.name.match(/\.(pdf|jpe?g|png)$/i)||[0,"pdf"])[1].toLowerCase()}`.replace(/\s+/g," "):"";

      if(!si)si=pick(sis.filter(s=>an(s.invoice_no)!==k&&nz(an(s.invoice_no))===nz(k)));

function tiHint(name,sis,an){const b=an(name.replace(/\.pdf$/i,""));if(b.length<4)return null;let best=null,bl=0,tie=false;

async function insChunks(table,rows,size=200,sel){const out=[];for(let i=0;i<rows.length;i+=size){let q=sb.from(table).insert(rows.slice(i,i+size));if(sel)q=q.select(sel);
  const{data,error}=await q;if(error)throw new Error(table+": "+error.message);if(sel)out.push(...data);const pg=$("#aparProg");if(pg)pg.textContent=`${table} ${Math.min(i+size,rows.length)}/${rows.length}`}return out}

  return excelJSLoading||(excelJSLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload=res;sc.onerror=()=>{excelJSLoading=null;rej(new Error(L("Excel 工具载入失败，请检查网络","Could not load the Excel library")))};document.head.appendChild(sc)}))}
const XFILL={red:"FFF8D7D5",amber:"FFFFF0CC",green:"FFDFF2E7",head:"FF1F2A37",total:"FFE3E8EF"};
const xDate=s=>{const[y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const xv=(v,t)=>v==null||v===""?null:t==="date"?xDate(v):(t==="money"||t==="num")?Number(v):v;
const xDisp=(v,t)=>v==null||v===""?"":t==="money"?money(v):t==="date"?dmy(String(v).slice(0,10)):String(v);
const xLen=str=>[...String(str)].reduce((n,ch)=>n+(ch.charCodeAt(0)>255?2:1),0);
const solid=c=>({type:"pattern",pattern:"solid",fgColor:{argb:XFILL[c]}});
const termEN=d=>(d==null||d==="")?"":Number(d)===0?"COD":`${d} days`;
async function exportXlsx(filename,sheets){
  try{toast(L("正在准备 Excel…","Preparing Excel…"));await loadExcelJS();const wb=new ExcelJS.Workbook();wb.creator="ETK · L3H Billing";
    for(const sh of sheets){const ws=wb.addWorksheet(sh.name.slice(0,31));let r=1;
      for(const[a,b]of sh.info||[]){const row=ws.getRow(r++);row.getCell(1).value=a;row.getCell(1).font={bold:true};if(b!=null)row.getCell(2).value=b}
      if(sh.info?.length)r++;
      const head=r++,hr=ws.getRow(head);hr.height=20;
      sh.cols.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c.h;cell.font={bold:true,color:{argb:"FFFFFFFF"}};cell.fill=solid("head");cell.alignment={vertical:"middle"}});
      sh.rows.forEach((vals,ri)=>{const row=ws.getRow(r++),fill=sh.fill?.(ri);
        vals.forEach((v,i)=>{const c=sh.cols[i],cell=row.getCell(i+1);cell.value=xv(v,c.t);
          if(c.t==="money")cell.numFmt="#,##0.00";else if(c.t==="date")cell.numFmt="d/m/yyyy";else if(c.t==="num")cell.numFmt="0.##";
          cell.alignment={vertical:"top",wrapText:!!c.wrap};if(fill)cell.fill=solid(fill)})});
      if(sh.total){const row=ws.getRow(r++);sh.total.forEach((v,i)=>{const c=sh.cols[i],cell=row.getCell(i+1);cell.value=xv(v,c.t);cell.font={bold:true};cell.fill=solid("total");
        cell.border={top:{style:"thin"}};if(c.t==="money")cell.numFmt="#,##0.00";else if(c.t==="num")cell.numFmt="0.##"})}
      if(sh.after?.length){r++;for(const[a,b,fill]of sh.after){const row=ws.getRow(r++);row.getCell(1).value=a;row.getCell(1).font={bold:true};
        const cell=row.getCell(2);cell.value=typeof b==="number"?b:b??null;if(typeof b==="number")cell.numFmt="#,##0.00";if(fill){row.getCell(1).fill=solid(fill);cell.fill=solid(fill)}}}
      if(sh.legend){r++;for(const[fill,text]of sh.legend){const row=ws.getRow(r++);row.getCell(1).fill=solid(fill);row.getCell(2).value=text}}
      ws.views=[{state:"frozen",ySplit:head,xSplit:sh.freezeCols||0}];
      if(sh.rows.length)ws.autoFilter={from:{row:head,column:1},to:{row:head,column:sh.cols.length}};
      sh.cols.forEach((c,i)=>{const w=Math.max(xLen(c.h),...sh.rows.map(v=>xLen(xDisp(v[i],c.t))),...(sh.total?[xLen(xDisp(sh.total[i],c.t))]:[]));
        ws.getColumn(i+1).width=Math.min(c.max||40,Math.max(8,w+2))});
      if(sh.info?.length||sh.after?.length)ws.getColumn(1).width=Math.max(ws.getColumn(1).width||10,18)}
    const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=filename.replace(/[\\/:*?"<>|]+/g,"-");
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(L("Excel 已下载","Excel downloaded"))
  }catch(e){toast(e.message)}}

function exportEnt(ent){const cfg=ENT[ent],rows=S.d[ent];
  const tmap={money:"money",number:"num",date:"date",month:"date"};
  const cols=cfg.fields.map(f=>({h:f.label[1],t:tmap[f.type],max:f.type==="textarea"?50:40,wrap:f.type==="textarea"}));
  const val=(f,v)=>{switch(f.type){case"customer":return custName(v);case"supplier":return supName(v);case"terms":return termEN(v);case"bool":return v?"Yes":"No";case"serviceOpt":return v||"All services";default:return v}};
  const si=ent==="supplier_invoices";
  if(si)cols.push({h:"Status"},{h:"Surcharge Check",max:40});
  const data=rows.map(r=>{const a=cfg.fields.map(f=>val(f,r[f.k]));if(si)a.push(r.payment_date?"Paid":r.due_date&&r.due_date<today()?"Overdue":"Unpaid",surchargeCheck(r).t);return a});
  exportXlsx(`${["customers","vehicles","rates","customer_surcharges","monthly_fix"].includes(ent)?S.company+"_":""}${cfg.label[1].replace(/\W+/g,"_")}_${today()}.xlsx`,
    [{name:cfg.label[1],cols,rows:data,
      fill:si?(n=>{const r=rows[n];return(!r.payment_date&&r.due_date&&r.due_date<today())||!surchargeCheck(r).ok?"red":null}):ent==="monthly_fix"?(n=>rows[n].active?null:"amber"):null,
      legend:si?[["red","Overdue or surcharge mismatch"]]:ent==="monthly_fix"?[["amber","Stopped"]]:null}])}

const SQ={};let sqTimer=null;
const sqComp=s=>String(s??"").toLowerCase().replace(/[\s\/\-_.,:()#&']+/g,"");
function sqVals(vals){const out=[];for(const v of vals){if(v==null||v===""||typeof v==="boolean")continue;
    if(typeof v==="number"){out.push(String(v),money(v),money(v).replace(/,/g,""));continue}
    const t=String(v);out.push(t);if(/^\d{4}-\d{2}-\d{2}/.test(t)){const d=t.slice(0,10);out.push(dmy(d),`${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}`)}
    else if(/^-?\d+(\.\d+)?$/.test(t)){const n=Number(t);out.push(money(n),money(n).replace(/,/g,""))}}
  return out}
function sqHit(q,vals){const t=String(q||"").trim().toLowerCase();if(!t)return true;const hay=sqVals(vals),blob=hay.join(" | ").toLowerCase(),comp=hay.map(sqComp).join("|");
  return t.split(/\s+/).every(w=>blob.includes(w)||(sqComp(w)!==""&&comp.includes(sqComp(w))))}

const photoUrlCache={};
async function photoUrls(atts){const now=Date.now(),need=atts.filter(a=>!(photoUrlCache[a.file_path]&&photoUrlCache[a.file_path].exp>now));
  if(need.length){for(let i=0;i<need.length;i+=100){const part=need.slice(i,i+100);const{data,error}=await sb.storage.from("attachments").createSignedUrls(part.map(a=>a.file_path),600);
    if(error)throw error;(data||[]).forEach((x,j)=>{if(x.signedUrl)photoUrlCache[part[j].file_path]={url:x.signedUrl,exp:now+540000}})}}
  return Object.fromEntries(atts.map(a=>[a.id,photoUrlCache[a.file_path]?.url||""]))}

/* ---- 🧽 清理已经存的照片：用新的「彩色去影子」再处理一次，确认后换掉（旧文件留着，可以还原） ---- */
async function cleanPhotoBlob(a){const src=await attDataURL(a),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=src});
  const k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);scanFilter(c,"color");const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));return{before:src,blob,after:URL.createObjectURL(blob)}}
async function cleanInvPhotos(invId){let dos=[];try{dos=await fetchAll(()=>sb.from("delivery_orders").select("id,do_no").eq("invoice_id",invId))}catch(e){return toast(e.message)}

  const res=[];for(const a of atts){try{res.push({a,...await cleanPhotoBlob(a)})}catch(e){res.push({a,err:e.message||String(e)})}const p=$("#clProg");if(!p)return;p.textContent=`⏳ ${L("处理中…","Processing…")} ${res.length} / ${atts.length}`}
  const ok=res.filter(r=>r.blob);window.__CL={res,after};
  pvOv(`<div class="pvhead"><h3 style="margin:0">🧽 ${esc(title)} · ${L(`${ok.length} 张`,`${ok.length} photo(s)`)}</h3><span style="flex:1"></span><button class="btn sec sm" data-a="x">✕</button></div>
    <p class="mute" style="font-size:13px;margin-top:0">${L("左边是现在的，右边是清理后的。没问题按「换掉」。旧的文件会留着，按错了可以马上还原。","Left: current. Right: cleaned. Press Replace if it looks right.")}</p>
    <div style="max-height:66vh;overflow:auto;display:grid;gap:10px">${res.map(r=>r.err?`<div class="tag bad">${esc(r.a.file_name||"")}: ${esc(r.err)}</div>`:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><img src="${r.before}" style="width:100%;background:#fff;border-radius:4px"><img src="${r.after}" style="width:100%;background:#fff;border-radius:4px"></div>`).join("")}</div>
    ${ok.length?`<div class="actions" style="margin-top:10px"><button class="btn" id="clGo" onclick="cleanApply()">✓ ${L(`换掉（${ok.length} 张）`,`Replace (${ok.length})`)}</button><button class="btn sec" data-a="x">${L("取消","Cancel")}</button></div>`:""}`)}
async function cleanApply(){const{res,after}=window.__CL||{};if(!res)return;const b=$("#clGo");if(b)b.disabled=true;const done=[];
  try{for(const r of res.filter(r=>r.blob)){const a=r.a,path=`${S.user.id}/${a.entity_type}/${a.entity_id}/${Date.now()}_${Math.random().toString(36).slice(2,7)}_clean.jpg`;
      const up=await sb.storage.from("attachments").upload(path,r.blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
      const{error}=await sb.from("attachments").update({file_path:path}).eq("id",a.id);if(error)throw error;done.push({id:a.id,old:a.file_path,nw:path});a.file_path=path}}

  await loadAll();render();if(after)after();
  if(done.length)undoToast(L(`已清理 ${done.length} 张照片`,`${done.length} photo(s) cleaned`),async()=>{for(const x of done){await sb.from("attachments").update({file_path:x.old}).eq("id",x.id)}await loadAll();render();toast(L("已还原","Restored"))})}
