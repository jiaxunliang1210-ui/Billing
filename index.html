<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETK · L3H 开单系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Questrial&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1D2330; --muted:#636B7A; --line:#DADDD6;
  --pen:#2447A8; --pen-soft:#E6ECFA; --carbon:#F1EA8A; --carbon-soft:#FBF8D6;
  --stamp:#C9362A; --ok:#2E7A4E; --ok-soft:#E3F2E8; --warn:#9A6408; --warn-soft:#FBF0D9;
  --bad:#B42318; --bad-soft:#FCE6E3;
  --sans:"Barlow",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --cond:"Barlow Condensed","Barlow",-apple-system,"PingFang SC",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171C; --card:#1C2027; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2C323C;
    --pen:#86A3FF; --pen-soft:#1F2A47; --carbon:#5A5520; --carbon-soft:#2A2816;
    --stamp:#FF7466; --ok:#6CCB93; --ok-soft:#18301F; --warn:#F2B84B; --warn-soft:#33280F;
    --bad:#FF8A7A; --bad-soft:#3A1A17; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171C; --card:#1C2027; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2C323C;
  --pen:#86A3FF; --pen-soft:#1F2A47; --carbon:#5A5520; --carbon-soft:#2A2816;
  --stamp:#FF7466; --ok:#6CCB93; --ok-soft:#18301F; --warn:#F2B84B; --warn-soft:#33280F;
  --bad:#FF8A7A; --bad-soft:#3A1A17; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:baseline;gap:12px;padding:12px 16px 4px;max-width:1100px;margin:0 auto}
.brand{font:700 26px/1 var(--cond);letter-spacing:.01em}
.brand b{color:var(--pen);font-weight:700}
.sync{font-size:12px;color:var(--muted)}
.sync.cloud{color:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 0;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font:600 16px var(--cond);color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font:600 12px/18px var(--sans);text-align:center}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
section[hidden]{display:none}
h2{font:600 22px/1.2 var(--cond);margin:8px 0 12px}
h3{font:600 18px/1.2 var(--cond);margin:20px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
label.f.wide{grid-column:1/-1}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-height:40px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
input.do-in{font:700 20px var(--cond);color:var(--stamp);letter-spacing:.04em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;min-height:40px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pen);color:#fff}
.calc{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--carbon-soft);border-left:5px solid var(--carbon);font-variant-numeric:tabular-nums}
.calc .big{font:700 28px/1.1 var(--cond)}
.calc .line{color:var(--muted);font-size:14px}
.msgs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{padding:8px 10px;border-radius:7px;font-size:14px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{font:600 14px var(--cond);color:var(--muted);background:var(--card);position:sticky;top:0}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.dono{font:700 16px var(--cond);color:var(--stamp);letter-spacing:.03em}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.chip.D{background:var(--pen-soft);color:var(--pen)}
.chip.N{background:#26304a;color:#fff}
.chip.billed{background:var(--ok-soft);color:var(--ok)}
.chip.unbilled{background:var(--warn-soft);color:var(--warn)}
.chip.void{background:var(--line);color:var(--muted)}
.chip.paid{background:var(--ok-soft);color:var(--ok)}
.chip.overdue{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .v{font:700 26px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:13px}
.issue{border:1px solid var(--line);border-left-width:5px;border-radius:9px;background:var(--card);padding:10px 12px;margin-bottom:10px}
.issue.bad{border-left-color:var(--bad)}
.issue.warn{border-left-color:var(--warn)}
.issue.ok{border-left-color:var(--ok)}
.issue h4{margin:0 0 4px;font:600 17px var(--cond)}
.issue ul{margin:6px 0 0;padding-left:18px}
.issue li{margin:3px 0}
details.paste summary{cursor:pointer;color:var(--pen);font-weight:600;margin:14px 0 6px}
.cust{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px;margin-bottom:10px}
.cust .name{font:600 18px var(--cond)}
.cust .rates{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 12px;display:inline-flex;gap:6px;align-items:center;font:600 15px var(--cond);background:var(--card)}
.vchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:env(safe-area-inset-top,0px) 0 0}
.modal[hidden]{display:none}
.modal .box{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:14px}}
.sheets{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.sheet-wrap{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 1px 0 var(--line)}
.sheet-wrap .page{transform-origin:0 0}
#stage{position:fixed;left:-20000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- invoice document (always light, prints as paper) ---- */
.page{background:#fff;color:#111;font-family:"Questrial","Century Gothic",Arial,sans-serif;position:relative;overflow:hidden}
.page.p{width:794px;height:1123px;padding:48px 56px 70px;display:flex;flex-direction:column}
.page.l{width:1123px;height:794px;padding:40px 44px}
.page .co{text-align:center}
.page .co .cn{font:italic 700 30px/1.2 Arial,sans-serif;letter-spacing:.01em}
.page .co div{font-size:13px;line-height:1.55}
.page .title{text-align:right;font:700 34px Arial,sans-serif;margin:18px 0 10px}
.page .hdr{display:flex;justify-content:space-between;font-size:13.5px;line-height:1.6}
.page .hdr .to{max-width:58%}
.page .hdr table td{padding:0 4px;border:0;font-size:13.5px}
.page .items{width:100%;margin-top:14px;border-collapse:collapse}
.page .items th{background:none;color:#111;font:700 13.5px Arial,sans-serif;border-top:1.5px solid #111;border-bottom:1.5px solid #111;padding:6px 6px;position:static}
.page .items td{border:0;padding:12px 6px 2px;font-size:13.5px;vertical-align:top;white-space:normal}
.page .items .desc u{font-weight:700}
.page .tot{margin-left:auto;margin-top:36px;border-collapse:collapse;width:auto}
.page .hdr table{width:auto}
.page .tot td{border:0;padding:3px 8px;font-size:13.5px}
.page .tot .amt{border-top:1px solid #111;min-width:120px;text-align:right}
.page .tot .grand{font-weight:700;border-bottom:3px double #111}
.page .foot{margin-top:auto;padding-top:24px;font-size:10.5px;line-height:1.7}
.page .foot .fr{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.page .sig{width:260px;border-top:1px solid #111;text-align:center;font:700 13.5px Arial,sans-serif;padding-top:4px;margin-bottom:4px}
.page .sum-h{font-size:14px;line-height:1.6}
.page .sum-h b{text-decoration:underline}
.page .sum{width:100%;border-collapse:collapse;margin-top:10px}
.page .sum th{background:#d9d9d9;color:#111;font:700 12px Arial,sans-serif;border:1px solid #444;padding:6px 4px;text-align:center;position:static;white-space:normal}
.page .sum td{border:1px solid #444;padding:6px 5px;font-size:12px;text-align:center}
.page .sum td.r{text-align:right}
.page .sum tr.t td{border:0;font-weight:700}
.page.soa{font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px}
.page .soa-co{text-align:center;font-style:italic;font-weight:700;font-size:14px;line-height:1.4}
.page .soa-co .n{font-size:30px;line-height:1.2}
.page .soa-t{text-align:center;font-weight:700;font-size:18px;margin:10px 0 18px}
.page .soa-h{display:flex;justify-content:space-between;line-height:1.55;margin-bottom:22px}
.page .soa-h>div:last-child{width:34%}
.page .soa-tb{width:100%;border-collapse:collapse;border-left:1px solid #111;border-right:1px solid #111;border-bottom:1px solid #111;table-layout:fixed}
.page .soa-tb th{border-top:1px solid #111;border-bottom:1px solid #111;padding:5px 4px;font-weight:700;background:none;color:#111;position:static;text-align:center}
.page .soa-tb td{padding:3px 4px;text-align:center;border:0;white-space:nowrap}
.page .soa-tb td.ty{font-size:11px;font-style:italic}
.page .soa-tb td.r{text-align:right}
.page .soa-tb td .c{float:left}
.page .soa-tb tr.w td{border-top:1px solid #111;border-bottom:2px solid #111;font-size:12.5px;text-align:left;white-space:normal;padding:6px 4px}
.page .soa-tb tr.w td.r{text-align:right;font-weight:700}
.page .soa-note{text-align:center;padding:6px 0 10px;border-bottom:1px solid #111;line-height:1.5}
.page .soa-ag{width:100%;border-collapse:collapse;table-layout:fixed}
.page .soa-ag th{font-weight:400;background:none;color:#111;border-bottom:1px solid #111;padding:6px;text-align:center;position:static}
.page .soa-ag td{border:0;border-bottom:1px solid #111;padding:10px 6px;text-align:center}
.page .soa-nb{font-size:9.5px;margin-top:14px;line-height:1.6}
.page .pno{position:absolute;bottom:18px;right:44px;font-size:11px;color:#555}
.page .sum th.dk{background:#a6a6a6}
.page .sum td .c{float:left}
.page .sum tr.t td.dbl{border-top:1px solid #111;border-bottom:3px double #111}
.page .chc-top{display:flex;justify-content:space-between;align-items:flex-start;font:700 12.5px/1.45 Arial,sans-serif}
.page .chc-top .mid{font-weight:400;font-size:11px}
.page .chc{width:100%;border-collapse:collapse;margin-top:6px}
.page .chc th{background:#cfcfcf;color:#111;font:700 11.5px Arial,sans-serif;border:1px solid #555;padding:5px 4px;text-align:center;white-space:normal;position:static}
.page .chc td{border:1px solid #555;padding:5px 4px;font:11.5px Arial,sans-serif;text-align:center;white-space:normal}
.page .chc tbody tr:nth-child(even) td{background:#ececec}
.page .chc tbody tr.t td{background:none;border:0;font-weight:700}
.page .chc tr.t td.bx{border-top:2px solid #111;border-bottom:3px double #111}


.coswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:4px}
.coswitch button{border:0;background:var(--card);padding:6px 14px;min-height:34px;font:700 16px var(--cond);cursor:pointer;color:var(--muted)}
.coswitch button[aria-pressed="true"]{background:var(--pen);color:#fff}
.cosub{font-size:12px;color:var(--muted)}
.page .co.l3h .cn{font-size:32px}
.page .co.l3h div{font-size:13.5px}
</style>
</head>
<body>
<header class="top">
  <div class="top-row"><div class="brand"><b>开单</b></div><div class="coswitch" id="coSw" role="group" aria-label="公司"></div><span class="cosub" id="coName"></span><button id="themeBtn" class="btn small" style="margin-left:auto" aria-label="切换深色/浅色">☀️ 浅色</button><span id="sync" class="sync" style="margin-left:10px">本机保存</span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main>
  <section id="t-entry"></section><section id="t-exc" hidden></section><section id="t-check" hidden></section>
  <section id="t-bill" hidden></section><section id="t-ar" hidden></section><section id="t-master" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="dlg" class="modal" hidden style="z-index:70"><div class="box" id="dlgBox" style="max-width:460px"></div></div>
<div id="stage" aria-hidden="true"></div>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const money=v=>(v==null||isNaN(v))?'—':Number(v).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=(n,l=2)=>String(n).padStart(l,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dmy=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const dmyShort=iso=>iso?(+iso.slice(8,10))+'/'+(+iso.slice(5,7))+'/'+iso.slice(0,4):'';
const dmyY2=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(2,4):'';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const longDate=iso=>iso?iso.slice(8,10)+' '+MONTHS[+iso.slice(5,7)-1]+' '+iso.slice(0,4):'';
const dMon=iso=>iso?(+iso.slice(8,10))+'-'+MON3[+iso.slice(5,7)-1]+'-'+iso.slice(2,4):'';
const monthName=iso=>MONTHS[+iso.slice(5,7)-1]+' '+iso.slice(0,4);
const monthSpan=(a,b)=>a.slice(0,7)===b.slice(0,7)?monthName(a):MONTHS[+a.slice(5,7)-1]+(a.slice(0,4)!==b.slice(0,4)?' '+a.slice(0,4):'')+' & '+monthName(b);
const monthRange=(a,b)=>a.slice(0,7)===b.slice(0,7)?monthName(a):monthName(a)+' to '+monthName(b);
const dayMs=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
const addDays=(iso,n)=>{const d=new Date(dayMs(iso)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const daysBetween=(a,b)=>Math.round((dayMs(b)-dayMs(a))/864e5);
const lastDay=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return new Date(Date.UTC(y,m,0)).getUTCDate()};
const hrs=h=>String(r2(h||0));
function gstOf(sub,rate){const c=Math.round(sub*100);return Math.round(c*rate/100)/100}
function parseTime(s){
  s=String(s||'').trim().toLowerCase().replace(/\s/g,'').replace('.',':');
  if(!s)return null;
  let pm=/pm$/.test(s),am=/am$/.test(s);s=s.replace(/(am|pm)$/,'');
  let h,m;
  if(/^\d{3,4}$/.test(s)){s=s.padStart(4,'0');h=+s.slice(0,2);m=+s.slice(2)}
  else if(/^\d{1,2}:\d{2}$/.test(s)){[h,m]=s.split(':').map(Number)}
  else if(/^\d{1,2}$/.test(s)){h=+s;m=0}
  else return null;
  if(pm&&h<12)h+=12; if(am&&h===12)h=0; if(h===24&&m===0)h=0;
  if(h>23||m>59)return null;
  return pad(h)+':'+pad(m);
}
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
function parseDate(s){
  s=String(s||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2800)}
const t0=t=>String(t||'').replace(/^0(\d):/,'$1:');
function askConfirm(msg,okText='确定',cancelText='取消'){return new Promise(res=>{$('#dlgBox').innerHTML=`<p style="white-space:pre-line;margin:4px 0 14px">${msg}</p><div class="row"><button class="btn primary" id="dlg-ok">${okText}</button><button class="btn" id="dlg-no">${cancelText}</button></div>`;$('#dlg').hidden=false;

function askPrompt(msg,def=''){return new Promise(res=>{$('#dlgBox').innerHTML=`<p style="margin:4px 0 8px">${msg}</p><input id="dlg-in" value="${esc(def)}"><div class="row" style="margin-top:12px"><button class="btn primary" id="dlg-ok">确定</button><button class="btn" id="dlg-no">取消</button></div>`;$('#dlg').hidden=false;

function findRate(c,service,vehicle){if(!c)return null;const rs=c.rates.filter(r=>r.service===service);return rs.find(r=>r.vehicle&&r.vehicle===vehicle)||rs.find(r=>!r.vehicle)||null}
function isNight(t){const m=toMin(t),a=toMin(S.master.settings.nightFrom||'19:00'),b=toMin(S.master.settings.nightTo||'06:00');return a>b?(m>=a||m<b):(m>=a&&m<b)}
function calc(d){
  const c=custById(d.customerId);const rt=findRate(c,d.service,d.vehicle);
  if(!c)return null;
  if(!rt)return{noRate:true,missing:true,total:0,mode:'?'};
  const st=parseTime(d.start),en=parseTime(d.end);
  let span=null;if(st&&en){let s=toMin(st),e=toMin(en);if(e<=s)e+=1440;span=(e-s)/60}
  const shift=(d.shift==='D'||d.shift==='N')?d.shift:(st&&isNight(st)?'N':'D');
  const diesel=num(rt.diesel)||0;
  if(rt.mode==='unit'){
    const qty=num(d.qty)||1,rate=num(rt.unitRate);
    const amt=r2(qty*(rate||0));
    return{mode:'unit',shift,span,qty,uom:rt.uom||'load',rate:rate||0,amt,otAmt:0,ot:0,diesel,total:r2(amt+diesel),missing:rate==null,label:rt.label};
  }
  if(span==null)return null;
  const N=shift==='N';
  const rate=num(N?rt.nightRate:rt.dayRate),otRate=num(N?rt.otNight:rt.otDay);
  const base=num(rt.baseHr)||8,minHr=num(rt.minHr)||0;
  const r={mode:rt.mode,shift,span,base,diesel,rate:rate||0,otRate:otRate||0,missing:rate==null,missingOT:false};
  let work=span;if(rt.deductBreak&&work>base)work-=1;
  if(rt.mode==='hourly'){r.billHr=Math.max(minHr,work);r.ot=0;r.amt=r2(r.billHr*(rate||0));r.otAmt=0}
  else{r.billHr=Math.max(minHr,Math.min(work,base));r.ot=r2(Math.max(0,work-base));r.amt=r2(rate||0);r.otAmt=r2(r.ot*(otRate||0));r.missingOT=r.ot>0&&otRate==null}
  r.total=r2(r.amt+r.otAmt+diesel);
  return r;
}
function modeFor(d){const rt=findRate(custById(d.customerId),d.service,d.vehicle);return rt?rt.mode:null}
function interval(d){const st=parseTime(d.start),en=parseTime(d.end);if(!st||!en||!d.date)return null;let s=toMin(st),e=toMin(en);if(e<=s)e+=1440;const b=dayMs(d.date)/6e4;return[b+s,b+e]}
const normDO=s=>String(s||'').trim().toUpperCase().replace(/^0+(?=\d)/,'');

const machineBy=code=>S.master.machines.find(m=>m.code===code);
function excCalc(r){
  const m=machineBy(r.machine);if(!r.from||!r.to||r.to<r.from)return null;
  const days=daysBetween(r.from,r.to)+1;
  const full=r.from.slice(8)==='01'&&+r.to.slice(8)===lastDay(r.to);
  let type,rate,total,missing=false,months=0;
  if(full){months=(+r.to.slice(0,4)-+r.from.slice(0,4))*12+(+r.to.slice(5,7)-+r.from.slice(5,7))+1;type='Monthly';rate=num(m?.monthly);total=r2((rate||0)*months)}
  else if(days<7){type='Daily';rate=num(m?.daily);total=r2((rate||0)*days)}
  else{type='Weekly';rate=num(m?.weekly);total=r2((rate||0)/7*days)}
  if(rate==null)missing=true;
  return{days,type,rate:rate||0,total,missing,months,daily:num(m?.daily),weekly:num(m?.weekly),monthly:num(m?.monthly),noMachine:!m};
}

function liveChecks(d,editId){
  const out=[];const others=coDos().filter(x=>x.id!==editId);
  const n=normDO(d.doNo);
  if(n){
    const dup=others.find(x=>normDO(x.doNo)===n);
    if(dup)out.push(['bad',`DO ${esc(d.doNo)} 已经录过（${dmy(dup.date)} ${esc(dup.vehicle)}${dup.invoiceNo?'，已开在 '+esc(dup.invoiceNo):''}）`]);
    if(S.master.voidDOs.some(v=>v.company===S.co&&normDO(v.no)===n))out.push(['bad',`DO ${esc(d.doNo)} 已标记为作废`]);
  }
  const iv=interval(d);
  if(iv&&d.vehicle)others.filter(x=>x.vehicle===d.vehicle).forEach(x=>{const j=interval(x);if(j&&iv[0]<j[1]&&j[0]<iv[1])out.push(['bad',`${esc(d.vehicle)} 时间跟 DO ${esc(x.doNo)} 重叠（${dmy(x.date)} ${esc(x.start)}–${esc(x.end)}，${esc(custById(x.customerId)?.name||'')}）`])});
  const c=calc(d);
  if(c){
    if(c.noRate)out.push(['bad','这个客户没有设定这项服务的价钱（去「客户 / 价目」加）']);
    else if(c.missing)out.push(['bad',c.mode==='unit'?'这项服务还没设定单价':`还没设定${c.shift==='N'?'晚班':'白天'}价`]);
    if(c.missingOT)out.push(['warn','有 OT 但没设定 OT 单价']);
    if(c.span>14)out.push(['warn',`工作 ${hrs(c.span)} 小时，时间有没有打错？`]);
  }
  if(d.date&&d.date>todayISO())out.push(['warn','日期在今天之后']);
  return out;
}
function allIssues(){
  const I={dup:[],overlap:[],gaps:[],stale:[],missing:[],invDate:[],invOrder:[],overdue:[],excOverlap:[],excMissing:[],excStale:[]};
  const dos=coDos();
  const by={};dos.forEach(d=>{const n=normDO(d.doNo);if(n)(by[n]=by[n]||[]).push(d)});
  Object.values(by).forEach(a=>{if(a.length>1)I.dup.push(a)});
  const byV={};dos.forEach(d=>{const iv=interval(d);if(iv&&d.vehicle)(byV[d.vehicle]=byV[d.vehicle]||[]).push([iv,d])});
  Object.values(byV).forEach(a=>{a.sort((x,y)=>x[0][0]-y[0][0]);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&a[j][0][0]<a[i][0][1];j++)I.overlap.push([a[i][1],a[j][1]])});
  const voids=new Set(S.master.voidDOs.filter(v=>v.company===S.co).map(v=>normDO(v.no)));
  const nums=[...new Set(dos.map(d=>normDO(d.doNo)).filter(n=>/^\d+$/.test(n)).map(Number))].sort((a,b)=>a-b);
  for(let i=1;i<nums.length;i++){const g=nums[i]-nums[i-1];if(g>1&&g<=30)for(let k=nums[i-1]+1;k<nums[i];k++)if(!voids.has(String(k)))I.gaps.push(k)}
  const lim=addDays(todayISO(),-(S.master.settings.staleDays||7));
  dos.forEach(d=>{if(!d.invoiceNo&&d.date&&d.date<lim)I.stale.push(d);const c=calc(d);if(!c||c.missing)I.missing.push(d)});
  const live=coInv().filter(v=>v.status!=='void');
  live.forEach(v=>{const last=v.kind==='exc'?(v.groups[0].rows.reduce((m,r)=>r.to>m?r.to:m,'')):v.to;if(last&&v.date<last)I.invDate.push([v,last])});
  const grp={};live.forEach(v=>{const m=v.no.match(/^(.*\/)(\d+)$/);if(m)(grp[m[1]]=grp[m[1]]||[]).push([+m[2],v])});
  Object.values(grp).forEach(a=>{a.sort((x,y)=>x[0]-y[0]);for(let i=1;i<a.length;i++)if(a[i][1].date<a[i-1][1].date)I.invOrder.push([a[i-1][1],a[i][1]])});
  live.forEach(v=>{const due=addDays(v.date,+v.terms||0);if(invBal(v)>0.004&&todayISO()>due)I.overdue.push(v)});
  if(S.co==='L3H'){
    const R=S.rentals.filter(r=>r.from&&r.to);
    const bm={};R.forEach(r=>(bm[r.machine]=bm[r.machine]||[]).push(r));
    Object.values(bm).forEach(a=>{a.sort((x,y)=>x.from.localeCompare(y.from));for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&a[j].from<=a[i].to;j++)I.excOverlap.push([a[i],a[j]])});
    R.forEach(r=>{const k=excCalc(r);if(!k||k.missing||k.noMachine)I.excMissing.push(r);if(!r.invoiceNo&&r.to<lim&&r.to.slice(0,7)<todayISO().slice(0,7))I.excStale.push(r)});
  }
  return I;
}

  await store.save('dos',d);

}

/* ================= BILL ================= */
function nextInvNo(date){
  const p=(S.master.companies[S.co].prefix||(S.co+'/'))+date.slice(2,4)+date.slice(5,7)+'/';
  let max=+((S.master.companies[S.co].lastNo||{})[date.slice(2,4)+date.slice(5,7)])||0;S.invoices.forEach(v=>{if(v.company===S.co&&v.no&&v.no.startsWith(p)){const n=+v.no.slice(p.length);if(n>max)max=n}});
  return p+pad(max+1);
}
function billCands(){
  const b=S.bill;if(!b.cust)return[];
  if(b.kind==='exc')return S.rentals.filter(r=>r.customerId===b.cust&&!r.invoiceNo&&(!b.project||r.project===b.project)&&(!b.from||r.to>=b.from)&&(!b.to||r.from<=b.to)).sort((a,c)=>(a.machine+a.from).localeCompare(c.machine+c.from));
  return coDos().filter(d=>d.customerId===b.cust&&!d.invoiceNo&&(!b.project||(d.project||'')===b.project)&&(!b.service||d.service===b.service)&&(!b.from||d.date>=b.from)&&(!b.to||d.date<=b.to)).sort((a,c)=>(a.date+a.start).localeCompare(c.date+c.start));
}
function buildInvoice(){
  const b=S.bill,c=custById(b.cust);if(!c)return null;
  const list=billCands().filter(d=>!b.excl[d.id]);if(!list.length)return null;
  const rate=+S.master.settings.gstRate||9;
  let groups,from,to,project=b.project||'';
  if(b.kind==='exc'){
    const rows=list.map(r=>{const k=excCalc(r)||{};return{rid:r.id,machine:r.machine,person:r.person||'',project:r.project,from:r.from,to:r.to,locFrom:r.locFrom||'',locTo:r.locTo||'',remark:r.remark||'',days:k.days,type:k.type,daily:k.daily,weekly:k.weekly,monthly:k.monthly,rate:k.rate,total:k.total||0,missing:!!k.missing||!!k.noMachine}});
    groups=[{service:'EXC',mode:'exc',rows,subtotal:r2(rows.reduce((s,r)=>s+r.total,0))}];
    from=rows.reduce((m,r)=>r.from<m?r.from:m,rows[0].from);to=rows.reduce((m,r)=>r.to>m?r.to:m,rows[0].to);
    if(!project){const ps=[...new Set(rows.map(r=>r.project))];if(ps.length===1)project=ps[0]}
  }else{
    const order=SVC[S.co].map(s=>s.id);const gm={};
    list.forEach(d=>{const k=calc(d)||{};const key=d.service+'|'+(k.mode||'?');(gm[key]=gm[key]||{service:d.service,mode:k.mode||'daily',rows:[]}).rows.push({doId:d.id,date:d.date,vehicle:d.vehicle,doNo:d.doNo,start:d.start,end:d.end,shift:k.shift,span:k.span,billHr:k.billHr,base:k.base,ot:k.ot,rate:k.rate,otRate:k.otRate,amt:k.amt,otAmt:k.otAmt,diesel:k.diesel,total:k.total||0,qty:k.qty,uom:k.uom,label:k.label||'',location:d.location||'',to:d.to||'',desc:d.desc||'',po:d.po||'',missing:!!k.missing})});
    groups=Object.values(gm).sort((a,c)=>order.indexOf(a.service)-order.indexOf(c.service));
    groups.forEach(g=>{g.subtotal=r2(g.rows.reduce((s,r)=>s+r.total,0));g.hours=r2(g.rows.reduce((s,r)=>s+(r.billHr||0),0))});
    from=list[0].date;to=list[list.length-1].date;
    if(!project){const ps=[...new Set(list.map(d=>d.project||'').filter(Boolean))];if(ps.length===1)project=ps[0]}
  }
  const subtotal=r2(groups.reduce((s,g)=>s+g.subtotal,0));const gst=gstOf(subtotal,rate);
  const pos=[...new Set(list.map(d=>d.po).filter(Boolean))];
  return{id:null,kind:b.kind,company:S.co,no:nextInvNo(b.date||todayISO()),date:b.date,customerId:c.id,custName:c.name,cust:{name:c.name,address:c.address,tel:c.tel,fax:c.fax,email:c.email,pic:c.pic},project,from,to,po:b.po||pos.join(', '),ourRef:b.ourRef||'',itemDesc:clone(b.desc||{}),summaryNo:b.sno||'',showDiesel:c.showDiesel!==false,refLabel:c.refLabel||'',terms:+c.terms||0,groups,subtotal,gstRate:rate,gst,total:r2(subtotal+gst),status:'unpaid',createdAt:Date.now()};
}

let BUSY=false;
function setBillBtns(busy){document.querySelectorAll('#t-bill .bill-act').forEach(x=>{if(busy){x.dataset.t=x.dataset.t||x.textContent;x.disabled=true;x.textContent='Creating Invoice…'}else{x.disabled=false;if(x.dataset.t)x.textContent=x.dataset.t}})}
function findInvoiceWithDO(doNo,company){const n=normDO(doNo);if(!n)return null;return S.invoices.find(v=>v.company===company&&v.status!=='void'&&(v.groups||[]).some(g=>(g.rows||[]).some(r=>r.doNo&&normDO(r.doNo)===n)))||null}
const dupMsg=(doNo,v)=>`⚠️ This DO has already been invoiced.（DO ${doNo} 已经开过单，不能再开）\nInvoice No: ${v.no}${v.date?'\nDate: '+dmy(v.date):''}`;
function billBlockers(inv){
  const b=S.bill,errs=[];
  if(!b.cust)errs.push('❌ Please select Customer.（请选客户）');
  if(!b.date)errs.push('❌ Please enter Invoice Date.（请填发票日期）');
  if(b.cust&&!inv){errs.push('❌ 没有勾选任何 DO / 记录，不能开单。');return errs}
  if(!inv)return errs;
  const seen={};
  for(const g of inv.groups)for(const r of g.rows){
    if(r.doId){const d=S.dos.find(x=>x.id===r.doId);
      if(!d||!String(d.doNo||'').trim()){errs.push('❌ Please enter DO Number.（有记录没有 DO 号码）');continue}
      const n=normDO(d.doNo);if(seen[n])errs.push(`❌ DO ${d.doNo} 在这张发票里重复了两次`);seen[n]=1;
      const ov=d.invoiceNo?(S.invoices.find(v=>v.no===d.invoiceNo&&v.status!=='void')||{no:d.invoiceNo}):findInvoiceWithDO(d.doNo,inv.company);
      if(ov)errs.push(dupMsg(d.doNo,ov));}
    if(r.rid){const x=S.rentals.find(y=>y.id===r.rid);if(x&&x.invoiceNo)errs.push(`⚠️ 这行挖机租金已经开过：${x.invoiceNo}`)}
    if(r.missing)errs.push('❌ 有记录没有价钱，先去「客户 / 价目」设定');
  }
  if(inv.date&&inv.to&&inv.date<inv.to)errs.push(`❌ 发票日期 ${dmy(inv.date)} 比工作日期（做到 ${dmy(inv.to)}）早`);
  const projects=[...new Set(billCands().map(d=>d.project||'').filter(Boolean))];
  if((inv.groups.some(g=>g.mode==='hourly')||inv.kind==='exc')&&!b.project&&projects.length>1)errs.push('❌ 要按项目分开开单，先选一个项目');
  return [...new Set(errs)];
}
async function confirmInvoice(then){
  if(BUSY)return;BUSY=true;setBillBtns(true);S.billErr=null;
  try{
    const inv=buildInvoice();const errs=billBlockers(inv);
    if(errs.length){S.billErr=errs;renderBill();toast(errs[0].split('\n')[0]);window.scrollTo({top:0,behavior:'smooth'});return}
    let no=nextInvNo(inv.date);while(S.invoices.some(v=>v.no===no&&v.status!=='void')){const m=no.match(/^(.*\/)(\d+)$/);no=m[1]+pad(+m[2]+1)}
    inv.no=no;
    {const base=inv.no.replace(/[^A-Za-z0-9\-_.]/g,'-');let id=base,n=2;while(S.invoices.some(v=>v.id===id))id=base+'-R'+n++;inv.id=id}
    await store.save('invoices',inv);
    const dos=[];
    for(const g of inv.groups)for(const r of g.rows){
      if(r.doId){const d=S.dos.find(x=>x.id===r.doId);if(d){dos.push(d.doNo);await store.save('dos',{...d,invoiceNo:inv.no})}}
      if(r.rid){const x=S.rentals.find(y=>y.id===r.rid);if(x){dos.push(x.machine);await store.save('rentals',{...x,invoiceNo:inv.no})}}
    }
    S.lastResult={company:inv.company,no:inv.no,id:inv.id,dos,total:inv.total,file:then||null,fileStatus:then?'pending':null};
    S.bill={...S.bill,excl:{},no:'',po:'',sno:'',ourRef:'',desc:{}};
    renderAll();window.scrollTo({top:0,behavior:'smooth'});
    if(then){const r=then==='pdf'?await downloadPDF(inv,null):await downloadXLSX(inv,null);
      Object.assign(S.lastResult,{fileStatus:r&&r.ok?'ok':r&&r.declined?'declined':'fail',url:r&&r.url,fname:r&&r.fname,err:r&&r.err});
      if(S.tab==='bill')renderBill()}
    else toast('✓ Invoice Created Successfully：'+inv.no);
  }catch(e){console.error(e);S.billErr=['❌ 开单失败：'+(e.message||e)];renderBill()}
  finally{BUSY=false;setBillBtns(false)}
}

function lineItems(v,raw){
  const co=v.company,L3=co==='L3H';
  const pre=[],items=[],post=[];
  const period=`${longDate(v.from)} to ${longDate(v.to)}`;
  if(v.kind==='exc'){
    items.push({desc:[{t:'PROJECT: '+v.project,b:1,u:1},{t:'Provide Excavator Charges'},{t:v.from.slice(0,7)===v.to.slice(0,7)&&daysBetween(v.from,v.to)<27?`Date : ${dmy(v.from)} to ${dmy(v.to)}`:`From ${monthRange(v.from,v.to)}`}],qty:'1',uom:'LS',unit:v.subtotal,amount:v.subtotal,g:0});
    post.push('(Please refer to attach for all detailed breakdown)');
  }else if(L3&&v.groups.some(g=>g.mode==='hourly')){
    pre.push({t:'PROJECT: '+(v.project||''),b:1,u:1});pre.push({t:'PROVIDE TRANSPORT SERVICES FOR '+monthSpan(v.from,v.to).toUpperCase(),b:1,u:1});
    v.groups.forEach((g,i)=>{const s=svcOf(co,g.service);
      if(g.mode==='hourly')items.push({desc:[{t:s.desc}],qty:(g.hours||0).toFixed(2),uom:'hr',unit:'LS',amount:g.subtotal,g:i,qtyIsHours:true});
      else items.push({desc:[{t:s.desc}],qty:'1',uom:'LS',unit:'',amount:g.subtotal,g:i})});
    if(v.summaryNo)post.push('Refer to summary list No: '+v.summaryNo);
    post.push('(Please refer to attach for all detailed breakdown)');
  }else{
    v.groups.forEach((g,i)=>{const s=svcOf(co,g.service);
      if(g.mode==='unit'){
        const r0=g.rows[0];const qty=r2(g.rows.reduce((a,r)=>a+(r.qty||0),0));const same=g.rows.every(r=>r.rate===r0.rate);
        const locs=[...new Set(g.rows.map(r=>(r.location||'')+'→'+(r.to||'')))];
        const d=[{t:r0.label||s.desc,b:1,u:1}];
        if(locs.length===1&&r0.location)d.push({t:`From : ${r0.location}${r0.to?' To : '+r0.to:''}`});
        if(g.rows.length<=3)d.push({t:'DO : '+g.rows.map(r=>r.doNo).join(' , ')});
        d.push({t:v.from===v.to?'Date : '+dmy(v.from):`Date : ${dmy(g.rows[0].date)} to ${dmy(g.rows[g.rows.length-1].date)}`});
        items.push({desc:d,qty:hrs(qty),uom:r0.uom||'load',unit:same?r0.rate:'',amount:g.subtotal,g:i});
      }else{
        const vehs=[...new Set(g.rows.map(r=>r.vehicle))];
        const d=[];if(v.project&&!L3)d.push({t:'Project : '+v.project,b:1});
        d.push({t:s.desc+(L3&&vehs.length===1?' - '+vehs[0]:''),b:1,u:1},{t:period,b:L3?1:1,u:1});
        items.push({desc:d,qty:'1',uom:'LS',unit:g.subtotal,amount:g.subtotal,g:i});
      }
    });
    post.push(L3?'(Please refer to attach for all detailed breakdown)':'(Please see the attachment)');
  }
  if(!raw&&v.itemDesc)items.forEach((it,i)=>{const t=v.itemDesc[i];if(t!=null&&String(t).trim()!==''){const o=it.desc;it.desc=String(t).split('\n').map((x,j)=>({t:x,b:o[j]?.b,u:o[j]?.u}))}});
  return{pre,items,post};
}

/* ================= payments ================= */
const PAY_METHODS=['FUND TRANSFER','PAYNOW','EDP','CHEQUE','CASH','CONTRA','CREDIT NOTE'];
const coPays=()=>S.payments.filter(p=>p.company===S.co);
const payMethod=p=>p.method||(/^CONTRA/i.test(p.ref||'')?'CONTRA':/^PAYNOW/i.test(p.ref||'')?'PAYNOW':/^EDP/i.test(p.ref||'')?'EDP':/^CHEQUE|^CHQ/i.test(p.ref||'')?'CHEQUE':'FUND TRANSFER');
const payDesc=p=>{const m=payMethod(p);return m==='CONTRA'?'CONTRA':m==='CREDIT NOTE'?'CREDIT NOTE':'RECEIVED'};
const payAllocated=p=>r2((p.alloc||[]).reduce((s,x)=>s+(+x.amt||0),0));
const payUnalloc=p=>r2(p.amount-payAllocated(p));
function allocSum(invId,asOf){return r2(S.payments.reduce((s,p)=>s+(asOf&&p.date>asOf?0:(p.alloc||[]).reduce((a,x)=>a+(x.inv===invId?(+x.amt||0):0),0)),0))}
function hasAlloc(invId){return S.payments.some(p=>(p.alloc||[]).some(x=>x.inv===invId))}
function invBal(v,asOf){
  if(v.status==='void')return 0;
  if(!hasAlloc(v.id)&&v.status==='paid'){return asOf&&v.paidDate&&v.paidDate>asOf?v.total:0}
  return r2(v.total-allocSum(v.id,asOf));
}
function invPays(v){return S.payments.filter(p=>(p.alloc||[]).some(x=>x.inv===v.id)).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>({p,amt:r2((p.alloc||[]).filter(x=>x.inv===v.id).reduce((s,x)=>s+x.amt,0))}))}
function payStatus(v){
  if(v.status==='void')return{k:'void',t:'Void'};
  const bal=invBal(v);if(bal<=0.004)return{k:'paid',t:'Paid'};
  const due=addDays(v.date,+v.terms||0);const od=daysBetween(due,todayISO());
  if(bal<v.total-0.004)return{k:od>0?'overdue':'unbilled',t:'Partially Paid'+(od>0?` · 逾期 ${od} 天`:'')};
  return od>0?{k:'overdue',t:`Overdue ${od} 天`}:{k:'unbilled',t:'Unpaid'};
}
function custCredit(custId){return r2(S.payments.filter(p=>p.customerId===custId).reduce((s,p)=>s+Math.max(0,payUnalloc(p)),0))}
async function syncInvoices(ids){
  for(const id of new Set(ids)){const v=S.invoices.find(x=>x.id===id);if(!v||v.status==='void')continue;
    const paid=allocSum(id);const pays=invPays(v).map(x=>x.p);
    const st=paid>=v.total-0.005?'paid':'unpaid';
    const nv={...v,status:st,paidAmt:paid,paidDate:st==='paid'&&pays.length?pays[pays.length-1].date:null,paidRef:pays.map(p=>p.ref).filter(Boolean).join(', ')};
    if(nv.status!==v.status||nv.paidAmt!==v.paidAmt||nv.paidDate!==v.paidDate||nv.paidRef!==v.paidRef)await store.save('invoices',nv);
  }
}
/* record or edit a payment (incl. contra / overpayment) */
function openPayment(custId,preIds,existing){
  const c=custById(custId);if(!c)return;
  const P=existing?clone(existing):null;
  const mine=id=>P?r2((P.alloc||[]).filter(x=>x.inv===id).reduce((s,x)=>s+x.amt,0)):0;
  const balEx=v=>r2(invBal(v)+mine(v.id));
  const open=S.invoices.filter(v=>v.customerId===custId&&v.company===S.co&&v.status!=='void'&&balEx(v)>0.004).sort((a,b)=>a.date.localeCompare(b.date));
  const sel={};
  if(P)(P.alloc||[]).forEach(x=>{sel[x.inv]=r2((sel[x.inv]||0)+x.amt)});
  (preIds||[]).forEach(id=>{const v=open.find(x=>x.id===id);if(v&&!(id in sel))sel[id]=balEx(v)});
  const st={date:P?P.date:todayISO(),method:P?payMethod(P):'FUND TRANSFER',ref:P?P.ref:'',amt:P?P.amount:r2(Object.values(sel).reduce((a,b)=>a+b,0)),touched:!!P};
  const draw=()=>{
    $('#modalBox').innerHTML=`<h2>${P?'修改收款':'记录收款'} · ${esc(c.name)}</h2>
    <div class="grid"><label class="f">日期<input type="date" id="py-date" value="${esc(st.date)}"></label>
      <label class="f">方式<select id="py-method">${PAY_METHODS.map(m=>`<option ${m===st.method?'selected':''}>${m}</option>`).join('')}</select></label>
      <label class="f">Ref（印在 SOA，例 PAYNOW - SIN JOO HENG）<input id="py-ref" value="${esc(st.ref)}" placeholder="${esc(st.method)}"></label>
      <label class="f">金额 $<input id="py-amt" inputmode="decimal" value="${esc(st.amt)}"></label></div>
    ${st.method==='CONTRA'?'<div class="msg warn" style="margin-top:8px">Contra：跟客户互相抵消（例如我们欠他们的钱 / backcharge），不是真的收到钱。SOA 会显示 CONTRA。</div>':''}
    <h3>这笔钱付哪几张发票</h3>
    ${open.length?`<div class="tablewrap"><table><thead><tr><th></th><th>号码</th><th>日期</th><th class="num">总额</th><th class="num">未收</th><th class="num">这次付</th></tr></thead><tbody>${open.map(v=>`<tr><td><input type="checkbox" data-pk="${v.id}" ${v.id in sel?'checked':''} style="width:18px;min-height:18px"></td><td>${esc(v.no)}</td><td>${dmy(v.date)}</td><td class="num">${money(v.total)}</td><td class="num">${money(balEx(v))}</td><td class="num"><input data-pa="${v.id}" inputmode="decimal" value="${v.id in sel?esc(sel[v.id]):''}" ${v.id in sel?'':'disabled'} style="width:100px;min-height:32px;padding:4px;text-align:right"></td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">这个客户没有未收的发票。这笔钱会全部变成余款（overpayment / credit）。</p>'}
    <div class="msgs" id="py-msg"></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="py-ok">保存</button><button class="btn" id="py-cancel">取消</button><button class="btn small" id="py-auto">按金额自动分配（最旧的先）</button>${P?'<button class="btn small danger" id="py-del">删除这笔收款</button>':''}</div>`;
    const readTop=()=>{st.date=$('#py-date').value;st.method=$('#py-method').value;st.ref=$('#py-ref').value;st.amt=$('#py-amt').value};
    const msg=()=>{const amt=num($('#py-amt').value)||0;const al=r2(Object.values(sel).reduce((a,b)=>a+(+b||0),0));const d=r2(amt-al);
      const over=open.filter(v=>v.id in sel&&(+sel[v.id]||0)>balEx(v)+0.004);
      $('#py-msg').innerHTML=(over.length?`<div class="msg bad">${over.map(v=>esc(v.no)).join(', ')} 付的比未收多</div>`:'')+(Math.abs(d)<0.005?`<div class="msg ok">分配 $${money(al)}，刚好</div>`:d>0?`<div class="msg warn">多出 $${money(d)} 没分配 → 记成客户余款（overpayment）。之后可以在「收款记录」按「分配」用来付别的发票。</div>`:`<div class="msg bad">分配 $${money(al)} 比金额多 $${money(-d)}</div>`)};
    $('#py-method').addEventListener('change',()=>{readTop();draw()});
    $('#modalBox').querySelectorAll('[data-pk]').forEach(x=>x.addEventListener('change',()=>{readTop();const v=open.find(o=>o.id===x.dataset.pk);if(x.checked)sel[v.id]=balEx(v);else delete sel[v.id];if(!st.touched)st.amt=r2(Object.values(sel).reduce((a,b)=>a+(+b||0),0));draw()}));
    $('#modalBox').querySelectorAll('[data-pa]').forEach(x=>x.addEventListener('input',()=>{sel[x.dataset.pa]=num(x.value)||0;msg()}));
    $('#py-amt').addEventListener('input',()=>{st.touched=true;msg()});
    $('#py-auto').addEventListener('click',()=>{readTop();let left=num($('#py-amt').value)||0;Object.keys(sel).forEach(k=>delete sel[k]);for(const v of open){if(left<=0.004)break;const a=r2(Math.min(balEx(v),left));sel[v.id]=a;left=r2(left-a)}st.touched=true;draw()});
    $('#py-cancel').addEventListener('click',()=>{$('#modal').hidden=true});
    if($('#py-del'))$('#py-del').addEventListener('click',async()=>{if(!await askConfirm(`删除 ${dmy(P.date)} ${esc(P.ref||payMethod(P))} $${money(P.amount)}？付过的发票会变回未收。`))return;await store.del('payments',P.id);await syncInvoices((P.alloc||[]).map(x=>x.inv));$('#modal').hidden=true;toast('已删除');renderAll()});
    $('#py-ok').addEventListener('click',async()=>{readTop();const amt=num(st.amt);if(!amt||amt<=0){toast('❌ 要填金额');return}if(!st.date){toast('❌ 要填日期');return}
      const alloc=Object.entries(sel).filter(([k,a])=>+a>0).map(([inv,a])=>({inv,amt:r2(+a)}));const al=r2(alloc.reduce((s,x)=>s+x.amt,0));
      if(al>amt+0.005){toast('❌ 分配比金额多');return}
      if(alloc.some(x=>{const v=open.find(o=>o.id===x.inv);return v&&x.amt>balEx(v)+0.004})){toast('❌ 有发票付的比未收多');return}
      const p={id:P?P.id:uid('p'),company:S.co,customerId:custId,date:st.date,amount:r2(amt),method:st.method,ref:(st.ref||'').trim()||st.method,alloc,createdAt:P?P.createdAt:Date.now()};
      const touched=alloc.map(a=>a.inv).concat(P?(P.alloc||[]).map(a=>a.inv):[]);
      await store.save('payments',p);await syncInvoices(touched);
      $('#modal').hidden=true;toast(r2(amt-al)>0?`✓ 已记录，余款 $${money(r2(amt-al))}`:'✓ 收款已记录');renderAll()});
    msg();
  };
  $('#modal').hidden=false;draw();
}

/* ================= SOA (your template) ================= */
const ONES=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
const TENS=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
function words999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' HUNDRED');n%=100}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''))}else if(n>0)s.push(ONES[n]);return s.join(' ')}
function numWords(n){n=Math.floor(n);if(n===0)return 'ZERO';const parts=[];[[1e9,'BILLION'],[1e6,'MILLION'],[1e3,'THOUSAND'],[1,'']].forEach(([d,w])=>{const q=Math.floor(n/d);if(q){parts.push(words999(q)+(w?' '+w:''));n%=d}});return parts.join(' ').replace(/\s+/g,' ').trim()}
function amountWords(x){const neg=x<0;x=Math.abs(r2(x));const d=Math.floor(x+1e-9),c=Math.round((x-d)*100);let s='SINGAPORE DOLLAR '+numWords(d);if(c)s+=' AND '+words999(c)+' CENTS';return (neg?'(CREDIT) ':'')+s+' ONLY.'}
function agingBucket(dpd){return dpd<=0?'cur':dpd<=30?'a30':dpd<=60?'a60':dpd<=90?'a90':'o90'}
function soaData(custId,asOf,fromOpt){
  const c=custById(custId);asOf=asOf||todayISO();
  const invs=S.invoices.filter(v=>v.customerId===custId&&v.company===S.co&&v.status!=='void'&&v.date<=asOf);
  const entries=[];
  invs.forEach(v=>entries.push({date:v.date,type:'IN',ref:v.no,desc:'Invoice',dr:v.total,cr:0,inv:v}));
  S.payments.filter(p=>p.customerId===custId&&p.company===S.co&&p.date<=asOf).forEach(p=>entries.push({date:p.date,type:'OR',ref:p.ref||payMethod(p),desc:payDesc(p),dr:0,cr:p.amount}));
  invs.filter(v=>v.status==='paid'&&!hasAlloc(v.id)&&v.paidDate&&v.paidDate<=asOf).forEach(v=>entries.push({date:v.paidDate,type:'OR',ref:v.paidRef||'FUND TRANSFER',desc:'RECEIVED',dr:0,cr:v.total}));
  entries.sort((a,b)=>a.date===b.date?(a.type===b.type?String(a.ref).localeCompare(String(b.ref)):a.type==='IN'?-1:1):a.date.localeCompare(b.date));
  const outs=invs.map(v=>{const bal=invBal(v,asOf);const due=addDays(v.date,+v.terms||0);const dpd=daysBetween(due,asOf);return{v,bal,due,dpd,bucket:agingBucket(dpd)}}).filter(o=>o.bal>0.004);
  let from=fromOpt;if(!from)from=outs.length?outs.reduce((m,o)=>o.v.date<m?o.v.date:m,outs[0].v.date):asOf.slice(0,8)+'01';
  let bf=0;const rows=[];entries.forEach(e=>{if(e.date<from)bf=r2(bf+e.dr-e.cr);else rows.push(e)});
  let bal=bf;rows.forEach(e=>{bal=r2(bal+e.dr-e.cr);e.bal=bal});
  const aging={cur:0,a30:0,a60:0,a90:0,o90:0};outs.forEach(o=>aging[o.bucket]=r2(aging[o.bucket]+o.bal));
  return{co:S.co,cust:c,asOf,from,bf,rows,total:bal,aging,outs};
}
function soaName(d){return `${d.co}-SOA-${(d.cust?.name||'').replace(/[^A-Za-z0-9]+/g,'_').replace(/_(PTE|LTD|Pte|Ltd)_?/g,'_').replace(/_+$/,'').toUpperCase()}-${d.asOf}`}
function addrLines(a){const l=String(a||'').split(/\n/).map(s=>s.trim().replace(/[.,]\s*$/,'')).filter(Boolean);return l.map((x,i)=>i===0?'Address :  '+x+(l.length>1?' ,':'.'):x+(i===l.length-1?'.':''))}
function soaHeadLines(C){return C.style==='l3h'?[C.address,`Tel: ${C.tel}   Fax: ${C.fax}`,`Co. Reg No. ${C.reg}     GST Reg No. ${C.gstReg}`,`Email : ${C.email}`]:[C.address,`Co. Reg No: ${C.reg}     GST Reg No: ${C.gstReg}`,`Mobile: ${C.mobile}    Email: ${C.email}`]}

const normName=n=>String(n||'').toLowerCase().replace(/\b(pte|ltd|private|limited|p\/l|co)\b/g,'').replace(/[^a-z0-9]/g,'');
function findCustByName(name){const k=normName(name);if(!k)return null;const cs=coCustomers();return cs.find(c=>normName(c.name)===k)||cs.find(c=>normName(c.name).startsWith(k)||k.startsWith(normName(c.name)))||null}
function cellText(v){if(v==null)return'';if(v instanceof Date)return v;if(typeof v==='object'){if(v.richText)return v.richText.map(x=>x.text).join('');if('result' in v)return v.result;if(v.text)return v.text}return v}
function toISO(v){if(v instanceof Date)return v.getUTCFullYear()+'-'+pad(v.getUTCMonth()+1)+'-'+pad(v.getUTCDate());if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return toISO(d)}return parseDate(String(v||'').trim())}
function parseSOASheet(ws){
  const g=(r,c)=>cellText(ws.getRow(r).getCell(c).value);
  let debtor='',terms=0,addr=[],H=0;
  for(let r=1;r<=15;r++){const a=String(g(r,1)||'');if(/^Debtor/i.test(a))debtor=a.replace(/^Debtor\s*:\s*/i,'').trim();
    const e=String(g(r,5)||'');if(/^Terms/i.test(e)){const m=e.match(/(\d+)/);terms=m?+m[1]:0}
    if(/^Address/i.test(a))addr.push(a.replace(/^Address\s*:\s*/i,''));else if(addr.length&&a&&!H&&!/^Debtor/i.test(a))addr.push(a);
    if(String(g(r,3)).trim()==='Ref'&&/DR/i.test(String(g(r,5)))){H=r;break}}
  const rows=[];
  if(H)for(let r=H+1;r<=ws.rowCount;r++){const a=g(r,1);if(typeof a==='string'&&/^(SINGAPORE|Note)/i.test(a))break;
    const t=String(g(r,2)||'').trim().toUpperCase();if(t!=='IN'&&t!=='OR')continue;
    const date=toISO(a);const ref=String(g(r,3)||'').trim();const desc=String(g(r,4)||'').trim();const dr=+g(r,5)||0,cr=+g(r,6)||0;
    rows.push({date,type:t,ref,desc,dr:r2(dr),cr:r2(cr)})}
  return{sheet:ws.name,debtor,terms,address:addr.map(x=>x.trim().replace(/[.,]\s*$/,'')).filter(Boolean).join('\n'),rows};
}

async function importCustomer(name,address,terms,cust,rows){
  const c=await ensureCustomer(name,address,terms,cust);let ni=0,np=0;const newPays=[];
  for(const r of rows){if(!r.date)continue;
    if(r.dr&&!S.invoices.some(v=>v.no===r.ref&&v.status!=='void')){
      const base=(r.ref||'OLD').replace(/[^A-Za-z0-9\-_.]/g,'-');let id=base,n=2;while(S.invoices.some(v=>v.id===id))id=base+'-R'+n++;
      await store.save('invoices',{id,kind:'legacy',company:S.co,no:r.ref||'(no ref)',date:r.date,from:r.date,to:r.date,customerId:c.id,custName:c.name,cust:{name:c.name,address:c.address},terms:+c.terms||0,total:r.dr,subtotal:r.dr,gst:0,gstRate:9,groups:[],note:r.desc,status:'unpaid',createdAt:Date.now()});ni++}

      const p={id:uid('p'),company:S.co,customerId:c.id,date:r.date,amount:r.cr,ref:(r.type==='OR'?r.ref:'')||'FUND TRANSFER',alloc:[],createdAt:Date.now()};await store.save('payments',p);newPays.push(p);np++}
  }

async function fifoAllocate(custId,pays){
  const invs=S.invoices.filter(v=>v.customerId===custId&&v.status!=='void').sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
  const touched=[];
  for(const p of pays.sort((a,b)=>a.date.localeCompare(b.date))){let left=r2(p.amount-(p.alloc||[]).reduce((s,x)=>s+x.amt,0));const alloc=[...(p.alloc||[])];
    for(const v of invs){if(left<=0.004)break;const b=invBal(v);if(b<=0.004)continue;const a=r2(Math.min(b,left));alloc.push({inv:v.id,amt:a});left=r2(left-a);touched.push(v.id);
      p.alloc=alloc;upsert(S.payments,p)}
    await store.save('payments',{...p,alloc})}
  await syncInvoices(touched);
}

  if(S.soa.cust){const d=soaData(S.soa.cust,S.soa.date,S.soa.from);const h=$('#s-prev');h.innerHTML=soaPages(d).map(p=>`<div class="sheet-wrap">${p}</div>`).join('');requestAnimationFrame(()=>fitSheets(h));

    const csv=rows.map(r=>r.map(x=>{x=String(x??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\n');

  });

function rateText(r){
  const m=v=>v==null||v===''?'未设':'$'+money(v);const s=svcOf(S.co,r.service);const veh=r.vehicle?` [${r.vehicle}]`:'';
  if(r.mode==='unit')return `${esc(s.label)}${veh}：${m(r.unitRate)} / ${esc(r.uom)}${r.label?' · '+esc(r.label):''}`;
  if(r.mode==='hourly')return `${esc(s.label)}${veh}：按小时 白天 ${m(r.dayRate)} · 晚上 ${m(r.nightRate)}${+r.minHr?' · 最少 '+r.minHr+' 小时':''}${r.deductBreak?' · 扣休息':''}${+r.diesel?' · 柴油 $'+money(r.diesel):''}`;
  return `${esc(s.label)}${veh}：白天 ${m(r.dayRate)}（OT ${m(r.otDay)}）· 晚上 ${m(r.nightRate)}（OT ${m(r.otNight)}）${+r.diesel?' · 柴油 $'+money(r.diesel):''}`;
}

function editCustomer(id){

    $('#r-add').addEventListener('click',()=>{readAll();c.rates.push(normRate({service:SVC[S.co][0].id}));draw()});
    $('#modalBox').querySelectorAll('[data-rdel]').forEach(b=>b.addEventListener('click',()=>{readAll();c.rates.splice(+b.dataset.rdel,1);draw()}));
    $('#c-cancel').addEventListener('click',()=>$('#modal').hidden=true);
    if($('#c-del'))$('#c-del').addEventListener('click',async()=>{if(S.dos.some(d=>d.customerId===id)||S.rentals.some(r=>r.customerId===id)){toast('这个客户已经有记录，不能删除');return}if(!await askConfirm('删除 '+c.name+'？'))return;M.customers=M.customers.filter(x=>x.id!==id);await store.saveMaster();$('#modal').hidden=true;renderAll()});
    $('#c-save').addEventListener('click',async()=>{readAll();if(!c.name){toast('要填公司名');return}
      const file=$('#q-file')?.files?.[0];if(file&&ASSETS){try{const r=await ASSETS.upload(file);c.quote={id:r.id,name:file.name}}catch(e){toast('报价单上载失败')}}
      c.rates=c.rates.map(normRate);const i=M.customers.findIndex(x=>x.id===c.id);i>=0?M.customers[i]=c:M.customers.push(c);
      await store.saveMaster();$('#modal').hidden=true;toast('已保存');renderAll()});
  };
  $('#modal').hidden=false;draw();
}

/* ================= boot ================= */
{let th='dark';try{th=localStorage.getItem('bill.theme')||'dark'}catch(e){}applyTheme(th)}
$('#themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
loadLocal();renderAll();connect();

</script>
