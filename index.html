let pdfjsLoading=null;
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();
  return pdfjsLoading||(pdfjsLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res()};
    sc.onerror=()=>{pdfjsLoading=null;rej(new Error(L("PDF 读取工具载入失败，请检查网络","Could not load the PDF reader")))};document.head.appendChild(sc)}))}
const canvasJpeg=(cv,q)=>new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",q));
/* 照片 → 压缩 JPEG（最长边 1600px） */
async function compressImage(file,maxPx=1600,q=0.72){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(L("读不到这张照片","Could not read this image")));i.src=url});
    const s=Math.min(1,maxPx/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
    return await canvasJpeg(cv,q)}finally{URL.revokeObjectURL(url)}}
/* PDF → 每页变成 JPEG（约 200dpi） */
async function pdfToJpegs(file,maxPages=6,q=0.75){
  await loadPdfJs();const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=Math.min(doc.numPages,maxPages);p++){const pg=await doc.getPage(p),v0=pg.getViewport({scale:1}),sc=Math.min(2.8,1700/Math.max(v0.width,v0.height)),v=pg.getViewport({scale:sc});
    const cv=document.createElement("canvas");cv.width=Math.round(v.width);cv.height=Math.round(v.height);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:v}).promise;out.push(await canvasJpeg(cv,q))}
  return out}
async function toJpegs(file,maxPages){return /pdf$/i.test(file.type)||/\.pdf$/i.test(file.name)?pdfToJpegs(file,maxPages,0.9):[await compressImage(file,3200,0.92)]}

function parseDO(lines){const T=lines.join("\n"),U=T.toUpperCase();let no=null;
  for(const rx of[/(?:D\s*\.?\s*\/?\s*O\s*\.?|DELIVERY\s*ORDER|D\s*\/\s*N|\bDN)\s*(?:NO\.?|NUMBER|#)?\s*[:：#.]?\s*([A-Z]{0,3}-?\d{4,7})\b/i,/\bN[O0][.:]?\s*[:：]?\s*(\d{4,7})\b/i]){const m=T.match(rx);if(m){no=m[1];break}}

  if(!plate){const m=U.match(/\b([A-Z]{2,3}\s?\d{1,4}\s?[A-Z])\b/);if(m)plate=m[1].replace(/\s/g,"")}
  let cust="",bl=0;const N=" "+normCo(T)+" ";for(const c of S.d.customers){const n=normCo(c.name);if(n.length>=4&&N.includes(" "+n+" ")&&n.length>bl){bl=n.length;cust=c.id}}
  return{no,date,plate,cust}}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});

  return blobToDataURL(data)}

async function buildCustomerPdf(inv,doOnly,opt){opt=opt||{};

  await loadPdfLibs();const{jsPDF}=window.jspdf,pdf=opt.into?(opt.into.addPage("a4","portrait"),opt.into):new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true}),box=$("#print"),warn=[];
  const sg=doOnly?null:signedOf(inv);
  if(doOnly){}else if(sg)await addImagePage(pdf,true,await attDataURL(sg),0);
  else{warn.push(L("还没上传签名页，第一页用没签名的 invoice","No signed page — unsigned invoice used"));box.innerHTML=invoiceHTML(inv,!!breakdownHTML(inv,dos).trim())}
  if(!doOnly&&(!sg||dos.length||isMachInv(inv))){if(sg)box.innerHTML="";box.innerHTML+=breakdownHTML(inv,dos);box.classList.add("cap");
    try{if(document.fonts?.ready)await document.fonts.ready;await new Promise(r=>setTimeout(r,60));let first=!sg;
      for(const pg of box.querySelectorAll(".pg")){const land=pg.classList.contains("land"),W=land?297:210,H=land?210:297,cv=await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",logging:false});
        if(!first)pdf.addPage("a4",land?"landscape":"portrait");first=false;let w=W,h=cv.height*W/cv.width;if(h>H){h=H;w=cv.width*H/cv.height}
        pdf.addImage(cv.toDataURL("image/jpeg",0.85),"JPEG",0,0,w,h,undefined,"FAST")}}finally{box.classList.remove("cap")}}
  const po=poDocsOf(inv);

  let missing=0;const pics=[];for(const d of dos){const ph=doPhotos(d.id);if(!ph.length){missing++;continue}for(const a of ph)pics.push(a)}

    const k=Math.min(cw/w,ch/h),dw=w*k,dh=h*k;pdf.addImage(src,"JPEG",cx+(cw-dw)/2,cy+(ch-dh)/2,dw,dh,undefined,"FAST");pdf.setDrawColor(190);pdf.setLineWidth(0.2);pdf.rect(cx+(cw-dw)/2,cy+(ch-dh)/2,dw,dh)}

  if(missing)warn.push(L(`${missing} 张 DO 没有照片`,`${missing} DO(s) without photo`));
  return{blob:opt.noBlob?null:pdf.output("blob"),warn,pdf}}

/* ---- PO（寄客户版本用） ---- */
const PO_KIND="Customer PO";

    (grp[k]=grp[k]||{svc:rs||d.service,used:d.rate,m,n:0,amt:0,list:[]});grp[k].n++;grp[k].amt+=Number(d.amount)||0;grp[k].list.push(d.do_no)}

  <tr>${[D.ag.cur,D.ag.d30,D.ag.d60,D.ag.d90,D.ag.over].map(v=>`<td>${v>0.005?"$"+money(v):""}</td>`).join("")}${D.credit>0.005?`<td>($${money(D.credit)})</td>`:""}</tr></table>
  <div class="nb2">- Invoices considered correct unless disputes notified to us within SEVEN (7) days from date of invoice<br>- Interest at the rate of 1.5% per month will be charged on all overdue amounts</div></div>`;
  const fn=soaFileName(c,S.soaAsOf,G.total);
  if(mode==="blob"){const blob=await makePdf(fn,{blob:1});return blob?{blob,fn,total:G.total}:null}
  if(mode==="print"){document.title=fn;setTimeout(()=>{window.print();document.title="ETK · L3H 开单系统"},100);return}
  if(mode==="save"){const blob=await makePdf(fn,{blob:1});if(blob)await soaSaveCopy(blob,fn);return}
  if(mode==="preview"){const blob=await makePdf(fn,{blob:1});if(!blob)return;const u=URL.createObjectURL(blob);
    pvOv(`<div class="pvhead"><h3 style="margin:0">👁 SOA · ${esc(c.name||"")} · ${dmy(S.soaAsOf)}</h3><span class="mute" style="font-size:13px">${L("余额","Balance")} $${money(G.total)}</span><span style="flex:1"></span>
      <button class="btn sm" onclick="document.querySelector('#photoOv')?.remove();printSOA()">⬇ ${L("没问题，下载","Looks good — download")}</button><button class="btn sec sm" onclick="document.querySelector('#photoOv')?.remove();sendSOA('WhatsApp')">WhatsApp</button><button class="btn sec sm" onclick="document.querySelector('#photoOv')?.remove();sendSOA('Email')">Email</button><button class="btn sec sm" data-a="x">✕</button></div>
      <iframe src="${u}" style="width:100%;height:78vh;border:0;background:#fff;border-radius:6px"></iframe>`);return}
  const blob=await makePdf(fn,{blob:1});if(!blob)return;saveBlob(blob,fn.replace(/[\\/:*?"<>|]+/g,"-")+".pdf");toast(L("PDF 已下载","PDF downloaded"));soaSaveCopy(blob,fn)}

/* SOA 文件名：ETK_SOA_-DENZAI_2517.90__30-09-26（客户资料的「简称」，没填用公司名第一个字） */
function soaFileName(c,asOf,total){const sn=(String(c.short_name||"").trim()||String(c.name||"").split(/\s+/)[0]||"").toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  const [y,m,d]=String(asOf).split("-");return `${S.company}_SOA_-${sn}_${r2(total).toFixed(2)}__${d}-${m}-${y.slice(2)}`}
/* ---- A：一次产生全部客户的 SOA（zip） + B：按客户合并提醒 ---- */
let SB=null;
function soaBatchRows(asOf){return S.d.customers.filter(c=>c.company===S.company||!c.company).map(c=>{const D=soaData(c.id,asOf);
    const od=D.rows.filter(i=>overdueDays(i,asOf)>0),last=S.d.reminders.filter(r=>invById(r.invoice_id)?.customer_id===c.id).map(r=>r.sent_at).sort().at(-1)||"";
    return{c,total:D.total,od,odAmt:r2(sum(od,balOf)),last}}).filter(x=>x.total>0.005).sort((a,b)=>b.odAmt-a.odAmt||b.total-a.total)}
function soaBatch(){const asOf=today();SB={asOf,rows:soaBatchRows(asOf)};SB.sel=new Set(SB.rows.map(x=>x.c.id));sbRender()}
function sbRender(){const R=SB.rows,dl=(d)=>d?Math.round((new Date(today())-new Date(d))/864e5):null;
  pvOv(`<div class="pvhead"><h3 style="margin:0">📑 ${L("全部客户 SOA / 逾期提醒","All statements / overdue reminders")} · ${S.company}</h3><span style="flex:1"></span><button class="btn sec sm" data-a="x">✕</button></div>
  <div class="filters"><label class="f">${L("截至日期","As at")}<input type="date" value="${SB.asOf}" onchange="SB.asOf=this.value;SB.rows=soaBatchRows(this.value);SB.sel=new Set(SB.rows.map(x=>x.c.id));sbRender()"></label></div>
  <p class="mute" style="font-size:13px;margin-top:0">${L("列出还有欠款的客户。勾好按「下载 zip」，每个客户一份 SOA PDF（文件名用客户的「简称」）。逾期的客户可以直接按 Email / WhatsApp 提醒：系统先下载他的 SOA，再打开信息，内容列出逾期的单。","Customers with a balance. Tick and download a zip of statements, or send an overdue reminder with the statement.")}</p>
  ${R.length?`<div class="tw" style="max-height:55vh"><table><thead><tr><th><input type="checkbox" ${SB.sel.size===R.length?"checked":""} onchange="SB.sel=new Set(this.checked?SB.rows.map(x=>x.c.id):[]);sbRender()"></th><th>${L("客户","Customer")}</th><th class="num">${L("欠款","Balance")}</th><th class="num">${L("逾期","Overdue")}</th><th>${L("上次提醒","Last reminder")}</th><th>${L("提醒","Remind")}</th></tr></thead><tbody>
  ${R.map(x=>{const d=dl(x.last);return `<tr class="${x.od.length?"red":""}"><td><input type="checkbox" ${SB.sel.has(x.c.id)?"checked":""} onchange="this.checked?SB.sel.add('${x.c.id}'):SB.sel.delete('${x.c.id}')"></td>
    <td>${esc(x.c.name)}${x.c.short_name?` <span class="mute">(${esc(x.c.short_name)})</span>`:""}</td><td class="num">${money(x.total)}</td><td class="num">${x.od.length?`${money(x.odAmt)} <span class="mute">· ${x.od.length} ${L("张","inv")}</span>`:"—"}</td>
    <td>${x.last?`${dmy(x.last)} <span class="${d>14?"tag warn":"mute"}">${L(`${d} 天前`,`${d}d ago`)}</span>`:`<span class="mute">${L("没提醒过","never")}</span>`}</td>
    <td style="white-space:nowrap">${x.od.length?`<button class="btn sec sm" onclick="soaRemind('${x.c.id}','Email')">Email</button> <button class="btn sec sm" onclick="soaRemind('${x.c.id}','WhatsApp')">WhatsApp</button>`:""}</td></tr>`}).join("")}</tbody></table></div>
  <div class="actions" style="margin-top:10px"><button class="btn" id="sbGo" onclick="soaBatchZip()">⬇ ${L(`下载 zip（${SB.sel.size} 个客户）`,`Download zip (${SB.sel.size})`)}</button></div><p id="sbProg" class="mute"></p>`
  :`<p class="tag ok">${L("没有客户欠款 👍","Nobody owes anything")}</p>`}`)}
async function soaWith(cid,asOf,fn){const k=[S.soaCust,S.soaAsOf];S.soaCust=cid;S.soaAsOf=asOf;try{return await fn()}finally{S.soaCust=k[0];S.soaAsOf=k[1]}}
async function soaBatchZip(){const ids=SB.rows.filter(x=>SB.sel.has(x.c.id)).map(x=>x.c.id);if(!ids.length)return toast(L("还没勾客户","Nothing ticked"));const b=$("#sbGo");if(b)b.disabled=true;
  try{await loadJSZip();const z=new JSZip();let n=0;
    for(const cid of ids){const e=$("#sbProg");if(e)e.textContent=`${L("产生中","Building")} ${++n}/${ids.length} · ${custName(cid)}`;
      const r=await soaWith(cid,SB.asOf,()=>printSOA("blob"));if(!r)continue;z.file(r.fn.replace(/[\\/:*?"<>|]+/g,"-")+".pdf",r.blob);await soaWith(cid,SB.asOf,()=>soaSaveCopy(r.blob,r.fn))}
    const blob=await z.generateAsync({type:"blob"}),[y,m,d]=SB.asOf.split("-");saveBlob(blob,`${S.company}_SOA_${d}-${m}-${y.slice(2)}.zip`);
    const e=$("#sbProg");if(e)e.textContent=L(`完成：${ids.length} 份 SOA 已下载（zip），每份也存进客户的「以前的 SOA」。`,`Done: ${ids.length} statements.`)}
  catch(e){alert(e.message)}finally{if(b)b.disabled=false}}
async function soaRemind(cid,via){const asOf=SB?.asOf||today(),c=custOf(cid),s=settingsOf(S.company),D=soaData(cid,asOf),od=D.rows.filter(i=>overdueDays(i,asOf)>0);
  if(!od.length)return toast(L("这个客户没有逾期的单","Nothing overdue"));
  try{toast(L("正在产生 SOA…","Building statement…"));const r=await soaWith(cid,asOf,()=>printSOA("blob"));if(!r)return;const name=r.fn.replace(/[\\/:*?"<>|]+/g,"-")+".pdf",file=new File([r.blob],name,{type:"application/pdf"});
    const shared=via==="WhatsApp"&&navigator.canShare?.({files:[file]});
    if(shared){try{await navigator.share({files:[file],title:name})}catch(e){if(e.name!=="AbortError")throw e;return}}else saveBlob(r.blob,name);
    await soaWith(cid,asOf,()=>soaSaveCopy(r.blob,r.fn));
    const text=`Dear ${c.attention||"Team"},\n\nThis is a friendly reminder that the following invoices are overdue:\n${od.map(i=>`- ${i.invoice_no} (${dmy(i.invoice_date)}, due ${dmy(i.due_date)}): $${money(balOf(i))}, overdue ${overdueDays(i,asOf)} days`).join("\n")}\nTotal overdue: $${money(sum(od,balOf))}\nTotal outstanding as at ${dmy(asOf)}: $${money(D.total)}\n\nPlease find our statement of account attached. Kindly arrange payment at your earliest convenience. Please ignore this message if payment has been made.\n\nThank you.\n\nBest regards,\n${signName(s)}`;
    if(!shared)openOut(via,c,`Payment Reminder - Statement of Account as at ${dmy(asOf)}`,text);
    setTimeout(async()=>{if(confirm(L(`已经用 ${via} 提醒了吗？按确定把这 ${od.length} 张记成今天提醒。${shared?"":`\n（SOA ${name} 已下载，请自己附上）`}`,`Reminder sent? OK records it for ${od.length} invoices.`))){
      const{error}=await sb.from("reminders").insert(od.map(i=>({invoice_id:i.id,sent_at:today(),sent_via:via})));if(error)return toast(error.message);
      await sb.from("soa_sends").insert({company:S.company,customer_id:cid,as_of:asOf,sent_at:today(),sent_via:via});await loadAll();if(SB&&$("#photoOv")){SB.rows=soaBatchRows(SB.asOf);sbRender()}else render()}},1200)}
  catch(e){toast(e.message||String(e))}}
/* ---- A2：找重复的客户 / 供应商，合并成一个 ---- */
const dupKey=n=>normCo(n).replace(/\b(PTE|PRIVATE|LTD|LIMITED|PL|P\/L|THE|CO|SDN|BHD)\b/g," ").replace(/\s+/g,"");
function dupList(ent){return(S.d[ent]||[]).filter(r=>ent==="suppliers"||r.company===S.company||!r.company)}
function dupSimilar(ent,name,exceptId){const k=dupKey(name);if(k.length<3)return null;return dupList(ent).find(r=>r.id!==exceptId&&(dupKey(r.name)===k||(k.length>=6&&simCo(normCo(name),normCo(r.name))>=0.92)))||null}
function dupGroups(ent){const L0=dupList(ent),n=L0.length,par=[...Array(n).keys()],f=i=>par[i]===i?i:(par[i]=f(par[i]));const ks=L0.map(r=>dupKey(r.name)),ns=L0.map(r=>normCo(r.name));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(ks[i].length<3)continue;if(ks[i]===ks[j]||(ks[i].length>=6&&ks[j].length>=6&&simCo(ns[i],ns[j])>=0.92))par[f(i)]=f(j)}
  const g={};L0.forEach((r,i)=>(g[f(i)]=g[f(i)]||[]).push(r));return Object.values(g).filter(x=>x.length>1)}
const DUP_REF={customers:["invoices","payments","delivery_orders","rates","customer_surcharges","projects","monthly_fix","soa_sends"],suppliers:["supplier_invoices","diesel_surcharges","payment_vouchers"]};
const DUP_FILL={customers:["short_name","address","attention","email","email_cc","whatsapp","tel","uen"],suppliers:["short_name","address","email","tel","bank","account_no","whatsapp"]};
let DP=null;
async function dupOpen(ent){DP={ent,groups:dupGroups(ent),cnt:{},keep:{}};DP.groups.forEach((g,i)=>DP.keep[i]=null);dupRender();
  const col=ent==="customers"?"customer_id":"supplier_id";
  const loc={payment_vouchers:"pvs"};
  for(const g of DP.groups)for(const r of g){const c={};for(const t of DUP_REF[ent]){const arr=S.d[loc[t]||t];
      if(t!=="delivery_orders"&&Array.isArray(arr)){c[t]=arr.filter(x=>x[col]===r.id).length;continue}
      try{const{count,error}=await sb.from(t).select("id",{count:"exact",head:true}).eq(col,r.id);if(!error)c[t]=count||0}catch(e){}}DP.cnt[r.id]=c}
  DP.groups.forEach((g,i)=>{if(!DP.keep[i])DP.keep[i]=[...g].sort((a,b)=>dupScore(b)-dupScore(a))[0].id});if($("#photoOv"))dupRender()}
const dupScore=r=>Object.values(DP.cnt[r.id]||{}).reduce((a,b)=>a+b,0);
function dupRender(){const{ent,groups}=DP,cu=ent==="customers",lab={invoices:L("Invoice","Invoices"),payments:L("收款","Payments"),delivery_orders:"DO",rates:L("价钱","Rates"),customer_surcharges:"Surcharge",projects:"Project",monthly_fix:"Monthly Fix",soa_sends:"SOA",supplier_invoices:"Supplier Inv",diesel_surcharges:"Surcharge",payment_vouchers:"PV"};
  pvOv(`<div class="pvhead"><h3 style="margin:0">🔍 ${L(cu?"重复的客户":"重复的供应商",cu?"Duplicate customers":"Duplicate suppliers")}</h3><span style="flex:1"></span><button class="btn sec sm" data-a="x">✕</button></div>
  <p class="mute" style="font-size:13px;margin-top:0">${L("名字很像的放在一组（不管 Pte / Ltd、点、大小写、& / AND）。选要留哪一个，按「合并」：另一个名字下面的 invoice、收款、DO、价钱等全部移过来，缺的 Email / 地址会补上，另一个放进回收站。不是同一间公司的组，不用理它。","Similar names are grouped. Pick the one to keep and merge; everything moves over and the other goes to the recycle bin.")}</p>
  ${groups.length?groups.map((g,i)=>`<div class="panel" style="padding:10px;margin:0 0 10px"><table><tbody>${g.map(r=>{const c=DP.cnt[r.id];return `<tr><td style="width:30px"><input type="radio" name="dk${i}" ${DP.keep[i]===r.id?"checked":""} onchange="DP.keep[${i}]='${r.id}'"></td>
      <td><b>${esc(r.name)}</b><div class="mute" style="font-size:12px">${esc([r.short_name,r.email,r.address&&String(r.address).split("\n")[0],r.payment_terms_days!=null?`${r.payment_terms_days} ${L("天","days")}`:""].filter(Boolean).join(" · "))}</div></td>
      <td style="font-size:12px">${c?Object.entries(c).filter(([,v])=>v).map(([t,v])=>`${lab[t]||t} ${v}`).join(" · ")||`<span class="mute">${L("没有资料","no records")}</span>`:"⏳"}</td></tr>`}).join("")}</tbody></table>
    <div class="actions" style="margin-top:6px"><button class="btn sm" onclick="dupMerge(${i})">⇢ ${L("合并成选的那一个","Merge into selected")}</button></div></div>`).join("")
  :`<p class="tag ok">${L("没有找到重复的 👍","No duplicates found")}</p>`}`)}
async function dupMerge(i){const{ent}=DP,g=DP.groups[i],keepId=DP.keep[i],keep=g.find(r=>r.id===keepId),drops=g.filter(r=>r.id!==keepId),col=ent==="customers"?"customer_id":"supplier_id";if(!keep)return;
  if(!confirm(L(`把 ${drops.map(r=>`「${r.name}」`).join("、")} 合并到「${keep.name}」？\n下面的单全部会移过去，另一个名字放进回收站。`,`Merge ${drops.length} into "${keep.name}"?`)))return;
  try{const fill={};for(const k of DUP_FILL[ent]){if(keep[k]==null||keep[k]==="")for(const d of drops)if(d[k]!=null&&d[k]!==""){fill[k]=d[k];break}}
    if(keep.payment_terms_days==null)for(const d of drops)if(d.payment_terms_days!=null){fill.payment_terms_days=d.payment_terms_days;break}
    for(const d of drops){for(const t of DUP_REF[ent]){const{error}=await sb.from(t).update({[col]:keepId}).eq(col,d.id);if(error&&!/does not exist|schema cache|relation/i.test(error.message))throw new Error(`${t}: ${error.message}`)}
      await sb.from("attachments").update({entity_id:keepId}).eq("entity_id",d.id).in("entity_type",ent==="customers"?["customers","soa"]:["suppliers"]);
      await binSave(ent,JSON.parse(JSON.stringify(d)));const{error}=await sb.from(ent).delete().eq("id",d.id);if(error)throw error}
    if(Object.keys(fill).length){const{error}=await sb.from(ent).update(fill).eq("id",keepId);if(error&&!/column/i.test(error.message))throw error}
    await loadAll();toast(L(`已合并到「${keep.name}」`,`Merged into ${keep.name}`));DP.groups=dupGroups(ent);DP.groups.forEach((g2,k)=>{DP.keep[k]=[...g2].sort((a,b)=>dupScore(b)-dupScore(a))[0].id});dupRender();render()}
  catch(e){alert(L("合并中断：","Merge stopped: ")+e.message);await loadAll();render()}}
/* ================= 弹出视窗 ================= */
function modalView(){const m=S.modal;const body=m.kind==="invForm"?invFormView(m.f):m.kind==="inv"?invDetailView(m.id):m.kind==="payForm"?payFormView(m.f):"";
  return `<div class="modal" onclick="if(event.target===this&&!S.dirty)closeModal()"><div class="box">${body}</div></div>`}
async function closeModal(){S.modal=null;done();await reload()}

/* ================= 动作 ================= */
async function doLogin(e){e.preventDefault();const fd=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:fd.get("email"),password:fd.get("password")});
  if(error)toast(L("登录失败：","Login failed: ")+error.message)}
async function logout(){await sb.auth.signOut()}
/* 8 小时没动就自动登出 */
const IDLE_MAX=8*3600*1000;const touch=()=>{try{localStorage.setItem("lastAct",String(Date.now()))}catch(e){}};let touchT=0;
["click","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{const n=Date.now();if(n-touchT>60000){touchT=n;touch()}},{passive:true}));
function idleCheck(){if(!S.user)return;let t=0;try{t=+localStorage.getItem("lastAct")||0}catch(e){}if(t&&Date.now()-t>IDLE_MAX){try{localStorage.removeItem("lastAct")}catch(e){}toast(L("超过 8 小时没用，已自动登出","Signed out after 8 hours idle"));logout()}}
setInterval(idleCheck,5*60*1000);
function confirmLeave(){return !S.dirty||confirm(L("还没保存，确定离开？","You have unsaved changes. Leave anyway?"))}
function setTab(x){if(!confirmLeave())return;S.scr[S.tab]=scrSnap();S.tab=x;S.doForm=null;done();if(S.pending){S.pending=false;reload()}else render()}
async function setCompany(c){if(!confirmLeave())return;S.company=c;if(c!=="L3H"&&S.tab==="exc")S.tab="do";setPref("company",c);S.doForm=null;S.modal=null;done();await reload()}
async function setMonth(m){S.month=m;await loadDO();render()}
function toggleLang(){S.lang=S.lang==="zh"?"en":"zh";setPref("lang",S.lang);document.documentElement.lang=S.lang;render()}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";setPref("theme",S.theme);document.documentElement.dataset.theme=S.theme;render()}
sb.auth.onAuthStateChange((_ev,session)=>{const was=S.user?.id;S.user=session?.user||null;if(S.user&&!was){setTimeout(()=>{if(_ev==="SIGNED_IN")touch();else{idleCheck();if(S.user)touch()}},0)}
  if(S.user&&S.user.id!==was){setTimeout(async()=>{await reload();startRealtime()},0)}
  if(!S.user){if(rt)sb.removeChannel(rt);render()}});
loadUI();render();
</script>
