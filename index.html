<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETK · L3H 开单系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#141a22; --panel:#1b232e; --panel2:#222c39; --line:#2e3a4a;
  --ink:#e6ebf1; --mute:#8d9aab; --amber:#f2a900; --amber-ink:#1a1400;
  --ok:#3fb27f; --bad:#e5534b; --night:#7c8cff; --day:#f2c14e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --line:#d5dbe3;
  --ink:#18202b; --mute:#5d6b7c; --amber:#c98a00; --amber-ink:#ffffff;
  --night:#4a5bd6; --day:#a07400;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand .stripe{width:28px;height:18px;border-radius:3px;
  background:repeating-linear-gradient(135deg,var(--amber) 0 6px,transparent 6px 12px);border:1px solid var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--amber);color:var(--amber-ink);font-weight:600}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--mute)}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}

nav.tabs{display:flex;gap:4px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}

main{max-width:1200px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f input,label.f select,label.f textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0}
label.f input.auto{border-style:dashed}
label.f textarea{min-height:70px;resize:vertical}
.calc{display:flex;flex-wrap:wrap;gap:20px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.calc div{font-size:13px;color:var(--mute)} .calc b{display:block;font-size:20px;color:var(--ink)}
.calc .total b{color:var(--amber)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--amber);color:var(--amber-ink)}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:500}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;border:1px solid currentColor}
.tag.Night{color:var(--night)} .tag.Day{color:var(--day)}
.warn{color:var(--bad);font-size:13px;margin-top:8px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);color:var(--mute);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
tfoot td{font-weight:600;background:var(--panel2)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 14px;cursor:pointer;color:var(--mute)}
.sub button.on{border-color:var(--amber);color:var(--ink)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login .panel{width:100%;max-width:360px}
.login h1{font-size:22px;margin:0 0 4px}
.login p{color:var(--mute);margin:0 0 18px;font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:600px){ .top{padding:8px 12px} main{padding:12px} .grid{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ========= 设定 ========= */
const SUPABASE_URL = "https://kmaztlooqgeyllxfwhzv.supabase.co";
const SUPABASE_KEY = "sb_publishable_NE6-Y5kX5zBcoP2vV7pEyQ_Xtm2ulir";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SERVICES = { ETK:["TMA","VMS"], L3H:["Tipper","Lorry Crane","Excavator"] };
const RATE_SERVICES = { ETK:["TMA Day","TMA Night","VMS"], L3H:["Tipper","Lorry Crane","Excavator"] };

/* ========= 中英文 ========= */
const T = {
 zh:{login:"登录",email:"Email",password:"密码",loginHint:"用 Supabase 建立的账号登录",logout:"登出",
  synced:"已同步",offline:"未连线",tabDO:"Key in DO",tabMaster:"Master List",
  customers:"客户",vehicles:"车牌",rates:"价钱",customer_surcharges:"Diesel Surcharge（客户）",
  newDO:"新增 DO",editDO:"修改 DO",date:"日期",customer:"客户",project:"Project",service:"Service",plate:"车牌",
  do_no:"DO 号码",customer_po:"客户 PO",start:"开始时间",end:"结束时间",from:"From",to:"To",
  description:"Description",actual:"实际小时",billable:"计费小时",rate:"Rate",surcharge:"Surcharge",amount:"金额",
  remark:"Remark",save:"保存",saved:"已保存",cancel:"取消",del:"删除",deleted:"已删除",confirmDel:"确定删除？",
  month:"月份",all:"全部",total:"合计",noDO:"这个月还没有 DO，在上面新增第一张。",
  dup:"DO 号码已存在（日期 {d}），不能重复。",noRate:"找不到这个客户 / service 在这个日期的价钱，请先到 Master List 设定。",
  required:"请填写：",add:"新增",edit:"修改",empty:"还没有资料，按「新增」开始。",
  name:"名称",payment_terms_days:"付款期限（天）",attention:"Attn",whatsapp:"WhatsApp",address:"地址",
  vehicle_type:"车型",unit:"单位",price:"价钱",effective_from:"生效日期",effective_to:"结束日期",
  break_after_hours:"超过几小时扣吃饭",break_hours:"扣几小时",min_hours:"最少小时",
  amount_per_do:"每张 DO 金额",start_date:"开始日期",end_date:"结束日期",allServices:"所有 service",
  hoursEdited:"手动",shift:"Day/Night",light:"☀️ 浅色",dark:"🌙 深色",lang:"EN"},
 en:{login:"Log in",email:"Email",password:"Password",loginHint:"Use the account you created in Supabase",logout:"Log out",
  synced:"Synced",offline:"Offline",tabDO:"Key in DO",tabMaster:"Master List",
  customers:"Customers",vehicles:"Vehicles",rates:"Rates",customer_surcharges:"Diesel surcharge (customer)",
  newDO:"New DO",editDO:"Edit DO",date:"Date",customer:"Customer",project:"Project",service:"Service",plate:"Vehicle No",
  do_no:"DO No",customer_po:"Customer PO",start:"Start time",end:"End time",from:"From",to:"To",
  description:"Description",actual:"Actual hrs",billable:"Billable hrs",rate:"Rate",surcharge:"Surcharge",amount:"Amount",
  remark:"Remark",save:"Save",saved:"Saved",cancel:"Cancel",del:"Delete",deleted:"Deleted",confirmDel:"Delete this record?",
  month:"Month",all:"All",total:"Total",noDO:"No DOs this month yet. Add the first one above.",
  dup:"This DO number already exists (dated {d}).",noRate:"No rate found for this customer / service on this date. Set it in Master List first.",
  required:"Please fill in: ",add:"Add",edit:"Edit",empty:"Nothing here yet. Press Add to start.",
  name:"Name",payment_terms_days:"Payment terms (days)",attention:"Attn",whatsapp:"WhatsApp",address:"Address",
  vehicle_type:"Vehicle type",unit:"Unit",price:"Price",effective_from:"Effective from",effective_to:"Effective to",
  break_after_hours:"Meal break if over (hrs)",break_hours:"Deduct (hrs)",min_hours:"Minimum hrs",
  amount_per_do:"Amount per DO",start_date:"Start date",end_date:"End date",allServices:"All services",
  hoursEdited:"manual",shift:"Day/Night",light:"☀️ Light",dark:"🌙 Dark",lang:"中文"}
};
const pref = (k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const setPref = (k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const S = {
  lang: pref("lang","zh"), theme: pref("theme","dark"), company: pref("company","ETK"),
  tab:"do", sub:"customers", month:new Date().toISOString().slice(0,7),
  user:null, live:false,
  d:{customers:[],vehicles:[],rates:[],customer_surcharges:[],delivery_orders:[]},
  doForm:null, mEdit:null
};
const t = k => T[S.lang][k] ?? k;
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n==null||n==="")?"":Number(n).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const $ = s => document.querySelector(s);
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}
document.documentElement.dataset.theme = S.theme;

/* ========= 时间 / 计算 ========= */
function normTime(v){ // "2100" -> "21:00", "930" -> "09:30"
  v=String(v||"").trim(); if(!v) return "";
  const m=v.replace(/[^\d]/g,""); if(v.includes(":")){const [h,mm="0"]=v.split(":");return pad(h)+":"+pad(mm)}
  if(m.length<=2) return pad(m)+":00";
  return pad(m.slice(0,-2))+":"+m.slice(-2);
}
const pad = x => String(parseInt(x||0,10)).padStart(2,"0");
const mins = hhmm => { if(!hhmm) return null; const [h,m]=hhmm.split(":").map(Number); return h*60+m; };
function shiftOf(start){ const m=mins(start); if(m==null) return null; return (m>=17*60||m<8*60)?"Night":"Day"; }
function actualHours(s,e){ const a=mins(s),b=mins(e); if(a==null||b==null) return null; let d=b-a; if(d<=0) d+=1440; return r2(d/60); }
function billableHours(actual, rate){
  if(actual==null) return null;
  let h=actual;
  const after=Number(rate?.break_after_hours)||0, brk=Number(rate?.break_hours)||0, min=Number(rate?.min_hours)||0;
  if(after && brk && actual>after) h=Math.max(actual-brk, after);
  if(min) h=Math.max(h,min);
  return r2(h);
}
const inRange = (d,from,to) => d && from<=d && (!to || to>=d);
function findRate(cust, svc, date){
  return S.d.rates.filter(r=>r.customer_id===cust && r.service===svc && inRange(date,r.effective_from,r.effective_to))
    .sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0] || null;
}
function findSurcharge(cust, svc, date){
  const s=S.d.customer_surcharges.filter(x=>x.customer_id===cust && (!x.service||x.service===svc) && inRange(date,x.start_date,x.end_date))
    .sort((a,b)=>(b.service?1:0)-(a.service?1:0) || b.start_date.localeCompare(a.start_date))[0];
  return s ? Number(s.amount_per_do) : 0;
}
function autoDesc(f){
  if(f.service==="TMA" && f.shift) return `TMA Lorry ${f.shift} Work`;
  return f.service || "";
}
function recompute(f){
  f.shift = f.service==="TMA" ? shiftOf(f.start_time) : null;
  const rateSvc = f.service==="TMA" ? (f.shift?`TMA ${f.shift}`:null) : f.service;
  const rate = rateSvc ? findRate(f.customer_id, rateSvc, f.do_date) : null;
  f._rateRow = rate;
  f.actual_hours = actualHours(f.start_time, f.end_time);
  if(!f.hours_overridden) f.billable_hours = billableHours(f.actual_hours, rate);
  if(!f._rateTouched) f.rate = rate ? Number(rate.price) : (f.rate ?? null);
  if(!f._surTouched) f.surcharge = findSurcharge(f.customer_id, f.service, f.do_date);
  if(!f._descTouched) f.description = autoDesc(f);
  f.amount = (f.billable_hours!=null && f.rate!=null) ? r2(f.billable_hours*f.rate + (Number(f.surcharge)||0)) : null;
  return f;
}

/* ========= 资料 ========= */
async function loadMaster(){
  const co=S.company;
  const [c,v,r,s]=await Promise.all([
    sb.from("customers").select("*").eq("company",co).order("name"),
    sb.from("vehicles").select("*").eq("company",co).order("plate"),
    sb.from("rates").select("*").eq("company",co).order("effective_from",{ascending:false}),
    sb.from("customer_surcharges").select("*").eq("company",co).order("start_date",{ascending:false})
  ]);
  for(const x of [c,v,r,s]) if(x.error) return toast(x.error.message);
  S.d.customers=c.data; S.d.vehicles=v.data; S.d.rates=r.data; S.d.customer_surcharges=s.data;
}
async function loadDO(){
  const [y,m]=S.month.split("-").map(Number);
  const from=`${S.month}-01`, to=new Date(y,m,0).toISOString().slice(0,10);
  const {data,error}=await sb.from("delivery_orders").select("*").eq("company",S.company)
    .gte("do_date",from).lte("do_date",to).order("do_date").order("start_time");
  if(error) return toast(error.message);
  S.d.delivery_orders=data;
}
async function reload(){ await loadMaster(); await loadDO(); render(); }

let rt=null, rtTimer=null;
function startRealtime(){
  if(rt) sb.removeChannel(rt);
  rt=sb.channel("billing-sync")
    .on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(()=>{if(!S.doForm&&!S.mEdit)reload()},400)})
    .subscribe(st=>{S.live=(st==="SUBSCRIBED");const e=$(".sync");if(e){e.className="sync "+(S.live?"on":"off");e.lastChild.textContent=t(S.live?"synced":"offline")}});
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.user && !S.doForm && !S.mEdit) reload(); });

/* ========= 画面 ========= */
function render(){
  const app=$("#app");
  if(!S.user){ app.innerHTML=loginView(); return; }
  app.innerHTML = topView() + `<main>${S.tab==="do"?doView():masterView()}</main>`;
}
function loginView(){
  return `<div class="login"><form class="panel" onsubmit="doLogin(event)">
    <div class="brand" style="margin-bottom:14px"><span class="stripe"></span>ETK · L3H</div>
    <h1>${t("login")}</h1><p>${t("loginHint")}</p>
    <div style="display:grid;gap:12px">
      <label class="f">${t("email")}<input name="email" type="email" autocomplete="username" required></label>
      <label class="f">${t("password")}<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn">${t("login")}</button>
      <button type="button" class="ghost" onclick="toggleLang()">${t("lang")}</button>
    </div></form></div>`;
}
function topView(){
  return `<header class="top">
    <div class="brand"><span class="stripe"></span>${S.company} ${S.lang==="zh"?"开单系统":"Billing"}</div>
    <div class="seg">${["ETK","L3H"].map(c=>`<button class="${c===S.company?"on":""}" onclick="setCompany('${c}')">${c}</button>`).join("")}</div>
    <span class="sync ${S.live?"on":"off"}"><i></i>${t(S.live?"synced":"offline")}</span>
    <button class="ghost" onclick="toggleLang()">${t("lang")}</button>
    <button class="ghost" onclick="toggleTheme()">${S.theme==="dark"?t("light"):t("dark")}</button>
    <button class="ghost" onclick="logout()">${t("logout")}</button>
  </header>
  <nav class="tabs">
    <button class="${S.tab==="do"?"on":""}" onclick="setTab('do')">${t("tabDO")}</button>
    <button class="${S.tab==="master"?"on":""}" onclick="setTab('master')">${t("tabMaster")}</button>
  </nav>`;
}

/* ---- DO ---- */
function blankDO(){
  const last=S.d.delivery_orders.at(-1);
  return recompute({do_date:new Date().toISOString().slice(0,10), customer_id:last?.customer_id||"", project:last?.project||"",
    service:SERVICES[S.company][0], plate:"", do_no:"", customer_po:"", start_time:"", end_time:"",
    from_loc:"", to_loc:"", description:"", rate:null, surcharge:0, remark:"", hours_overridden:false});
}
function doView(){
  const f=S.doForm || (S.doForm=blankDO());
  const custOpts=`<option value=""></option>`+S.d.customers.map(c=>`<option value="${c.id}" ${c.id===f.customer_id?"selected":""}>${esc(c.name)}</option>`).join("");
  const svcOpts=SERVICES[S.company].map(s=>`<option ${s===f.service?"selected":""}>${s}</option>`).join("");
  const projects=[...new Set(S.d.delivery_orders.map(d=>d.project).filter(Boolean))];
  const noRate = f.customer_id && f.service && f.start_time && !f._rateRow && !f._rateTouched;
  return `<section class="panel">
    <h2>${f.id?t("editDO"):t("newDO")}</h2>
    <div class="grid" oninput="doInput(event)" onchange="doInput(event)">
      ${fld("do_date","date",f.do_date,"date")}
      <label class="f">${t("customer")}<select name="customer_id">${custOpts}</select></label>
      <label class="f">${t("project")}<input name="project" list="projList" value="${esc(f.project)}"><datalist id="projList">${projects.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></label>
      <label class="f">${t("service")}<select name="service">${svcOpts}</select></label>
      <label class="f">${t("plate")}<input name="plate" list="plateList" value="${esc(f.plate)}"><datalist id="plateList">${S.d.vehicles.map(v=>`<option value="${esc(v.plate)}">`).join("")}</datalist></label>
      ${fld("do_no","do_no",f.do_no)}
      ${fld("customer_po","customer_po",f.customer_po)}
      ${fld("start_time","start",f.start_time,"text",'inputmode="numeric" placeholder="2100"')}
      ${fld("end_time","end",f.end_time,"text",'inputmode="numeric" placeholder="0500"')}
      ${fld("from_loc","from",f.from_loc)}
      ${fld("to_loc","to",f.to_loc)}
      <label class="f wide">${t("description")}<input name="description" class="${f._descTouched?"":"auto"}" value="${esc(f.description)}"></label>
      ${fld("billable_hours","billable",f.billable_hours??"","number",'step="0.25" class="'+(f.hours_overridden?"":"auto")+'"')}
      ${fld("rate","rate",f.rate??"","number",'step="0.01" class="'+(f._rateTouched?"":"auto")+'"')}
      ${fld("surcharge","surcharge",f.surcharge??0,"number",'step="0.01" class="'+(f._surTouched?"":"auto")+'"')}
      ${fld("remark","remark",f.remark)}
    </div>
    <div class="calc" id="calc">${calcView(f)}</div>
    ${noRate?`<div class="warn">${t("noRate")}</div>`:""}
    <div class="warn" id="doWarn"></div>
    <div class="actions">
      <button class="btn" onclick="saveDO()">${t("save")}</button>
      <button class="btn sec" onclick="S.doForm=null;render()">${t("cancel")}</button>
      ${f.id?`<button class="btn del" onclick="delDO('${f.id}')">${t("del")}</button>`:""}
    </div>
  </section>
  ${doList()}`;
}
function fld(name,label,val,type="text",extra=""){
  return `<label class="f">${t(label)}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`;
}
function calcView(f){
  return `<div>${t("shift")}<b>${f.shift?`<span class="tag ${f.shift}">${f.shift}</span>`:"—"}</b></div>
    <div>${t("actual")}<b>${f.actual_hours??"—"}</b></div>
    <div>${t("billable")}<b>${f.billable_hours??"—"}${f.hours_overridden?` <small style="font-size:12px;color:var(--mute)">${t("hoursEdited")}</small>`:""}</b></div>
    <div class="total">${t("amount")}<b>${f.amount!=null?"$"+money(f.amount):"—"}</b></div>`;
}
function doInput(e){
  const el=e.target, f=S.doForm; if(!el.name) return;
  let v=el.value;
  if(el.name==="start_time"||el.name==="end_time"){ if(e.type!=="change"){f[el.name]=v.length>=3&&!v.includes(":")?normTime(v):v;} else {v=normTime(v);el.value=v;f[el.name]=v;} }
  else if(["billable_hours","rate","surcharge"].includes(el.name)){
    f[el.name]= v===""?null:Number(v);
    if(el.name==="billable_hours") f.hours_overridden = v!=="";
    if(el.name==="rate") f._rateTouched = v!=="";
    if(el.name==="surcharge") f._surTouched = true;
  }
  else { f[el.name]=v; if(el.name==="description") f._descTouched = v!==""; }
  recompute(f);
  // 只更新自动栏位，避免打字时跳光标
  const g=n=>document.querySelector(`.grid [name="${n}"]`);
  if(document.activeElement!==g("description")) g("description").value=f.description;
  if(document.activeElement!==g("billable_hours")) g("billable_hours").value=f.billable_hours??"";
  if(document.activeElement!==g("rate")) g("rate").value=f.rate??"";
  if(document.activeElement!==g("surcharge")) g("surcharge").value=f.surcharge??0;
  $("#calc").innerHTML=calcView(f);
  if(["customer_id","service","do_date"].includes(el.name) && e.type==="change") render();
}
async function saveDO(){
  const f=S.doForm, w=$("#doWarn");
  const miss=[["do_date","date"],["customer_id","customer"],["service","service"],["do_no","do_no"]].filter(([k])=>!f[k]).map(([,l])=>t(l));
  if(miss.length){ w.textContent=t("required")+miss.join(", "); return; }
  const dup=await sb.from("delivery_orders").select("id,do_date").eq("company",S.company).eq("do_no",f.do_no.trim());
  const other=(dup.data||[]).find(x=>x.id!==f.id);
  if(other){ w.textContent=t("dup").replace("{d}",other.do_date); return; }
  const row={company:S.company, do_date:f.do_date, customer_id:f.customer_id, project:f.project||null, service:f.service,
    shift:f.shift, plate:f.plate||null, do_no:f.do_no.trim(), customer_po:f.customer_po||null,
    start_time:f.start_time||null, end_time:f.end_time||null, from_loc:f.from_loc||null, to_loc:f.to_loc||null,
    description:f.description||null, actual_hours:f.actual_hours, billable_hours:f.billable_hours,
    hours_overridden:!!f.hours_overridden, rate:f.rate, surcharge:Number(f.surcharge)||0, amount:f.amount, remark:f.remark||null};
  const q = f.id ? sb.from("delivery_orders").update(row).eq("id",f.id) : sb.from("delivery_orders").insert(row);
  const {error}=await q;
  if(error){ w.textContent=error.message; return; }
  toast(t("saved"));
  // 保留客户 / project / service / 日期，方便连续输入
  const keep={do_date:f.do_date,customer_id:f.customer_id,project:f.project,service:f.service};
  S.doForm=null; await loadDO(); S.doForm=recompute({...blankDO(),...keep}); render();
  document.querySelector('.grid [name="do_no"]')?.focus();
}
async function delDO(id){
  if(!confirm(t("confirmDel"))) return;
  const {error}=await sb.from("delivery_orders").delete().eq("id",id);
  if(error) return toast(error.message);
  toast(t("deleted")); S.doForm=null; await loadDO(); render();
}
function editDO(id){
  const d=S.d.delivery_orders.find(x=>x.id===id); if(!d) return;
  S.doForm=recompute({...d, start_time:d.start_time?.slice(0,5)||"", end_time:d.end_time?.slice(0,5)||"",
    _rateTouched:true, _surTouched:true, _descTouched:true});
  render(); window.scrollTo({top:0,behavior:"smooth"});
}
function doList(){
  const rows=S.d.delivery_orders, cn=id=>S.d.customers.find(c=>c.id===id)?.name||"";
  const tot=rows.reduce((a,d)=>a+(Number(d.amount)||0),0), hrs=rows.reduce((a,d)=>a+(Number(d.billable_hours)||0),0);
  return `<section>
    <div class="filters"><label class="f">${t("month")}<input type="month" value="${S.month}" onchange="setMonth(this.value)"></label></div>
    ${rows.length?`<div class="tw"><table><thead><tr>
      <th>${t("date")}</th><th>${t("do_no")}</th><th>${t("customer")}</th><th>${t("project")}</th><th>${t("service")}</th>
      <th>${t("plate")}</th><th>${t("start")}</th><th>${t("end")}</th><th>${t("shift")}</th><th>${t("from")}</th><th>${t("to")}</th>
      <th class="num">${t("billable")}</th><th class="num">${t("rate")}</th><th class="num">${t("surcharge")}</th><th class="num">${t("amount")}</th>
    </tr></thead><tbody>
    ${rows.map(d=>`<tr class="click" onclick="editDO('${d.id}')">
      <td>${d.do_date}</td><td>${esc(d.do_no)}</td><td>${esc(cn(d.customer_id))}</td><td>${esc(d.project)}</td><td>${esc(d.service)}</td>
      <td>${esc(d.plate)}</td><td>${d.start_time?.slice(0,5)||""}</td><td>${d.end_time?.slice(0,5)||""}</td>
      <td>${d.shift?`<span class="tag ${d.shift}">${d.shift}</span>`:""}</td><td>${esc(d.from_loc)}</td><td>${esc(d.to_loc)}</td>
      <td class="num">${d.billable_hours??""}</td><td class="num">${money(d.rate)}</td><td class="num">${Number(d.surcharge)?money(d.surcharge):""}</td><td class="num">${money(d.amount)}</td>
    </tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="11">${t("total")} · ${rows.length} DO</td><td class="num">${r2(hrs)}</td><td></td><td></td><td class="num">$${money(tot)}</td></tr></tfoot>
    </table></div>`:`<div class="panel empty">${t("noDO")}</div>`}
  </section>`;
}

/* ---- Master List ---- */
const MASTER = {
  customers:{ fields:[["name","text",1],["payment_terms_days","number",1,30],["attention","text"],["email","email"],["whatsapp","text"],["address","textarea"],["remark","text"]],
              cols:["name","payment_terms_days","attention","email","whatsapp"] },
  vehicles:{ fields:[["plate","text",1],["vehicle_type","text"],["remark","text"]], cols:["plate","vehicle_type","remark"] },
  rates:{ fields:[["customer_id","customer",1],["service","rateService",1],["unit","text",0,"per hr"],["price","number",1],
                  ["effective_from","date",1],["effective_to","date"],["break_after_hours","number"],["break_hours","number"],["min_hours","number"],["remark","text"]],
          cols:["customer_id","service","price","unit","effective_from","effective_to","break_after_hours","break_hours","min_hours"] },
  customer_surcharges:{ fields:[["customer_id","customer",1],["service","serviceOpt"],["amount_per_do","number",1],["start_date","date",1],["end_date","date"],["remark","text"]],
          cols:["customer_id","service","amount_per_do","start_date","end_date","remark"] }
};
const LABEL = {plate:"plate",service:"service",customer_id:"customer",price:"price",remark:"remark"};
function masterView(){
  const cfg=MASTER[S.sub], rows=S.d[S.sub], e=S.mEdit;
  const tabs=Object.keys(MASTER).map(k=>`<button class="${k===S.sub?"on":""}" onclick="S.sub='${k}';S.mEdit=null;render()">${t(k)}</button>`).join("");
  return `<div class="sub">${tabs}</div>
    ${e?masterForm(cfg,e):`<div class="actions" style="margin:0 0 12px"><button class="btn" onclick="S.mEdit={};render()">${t("add")}</button></div>`}
    ${rows.length?`<div class="tw"><table><thead><tr>${cfg.cols.map(c=>`<th class="${isNum(c)?"num":""}">${t(LABEL[c]||c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr class="click" onclick="mEdit('${r.id}')">${cfg.cols.map(c=>`<td class="${isNum(c)?"num":""}">${cell(c,r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    :`<div class="panel empty">${t("empty")}</div>`}`;
}
const isNum = c => ["price","amount_per_do","payment_terms_days","break_after_hours","break_hours","min_hours"].includes(c);
function cell(c,v){
  if(c==="customer_id") return esc(S.d.customers.find(x=>x.id===v)?.name||"");
  if(c==="service" && S.sub==="customer_surcharges" && !v) return t("allServices");
  if(["price","amount_per_do"].includes(c)) return money(v);
  return esc(v);
}
function masterForm(cfg,e){
  const inp=([k,type,req,def])=>{
    const v=e[k]??def??"", lab=t(LABEL[k]||k)+(req?" *":"");
    if(type==="customer") return `<label class="f">${lab}<select name="${k}"><option value=""></option>${S.d.customers.map(c=>`<option value="${c.id}" ${c.id===v?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>`;
    if(type==="rateService") return `<label class="f">${lab}<select name="${k}">${RATE_SERVICES[S.company].map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("")}</select></label>`;
    if(type==="serviceOpt") return `<label class="f">${lab}<select name="${k}"><option value="">${t("allServices")}</option>${SERVICES[S.company].map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("")}</select></label>`;
    if(type==="textarea") return `<label class="f wide">${lab}<textarea name="${k}">${esc(v)}</textarea></label>`;
    return `<label class="f">${lab}<input name="${k}" type="${type}" ${type==="number"?'step="0.01"':""} value="${esc(v)}"></label>`;
  };
  return `<section class="panel"><h2>${e.id?t("edit"):t("add")} · ${t(S.sub)}</h2>
    <form id="mForm" class="grid" onsubmit="event.preventDefault();saveMaster()">${cfg.fields.map(inp).join("")}</form>
    <div class="warn" id="mWarn"></div>
    <div class="actions"><button class="btn" onclick="saveMaster()">${t("save")}</button>
    <button class="btn sec" onclick="S.mEdit=null;render()">${t("cancel")}</button>
    ${e.id?`<button class="btn del" onclick="delMaster('${e.id}')">${t("del")}</button>`:""}</div></section>`;
}
function mEdit(id){ S.mEdit={...S.d[S.sub].find(r=>r.id===id)}; render(); window.scrollTo({top:0,behavior:"smooth"}); }
async function saveMaster(){
  const cfg=MASTER[S.sub], fd=new FormData($("#mForm")), row={company:S.company};
  const miss=[];
  for(const [k,type,req] of cfg.fields){
    let v=fd.get(k); v=(v===""||v==null)?null:(type==="number"?Number(v):v);
    if(req && v==null) miss.push(t(LABEL[k]||k));
    row[k]=v;
  }
  if(miss.length){ $("#mWarn").textContent=t("required")+miss.join(", "); return; }
  const q=S.mEdit.id? sb.from(S.sub).update(row).eq("id",S.mEdit.id) : sb.from(S.sub).insert(row);
  const {error}=await q; if(error){ $("#mWarn").textContent=error.message; return; }
  toast(t("saved")); S.mEdit=null; await loadMaster(); render();
}
async function delMaster(id){
  if(!confirm(t("confirmDel"))) return;
  const {error}=await sb.from(S.sub).delete().eq("id",id);
  if(error) return toast(error.message);
  toast(t("deleted")); S.mEdit=null; await loadMaster(); render();
}

/* ========= 动作 ========= */
async function doLogin(e){
  e.preventDefault(); const fd=new FormData(e.target);
  const {error}=await sb.auth.signInWithPassword({email:fd.get("email"),password:fd.get("password")});
  if(error) toast(error.message);
}
async function logout(){ await sb.auth.signOut(); }
function setTab(x){ S.tab=x; S.mEdit=null; render(); }
async function setCompany(c){ S.company=c; setPref("company",c); S.doForm=null; S.mEdit=null; await reload(); }
async function setMonth(m){ S.month=m; await loadDO(); render(); }
function toggleLang(){ S.lang=S.lang==="zh"?"en":"zh"; setPref("lang",S.lang); document.documentElement.lang=S.lang; render(); }
function toggleTheme(){ S.theme=S.theme==="dark"?"light":"dark"; setPref("theme",S.theme); document.documentElement.dataset.theme=S.theme; render(); }

sb.auth.onAuthStateChange(async (_ev, session)=>{
  const was=S.user?.id; S.user=session?.user||null;
  if(S.user && S.user.id!==was){ await reload(); startRealtime(); }
  if(!S.user){ if(rt) sb.removeChannel(rt); render(); }
});
render();
</script>
