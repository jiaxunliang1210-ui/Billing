/* ================= 计算 ================= */
function normTime(v){v=String(v||"").trim();if(!v)return"";if(v.includes(":")){const[h,m="0"]=v.split(":");return z2(parseInt(h||0,10))+":"+z2(parseInt(m||0,10))}
  const n=v.replace(/\D/g,"");if(n.length<=2)return z2(parseInt(n,10))+":00";return z2(parseInt(n.slice(0,-2),10))+":"+n.slice(-2)}
const mins=h=>{if(!h)return null;const[a,b]=h.split(":").map(Number);return a*60+b};
const shiftOf=s=>{const m=mins(s);if(m==null)return null;return(m>=17*60||m<8*60)?"Night":"Day"};
function actualHours(s,e){const a=mins(s),b=mins(e);if(a==null||b==null)return null;let d=b-a;if(d<=0)d+=1440;return r2(d/60)}
function billableHours(actual,rate){if(actual==null)return null;let h=actual;
  const after=Number(rate?.break_after_hours)||0,brk=Number(rate?.break_hours)||0,min=Number(rate?.min_hours)||0;
  if(after&&brk&&actual>after)h=Math.max(actual-brk,after);if(min)h=Math.max(h,min);return r2(h)}
function findRate(c,svc,date){return S.d.rates.filter(r=>r.customer_id===c&&r.service===svc&&inRange(date,r.effective_from,r.effective_to))
  .sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0]||null}
function findSurcharge(c,svc,date){const s=S.d.customer_surcharges.filter(x=>x.customer_id===c&&(!x.service||x.service===svc)&&inRange(date,x.start_date,x.end_date))
  .sort((a,b)=>(b.service?1:0)-(a.service?1:0)||b.start_date.localeCompare(a.start_date))[0];return s?Number(s.amount_per_do):0}
const isDayRate=r=>!!r&&/8\s*hrs?|day|天/i.test(r.unit||"");
const baseHrsOf=r=>Number(r?.min_hours)||8;
function recompute(f){
  f.shift=f.service==="TMA"?shiftOf(f.start_time):null;
  const rs=f.service==="TMA"?(f.shift?`TMA ${f.shift}`:null):f.service;
  const rate=rs?findRate(f.customer_id,rs,f.do_date):null; f._rateRow=rate;
  f.actual_hours=actualHours(f.start_time,f.end_time);
  if(!f.hours_overridden)f.billable_hours=billableHours(f.actual_hours,rate);
  if(!f._rateTouched)f.rate=rate?Number(rate.price):null;
  if(!f._surTouched)f.surcharge=findSurcharge(f.customer_id,f.service,f.do_date);
  if(!f._descTouched)f.description=f.service==="TMA"&&f.shift?`TMA Lorry ${f.shift} Work`:(f.service||"");
  if(isDayRate(rate)){const base=baseHrsOf(rate),ot=f.billable_hours!=null?r2(Math.max(0,f.billable_hours-base)):null;
    f._otHours=ot;f._otRate=Number(rate.ot_rate)||0;
    f.amount=(f.billable_hours!=null&&f.rate!=null)?r2(Number(f.rate)+ot*f._otRate+(Number(f.surcharge)||0)):null}
  else{f._otHours=null;f._otRate=null;
    f.amount=(f.billable_hours!=null&&f.rate!=null)?r2(f.billable_hours*f.rate+(Number(f.surcharge)||0)):null}
  return f;
}
const paidOf=inv=>sum(S.d.payment_allocations.filter(a=>a.invoice_id===inv.id),a=>a.amount);
const balOf=inv=>inv.status==="Cancelled"?0:r2(Number(inv.total)-paidOf(inv));
function statusOf(inv){if(inv.status==="Cancelled")return"Cancelled";const p=paidOf(inv),t=Number(inv.total);
  if(t>0&&p>=t-0.005)return"Paid";return p>0?"Partial":"Unpaid"}
function overdueDays(inv,asOf=today()){if(!inv.due_date||balOf(inv)<=0.005)return 0;return Math.max(0,daysBetween(inv.due_date,asOf))}
function interestOf(inv,asOf=today()){if(!inv.interest_enabled)return 0;const d=overdueDays(inv,asOf);return d?r2(balOf(inv)*0.015*d/30):0}
function lastPayDate(inv){const ids=S.d.payment_allocations.filter(a=>a.invoice_id===inv.id).map(a=>a.payment_id);
  return S.d.payments.filter(p=>ids.includes(p.id)).map(p=>p.payment_date).sort().at(-1)||""}
function statusTag(inv){const s=statusOf(inv);if(s!=="Paid"&&s!=="Cancelled"&&overdueDays(inv)>0)return `<span class="tag Overdue">${L("逾期","Overdue")} ${overdueDays(inv)}${L("天","d")}</span>`;
  const lab={Paid:L("已付","Paid"),Partial:L("部分付款","Partial"),Unpaid:L("未付","Unpaid"),Cancelled:L("取消","Cancelled")}[s];return `<span class="tag ${s}">${lab}</span>`}
function nextInvNo(date){const s=settingsOf(S.company);const[y,m]=date.split("-");const base=`${s.inv_prefix||""}${y.slice(2)}${m}/`;let max=0;
  for(const i of S.d.invoices)if(i.invoice_no.startsWith(base)){const n=parseInt(i.invoice_no.slice(base.length),10);if(n>max)max=n}
  return base+z2(max+1)}
function apStatus(si){if(si.payment_date)return `<span class="tag ok">${L("已付","Paid")}</span>`;
  if(si.due_date&&si.due_date<today())return `<span class="tag bad">${L("逾期","Overdue")}</span>`;return `<span class="tag mute">${L("未付","Unpaid")}</span>`}
function surchargeCheck(si){
  const act=S.d.diesel_surcharges.filter(d=>d.supplier_id===si.supplier_id&&inRange(si.invoice_date,d.start_date,d.end_date)).sort((a,b)=>b.start_date.localeCompare(a.start_date))[0];
  const ch=Number(si.surcharge_charged)||0;
  if(!act)return ch>0?{ok:false,t:L(`不在收费期间，却收了 $${money(ch)}`,`Charged $${money(ch)} outside surcharge period`)}:{ok:true,t:"—"};
  if(si.trips==null)return ch>0?{ok:false,t:L("请填趟数来核对","Enter trips to check")}:{ok:true,t:"—"};
  const exp=r2(si.trips*act.amount_per_trip);
  return Math.abs(exp-ch)<0.01?{ok:true,t:`✓ $${money(exp)}`}:{ok:false,t:L(`应该 $${money(exp)}，收了 $${money(ch)}`,`Expected $${money(exp)}, charged $${money(ch)}`)};
}

async function fetchAll(build){let out=[],i=0;for(;;){const{data,error}=await build().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;i+=1000}return out}
async function loadAll(){
  const co=S.company,q=(t,f)=>fetchAll(()=>{const b=sb.from(t).select("*");return f?f(b):b});
  try{
    const r=await Promise.all([
      q("customers",b=>b.eq("company",co).order("name")),q("vehicles",b=>b.eq("company",co).order("plate")),
      q("rates",b=>b.eq("company",co).order("effective_from",{ascending:false})),
      q("customer_surcharges",b=>b.eq("company",co).order("start_date",{ascending:false})),
      q("invoices",b=>b.eq("company",co).order("invoice_date").order("invoice_no")),q("invoice_lines",b=>b.order("line_no")),
      q("payments",b=>b.eq("company",co).order("payment_date",{ascending:false})),q("payment_allocations"),
      q("reminders",b=>b.order("sent_at",{ascending:false})),q("soa_sends",b=>b.eq("company",co).order("sent_at",{ascending:false})),
      q("monthly_fix",b=>b.eq("company",co).order("created_at")),q("monthly_fix_log"),q("suppliers",b=>b.order("name")),
      q("supplier_invoices",b=>b.order("invoice_date",{ascending:false})),q("diesel_surcharges",b=>b.order("start_date",{ascending:false})),
      q("attachments",b=>b.order("created_at")),q("company_settings")]);
    ["customers","vehicles","rates","customer_surcharges","invoices","invoice_lines","payments","payment_allocations","reminders","soa_sends",
     "monthly_fix","monthly_fix_log","suppliers","supplier_invoices","diesel_surcharges","attachments","company_settings"].forEach((k,i)=>S.d[k]=r[i]);
    await loadDO(); S.lastSync=new Date();
  }catch(e){toast(e.message)}
}
async function loadDO(){const from=`${S.month}-01`,to=lastDayOf(S.month);
  S.d.delivery_orders=await fetchAll(()=>sb.from("delivery_orders").select("*").eq("company",S.company).gte("do_date",from).lte("do_date",to).order("do_date").order("start_time"))}

function startRealtime(){if(rt)sb.removeChannel(rt);
  rt=sb.channel("billing-sync").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(()=>{if(busy())S.pending=true;else reload()},500)})
    .subscribe(st=>{S.live=st==="SUBSCRIBED";updSync()})}
function updSync(){const e=$(".sync");if(!e)return;e.className="sync "+(S.live?"on":"off");
  e.querySelector("span").textContent=S.live?`${L("已同步","Synced")} ${S.lastSync?z2(S.lastSync.getHours())+":"+z2(S.lastSync.getMinutes()):""}`:L("未连线","Offline")}

  <h1>${L("登录","Log in")}</h1><p>${L("用 Supabase 建立的账号登录","Use the account you created in Supabase")}</p>
  <div style="display:grid;gap:12px"><label class="f">Email<input name="email" type="email" autocomplete="username" required></label>

  <button class="btn">${L("登录","Log in")}</button><button type="button" class="ghost" onclick="toggleLang()">${L("EN","中文")}</button></div></form></div>`}
function fld(name,label,val,type="text",extra="",cls=""){return `<label class="f ${cls}">${label}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`}
const optList=(items,val,blank)=>(blank!=null?`<option value="">${blank}</option>`:"")+items.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val??"")?"selected":""}>${esc(t)}</option>`).join("");
const custOpts=val=>optList(S.d.customers.map(c=>[c.id,c.name]),val,"");

  return recompute({do_date:today(),customer_id:last?.customer_id||"",project:last?.project||"",service:SERVICES[S.company][0],plate:"",do_no:"",customer_po:"",
    start_time:"",end_time:"",from_loc:"",to_loc:"",description:"",rate:null,surcharge:0,remark:"",hours_overridden:false})}

  ${billed?`<div class="note">${L(`这张 DO 已开在 invoice ${esc(billed.invoice_no)}，改金额后要到 Invoice 重新生成明细。`,`Billed on ${esc(billed.invoice_no)}. Rebuild the invoice lines after changing amounts.`)}</div>`:""}

const noRateMsg=f=>(f.customer_id&&f.service&&(f.service!=="TMA"||f.start_time)&&!f._rateRow&&!f._rateTouched)?L("找不到这个客户 / service 在这个日期的价钱，请先到 Master List → 价钱 设定。","No rate for this customer / service on this date. Set it in Master List → Rates."):"";
function calcView(f){return `<div>Day/Night<b>${f.shift?`<span class="tag ${f.shift}">${f.shift}</span>`:"—"}</b></div>
  <div>${L("实际小时","Actual hrs")}<b>${f.actual_hours??"—"}</b></div>
  <div>${L("计费小时","Billable hrs")}<b>${f.billable_hours??"—"}${f.hours_overridden?` <small class="mute" style="font-size:12px">${L("手动","manual")}</small>`:""}</b></div>
  ${f._otHours!=null?`<div>OT<b>${f._otHours} hr × $${money(f._otRate)}</b></div>`:""}
  <div class="total">${L("金额","Amount")}<b>${f.amount!=null?"$"+money(f.amount):"—"}</b></div>`}
function doInput(e){
  const el=e.target,f=S.doForm;if(!el.name)return;S.dirty=true;let v=el.value;
  if(el.name==="start_time"||el.name==="end_time"){if(e.type==="change"){v=normTime(v);el.value=v}f[el.name]=v.length>=3&&!v.includes(":")?normTime(v):v}
  else if(["billable_hours","rate","surcharge"].includes(el.name)){f[el.name]=v===""?null:Number(v);
    if(el.name==="billable_hours")f.hours_overridden=v!=="";if(el.name==="rate")f._rateTouched=v!=="";if(el.name==="surcharge")f._surTouched=true}
  else{f[el.name]=v;if(el.name==="description")f._descTouched=v!==""}
  recompute(f);
  const g=n=>document.querySelector(`.grid [name="${n}"]`);
  for(const[n,val,touched]of[["description",f.description,f._descTouched],["billable_hours",f.billable_hours??"",f.hours_overridden],["rate",f.rate??"",f._rateTouched],["surcharge",f.surcharge??0,f._surTouched]]){
    const x=g(n);if(document.activeElement!==x)x.value=val;x.classList.toggle("auto",!touched)}
  $("#calc").innerHTML=calcView(f);$("#noRate").textContent=noRateMsg(f);
}
async function saveDO(){
  const f=S.doForm,w=$("#doWarn");
  const miss=[["do_date",L("日期","Date")],["customer_id",L("客户","Customer")],["service","Service"],["do_no",L("DO 号码","DO No")]].filter(([k])=>!f[k]).map(([,l])=>l);
  if(miss.length){w.textContent=L("请填写：","Please fill in: ")+miss.join(", ");return}
  const dup=await sb.from("delivery_orders").select("id,do_date").eq("company",S.company).eq("do_no",f.do_no.trim());
  const other=(dup.data||[]).find(x=>x.id!==f.id);
  if(other){w.textContent=L(`DO 号码已存在（日期 ${dmy(other.do_date)}），不能重复。`,`DO number already exists (dated ${dmy(other.do_date)}).`);return}
  const row={company:S.company,do_date:f.do_date,customer_id:f.customer_id,project:f.project||null,service:f.service,shift:f.shift,plate:f.plate||null,
    do_no:f.do_no.trim(),customer_po:f.customer_po||null,start_time:f.start_time||null,end_time:f.end_time||null,from_loc:f.from_loc||null,to_loc:f.to_loc||null,
    description:f.description||null,actual_hours:f.actual_hours,billable_hours:f.billable_hours,hours_overridden:!!f.hours_overridden,rate:f.rate,
    surcharge:Number(f.surcharge)||0,amount:f.amount,remark:f.remark||null};
  const{error}=f.id?await sb.from("delivery_orders").update(row).eq("id",f.id):await sb.from("delivery_orders").insert(row);
  if(error){w.textContent=error.message;return}
  toast(L("已保存到云端","Saved to cloud"));
  const keep={do_date:f.do_date,customer_id:f.customer_id,project:f.project,service:f.service};
  S.doForm=null;done();await loadDO();S.lastSync=new Date();S.doForm=recompute({...blankDO(),...keep});render();
  document.querySelector('.grid [name="do_no"]')?.focus();
}

function doList(){
  const rows=S.d.delivery_orders.filter(d=>!S.unbilledOnly||!d.invoice_id);
  return `<section><div class="filters"><label class="f">${L("月份","Month")}<input type="month" value="${S.month}" onchange="setMonth(this.value)"></label>

/* ================= SOA ================= */
function soaData(cid,asOf){
  const rows=S.d.invoices.filter(i=>i.customer_id===cid&&i.status!=="Cancelled"&&i.invoice_date<=asOf&&balOf(i)>0.005).sort((a,b)=>a.invoice_date.localeCompare(b.invoice_date));
  const ag={cur:0,d30:0,d60:0,d90:0,over:0};
  for(const i of rows){const d=overdueDays(i,asOf),b=balOf(i);if(!d)ag.cur+=b;else if(d<=30)ag.d30+=b;else if(d<=60)ag.d60+=b;else if(d<=90)ag.d90+=b;else ag.over+=b}
  for(const k in ag)ag[k]=r2(ag[k]);
  const credit=r2(S.d.payments.filter(p=>p.customer_id===cid).reduce((s,p)=>s+Number(p.amount)-sum(S.d.payment_allocations.filter(a=>a.payment_id===p.id),a=>a.amount),0));
  const bal=sum(rows,balOf),intr=sum(rows,i=>interestOf(i,asOf));
  return{rows,ag,credit,bal,intr,total:r2(bal+intr-credit)};
}

function genView(keys,sk){

  const head=c=>SPECIAL[c]?L(...SPECIAL[c]):L(...cfg.fields.find(f=>f.k===c).label);
  const isNum=c=>["money","number","terms"].includes(cfg.fields.find(f=>f.k===c)?.type);
  return tabs+(cfg.note?`<p class="mute" style="font-size:13px">${L(...cfg.note)}</p>`:"")+
    (e?genForm(ent,cfg,e,sk):`<div class="actions" style="margin:0 0 12px"><button class="btn" onclick="S.gEdit={};S.dirty=true;render()">${L("新增","Add")}</button><button class="btn sec" onclick="exportEnt('${ent}')">⬇ Excel</button></div>`)+
    (rows.length?`<div class="tw"><table><thead><tr>${cfg.cols.map(c=>`<th class="${isNum(c)?"num":""}">${head(c)}</th>`).join("")}</tr></thead><tbody>

function genCell(cfg,c,r){
  if(c==="_apstatus")return apStatus(r);
  if(c==="_check"){const x=surchargeCheck(r);return x.ok?esc(x.t):`<span class="tag bad">${esc(x.t)}</span>`}
  if(c==="_att"){const n=S.d.attachments.filter(a=>a.entity_id===r.id).length;return n?`📎 ${n}`:""}
  const f=cfg.fields.find(x=>x.k===c),v=r[c];
  switch(f.type){case"customer":return esc(custName(v));case"supplier":return esc(supName(v));case"terms":return esc(termLabel(v));case"money":return money(v);
    case"bool":return v?`<span class="tag ok">${L("是","Yes")}</span>`:`<span class="tag mute">${L("停止","Stopped")}</span>`;case"month":return esc((v||"").slice(0,7));
    case"date":return dmy(v);case"serviceOpt":return v?esc(v):L("所有 service","All services");default:return esc(v)}
}
function genInput(f,v){const lab=L(...f.label)+(f.req?" *":"");v=v??f.def??"";
  switch(f.type){
    case"customer":return `<label class="f">${lab}<select name="${f.k}">${custOpts(v)}</select></label>`;
    case"supplier":return `<label class="f">${lab}<select name="${f.k}">${optList(S.d.suppliers.map(s=>[s.id,s.name]),v,"")}</select></label>`;
    case"rateService":return `<label class="f">${lab}<select name="${f.k}">${optList(RATE_SERVICES[S.company].map(s=>[s,s]),v)}</select></label>`;
    case"serviceOpt":return `<label class="f">${lab}<select name="${f.k}">${optList(SERVICES[S.company].map(s=>[s,s]),v,L("所有 service","All services"))}</select></label>`;
    case"rateUnit":return `<label class="f">${lab}<select name="${f.k}">${optList([["per hr",L("按小时（per hr）","per hr")],["per 8 hrs",L("8 小时一个价 + OT（per 8 hrs）","per 8 hrs + OT")]],v)}</select></label>`;
    case"terms":return `<label class="f">${lab}<select name="${f.k}">${optList(TERMS.map(d=>[d,termLabel(d)]),v)}</select></label>`;
    case"chargedTo":return `<label class="f">${lab}<input name="${f.k}" list="chargedList" value="${esc(v)}"><datalist id="chargedList"><option value="CHC"><option value="ETK"><option value="L3H"></datalist></label>`;
    case"bool":return `<label class="f">${lab}<select name="${f.k}">${optList([["true",L("是","Yes")],["false",L("停止","Stopped")]],String(v))}</select></label>`;
    case"month":return `<label class="f">${lab}<input type="month" name="${f.k}" value="${esc(String(v).slice(0,7))}"></label>`;
    case"textarea":return `<label class="f wide">${lab}<textarea name="${f.k}">${esc(v)}</textarea></label>`;
    case"money":case"number":return `<label class="f">${lab}<input type="number" step="0.01" name="${f.k}" value="${esc(v)}"></label>`;
    default:return `<label class="f">${lab}<input type="${f.type}" name="${f.k}" value="${esc(v)}"></label>`}}
function genForm(ent,cfg,e,sk){
  return `<section class="panel"><h2>${e.id?L("修改","Edit"):L("新增","Add")} · ${L(...cfg.label)}</h2>
  <form id="gForm" class="grid" oninput="S.dirty=true" onsubmit="event.preventDefault();saveGen('${ent}')">${cfg.fields.map(f=>genInput(f,e[f.k])).join("")}</form>
  ${ent==="supplier_invoices"&&e.id?`<p>${L("Surcharge 检查","Surcharge check")}：${genCell(cfg,"_check",e)}</p>`:""}
  ${cfg.att&&e.id?attBox(ent,e.id,cfg.att):cfg.att?`<p class="mute">${L("保存后可以上传附件。","Upload attachments after saving.")}</p>`:""}
  <div class="warn" id="gWarn"></div>
  <div class="actions"><button class="btn" onclick="saveGen('${ent}')">${L("保存","Save")}</button><button class="btn sec" onclick="done();render()">${L("取消","Cancel")}</button>
  ${e.id&&!cfg.noDelete?`<button class="btn del" onclick="delGen('${ent}','${e.id}')">${L("删除","Delete")}</button>`:""}</div></section>`}
function gEdit(ent,id){S.gEdit={...S.d[ent].find(r=>r.id===id)};S.dirty=true;render();window.scrollTo({top:0,behavior:"smooth"})}
async function saveGen(ent){const cfg=ENT[ent],fd=new FormData($("#gForm")),row={},miss=[];if(cfg.scoped)row.company=S.company;
  for(const f of cfg.fields){let v=fd.get(f.k);if(v===""||v==null)v=null;else if(["number","money","terms"].includes(f.type))v=Number(v);else if(f.type==="bool")v=v==="true";else if(f.type==="month")v=v+"-01";
    row[f.k]=v;if(f.req&&v==null)miss.push(L(...f.label))}
  if(miss.length)return $("#gWarn").textContent=L("请填写：","Please fill in: ")+miss.join(", ");
  const err=cfg.before?.(row,S.gEdit);if(typeof err==="string")return $("#gWarn").textContent=err;
  const wasNew=!S.gEdit.id;
  const{data,error}=S.gEdit.id?await sb.from(ent).update(row).eq("id",S.gEdit.id).select().single():await sb.from(ent).insert(row).select().single();
  if(error)return $("#gWarn").textContent=error.message;
  toast(L("已保存","Saved"));await loadAll();
  if(wasNew&&cfg.att){S.gEdit={...data};S.dirty=true;toast(L("已保存，现在可以上传附件","Saved. You can upload attachments now."))}else done();render()}
async function delGen(ent,id){if(!confirm(L("确定删除？","Delete this record?")))return;const{error}=await sb.from(ent).delete().eq("id",id);
  if(error)return toast(error.message.includes("foreign key")?L("还有其他资料在用这笔，不能删除。","Other records still use this; can't delete."):error.message);
  toast(L("已删除","Deleted"));done();await loadAll();render()}

  ${list.length?`<ul>${list.map(a=>`<li><a href="#" onclick="openAtt('${a.id}');return false">${esc(a.kind||"")} · ${esc(a.file_name||"")}</a> <button class="x" onclick="delAtt('${a.id}')" title="Delete">✕</button></li>`).join("")}</ul>`:`<p class="mute">${L("还没有附件","No files yet")}</p>`}

  <label class="btn sec sm file">📎 ${L("上传文件","Upload file")}<input type="file" hidden onchange="upAtt('${type}','${id}',this)"></label></div></div>`}
async function upAtt(type,id,input){const file=input.files[0];if(!file)return;const kind=$(`#attKind-${id}`).value,safe=file.name.replace(/[^\w.\-]+/g,"_");
  const path=`${S.user.id}/${type}/${id}/${Date.now()}_${safe}`;toast(L("上传中…","Uploading…"));
  const up=await sb.storage.from("attachments").upload(path,file);if(up.error)return toast(up.error.message);
  const{data,error}=await sb.from("attachments").insert({entity_type:type,entity_id:id,kind,file_path:path,file_name:file.name}).select().single();if(error)return toast(error.message);
  S.d.attachments.push(data);toast(L("已上传","Uploaded"));render()}
async function openAtt(aid){const a=S.d.attachments.find(x=>x.id===aid),w=window.open("","_blank");
  const{data,error}=await sb.storage.from("attachments").createSignedUrl(a.file_path,600);if(error){w?.close();return toast(error.message)}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
async function delAtt(aid){if(!confirm(L("确定删除这个附件？","Delete this file?")))return;const a=S.d.attachments.find(x=>x.id===aid);
  await sb.storage.from("attachments").remove([a.file_path]);const{error}=await sb.from("attachments").delete().eq("id",aid);if(error)return toast(error.message);
  S.d.attachments=S.d.attachments.filter(x=>x.id!==aid);render()}

function toYMD(v){if(v==null||v==="")return null;if(v instanceof Date)return ymd(new Date(v.getTime()+60000));const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${z2(m[2])}-${z2(m[3])}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${z2(m[2])}-${z2(m[1])}`}return null}
const numOr=(v,d=null)=>{if(v===""||v==null)return d;const n=Number(String(v).replace(/[$,\s]/g,""));return isNaN(n)?d:n};
const termOr=v=>{const t=String(v??"").trim().toUpperCase();if(!t)return 30;if(t.includes("COD")||t.includes("CASH"))return 0;const n=parseInt(t.replace(/\D/g,""),10);return isNaN(n)?30:n};
async function importExcel(input){const file=input.files[0];if(!file)return;input.value="";
  try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}).slice(1).filter(r=>r.some(v=>String(v).trim()!=="")):[];
    const co=S.company,rep=[];
    const cRows=rows("Customers"),have=new Set(S.d.customers.map(c=>c.name.trim().toLowerCase()));

    if(cIns.length){const{error}=await sb.from("customers").insert(cIns);if(error)throw error}rep.push(`${L("客户","Customers")}: +${cIns.length} (${L("跳过","skipped")} ${cRows.length-cIns.length})`);
    const vRows=rows("Vehicles"),hv=new Set(S.d.vehicles.map(v=>v.plate.toUpperCase()));
    const vIns=vRows.filter(r=>r[0]&&!hv.has(String(r[0]).trim().toUpperCase())).map(r=>({company:co,plate:String(r[0]).trim().toUpperCase(),vehicle_type:r[1]||null}));
    if(vIns.length){const{error}=await sb.from("vehicles").insert(vIns);if(error)throw error}rep.push(`${L("车牌","Vehicles")}: +${vIns.length}`);
    await loadAll();const cid=n=>S.d.customers.find(c=>c.name.trim().toLowerCase()===String(n||"").trim().toLowerCase());
    const rRows=rows("Rates"),bad=[];
    const rIns=rRows.map(r=>{const c=cid(r[0]);if(!c||!RATE_SERVICES[co].includes(String(r[1]).trim())||!toYMD(r[4])){bad.push(r[0]+" / "+r[1]);return null}
      return{company:co,customer_id:c.id,service:String(r[1]).trim(),unit:r[2]||"per hr",price:numOr(r[3],0),effective_from:toYMD(r[4]),effective_to:toYMD(r[5]),break_after_hours:numOr(r[6]),break_hours:numOr(r[7]),min_hours:numOr(r[8]),...(numOr(r[9])!=null?{ot_rate:numOr(r[9])}:{})}}).filter(Boolean);
    if(rIns.length){const{error}=await sb.from("rates").insert(rIns);if(error)throw error}rep.push(`${L("价钱","Rates")}: +${rIns.length}${bad.length?` (${L("有问题","problems")}: ${bad.join(", ")})`:""}`);
    const iRows=rows("Invoices"),hi=new Set(S.d.invoices.map(i=>i.invoice_no));let ni=0;const ibad=[];
    for(const r of iRows){const no=String(r[0]).trim(),c=cid(r[2]),d=toYMD(r[1]);if(!no||hi.has(no))continue;if(!c||!d){ibad.push(no);continue}
      const sub=numOr(r[5],0),gst=numOr(r[6],r2(sub*0.09)),tot=numOr(r[7],r2(sub+gst)),paid=numOr(r[8],0);
      const{data,error}=await sb.from("invoices").insert({company:co,customer_id:c.id,invoice_no:no,invoice_date:d,due_date:addDays(d,Number(c.payment_terms_days??30)),project:r[3]||null,
        description:r[4]||null,amount_before_gst:sub,gst_rate:9,gst_amount:gst,total:tot,customer_po:r[9]?String(r[9]):null,checked:true,sent_at:d,sent_via:"Imported",
        status:paid>=tot-0.005?"Paid":paid>0?"Partial":"Unpaid"}).select().single();if(error)throw error;
      await sb.from("invoice_lines").insert({invoice_id:data.id,line_no:1,description:r[4]||no,qty:1,unit:"LS",unit_price:sub,amount:sub});
      if(paid>0){const p=await sb.from("payments").insert({company:co,customer_id:c.id,payment_date:d,amount:paid,method:"Opening",reference:"Opening balance"}).select().single();
        if(!p.error)await sb.from("payment_allocations").insert({payment_id:p.data.id,invoice_id:data.id,amount:paid})}ni++}
    rep.push(`Invoices: +${ni}${ibad.length?` (${L("找不到客户或日期不对","bad customer/date")}: ${ibad.join(", ")})`:""}`);
    await loadAll();render();alert(L("导入完成\n\n","Import finished\n\n")+rep.join("\n"));

const BK_TABLES=["customers","vehicles","suppliers","company_settings","rates","customer_surcharges","diesel_surcharges","monthly_fix","invoices","delivery_orders",
  "invoice_lines","invoice_edits","payments","payment_allocations","reminders","soa_sends","monthly_fix_log","supplier_invoices","attachments"];
const backupAge=()=>{const d=pref("lastBackup","");return d?daysBetween(d,today()):null};
async function backupNow(){toast(L("备份中，请稍等…","Backing up…"));
  try{const wb=XLSX.utils.book_new(),counts=[];
    for(const t of BK_TABLES){const rows=await fetchAll(()=>sb.from(t).select("*"));counts.push([t,rows.length]);
      const cols=rows.length?Object.keys(rows[0]):["id"];
      const ws=XLSX.utils.json_to_sheet(rows.map(r=>Object.fromEntries(cols.map(k=>[k,r[k]==null?"":r[k]]))),{header:cols});
      XLSX.utils.book_append_sheet(wb,ws,t)}
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["ETK · L3H billing backup"],["Date",new Date().toLocaleString("en-SG")],["User",S.user.email],[],["Table","Rows"],...counts]),"_info");
    XLSX.writeFile(wb,`billing_backup_${today()}.xlsx`);setPref("lastBackup",today());render();
    toast(L("备份完成，文件已下载","Backup downloaded"))}catch(e){toast(L("备份失败：","Backup failed: ")+e.message)}}
async function restoreBackup(input){const file=input.files[0];input.value="";if(!file)return;
  if(!confirm(L("还原会把备份文件里的资料写回系统：\n· 同一笔资料会变回备份时的样子\n· 备份之后新增的资料会保留，不会被删掉\n\n确定继续？",
    "Restore writes the backup back into the system:\n· Records in the backup return to their backed-up state\n· Records added after the backup are kept\n\nContinue?")))return;
  try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:false});
    if(!wb.Sheets._info)throw new Error(L("这不是系统导出的备份文件","This is not a backup file from this system"));
    const rep=[];toast(L("还原中，请不要关闭网页…","Restoring, keep this page open…"));
    for(const t of BK_TABLES){const ws=wb.Sheets[t];if(!ws)continue;
      let rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}).map(r=>{const o={};for(const[k,v]of Object.entries(r)){if(k==="updated_at")continue;o[k]=v===""?null:v}o.user_id=S.user.id;return o});
      if(t==="company_settings")rows=rows.map(({id,...r})=>r);
      for(let i=0;i<rows.length;i+=500){const{error}=await sb.from(t).upsert(rows.slice(i,i+500),{onConflict:t==="company_settings"?"user_id,company":"id"});if(error)throw new Error(t+": "+error.message)}
      rep.push(`${t}: ${rows.length}`)}
    await reload();alert(L("还原完成\n\n","Restore finished\n\n")+rep.join("\n"))}catch(e){alert(L("还原失败：","Restore failed: ")+e.message);await reload()}}

let excelJSLoading=null;
function loadExcelJS(){if(window.ExcelJS)return Promise.resolve();
  return excelJSLoading||(excelJSLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload=res;sc.onerror=()=>{excelJSLoading=null;rej(new Error(L("Excel 工具载入失败，请检查网络","Could not load the Excel library")))};document.head.appendChild(sc)}))}
const XFILL={red:"FFF8D7D5",amber:"FFFFF0CC",green:"FFDFF2E7",head:"FF1F2A37",total:"FFE3E8EF"};
const xDate=s=>{const[y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const xv=(v,t)=>v==null||v===""?null:t==="date"?xDate(v):(t==="money"||t==="num")?Number(v):v;
const xDisp=(v,t)=>v==null||v===""?"":t==="money"?money(v):t==="date"?dmy(String(v).slice(0,10)):String(v);
const xLen=str=>[...String(str)].reduce((n,ch)=>n+(ch.charCodeAt(0)>255?2:1),0);
const solid=c=>({type:"pattern",pattern:"solid",fgColor:{argb:XFILL[c]}});
const termEN=d=>(d==null||d==="")?"":Number(d)===0?"COD":`${d} days`;
async function exportXlsx(filename,sheets){
  try{toast(L("正在准备 Excel…","Preparing Excel…"));await loadExcelJS();const wb=new ExcelJS.Workbook();wb.creator="ETK · L3H Billing";
    for(const sh of sheets){const ws=wb.addWorksheet(sh.name.slice(0,31));let r=1;
      for(const[a,b]of sh.info||[]){const row=ws.getRow(r++);row.getCell(1).value=a;row.getCell(1).font={bold:true};if(b!=null)row.getCell(2).value=b}
      if(sh.info?.length)r++;
      const head=r++,hr=ws.getRow(head);hr.height=20;
      sh.cols.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c.h;cell.font={bold:true,color:{argb:"FFFFFFFF"}};cell.fill=solid("head");cell.alignment={vertical:"middle"}});
      sh.rows.forEach((vals,ri)=>{const row=ws.getRow(r++),fill=sh.fill?.(ri);
        vals.forEach((v,i)=>{const c=sh.cols[i],cell=row.getCell(i+1);cell.value=xv(v,c.t);
          if(c.t==="money")cell.numFmt="#,##0.00";else if(c.t==="date")cell.numFmt="d/m/yyyy";else if(c.t==="num")cell.numFmt="0.##";
          cell.alignment={vertical:"top",wrapText:!!c.wrap};if(fill)cell.fill=solid(fill)})});
      if(sh.total){const row=ws.getRow(r++);sh.total.forEach((v,i)=>{const c=sh.cols[i],cell=row.getCell(i+1);cell.value=xv(v,c.t);cell.font={bold:true};cell.fill=solid("total");
        cell.border={top:{style:"thin"}};if(c.t==="money")cell.numFmt="#,##0.00";else if(c.t==="num")cell.numFmt="0.##"})}
      if(sh.after?.length){r++;for(const[a,b,fill]of sh.after){const row=ws.getRow(r++);row.getCell(1).value=a;row.getCell(1).font={bold:true};
        const cell=row.getCell(2);cell.value=typeof b==="number"?b:b??null;if(typeof b==="number")cell.numFmt="#,##0.00";if(fill){row.getCell(1).fill=solid(fill);cell.fill=solid(fill)}}}
      if(sh.legend){r++;for(const[fill,text]of sh.legend){const row=ws.getRow(r++);row.getCell(1).fill=solid(fill);row.getCell(2).value=text}}
      ws.views=[{state:"frozen",ySplit:head,xSplit:sh.freezeCols||0}];
      if(sh.rows.length)ws.autoFilter={from:{row:head,column:1},to:{row:head,column:sh.cols.length}};
      sh.cols.forEach((c,i)=>{const w=Math.max(xLen(c.h),...sh.rows.map(v=>xLen(xDisp(v[i],c.t))),...(sh.total?[xLen(xDisp(sh.total[i],c.t))]:[]));
        ws.getColumn(i+1).width=Math.min(c.max||40,Math.max(8,w+2))});
      if(sh.info?.length||sh.after?.length)ws.getColumn(1).width=Math.max(ws.getColumn(1).width||10,18)}
    const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=filename.replace(/[\\/:*?"<>|]+/g,"-");
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(L("Excel 已下载","Excel downloaded"))

  return a.slice(0,7)===b.slice(0,7)?monthLong(a):`${MONL[+a.slice(5,7)-1]}${a.slice(0,4)!==b.slice(0,4)?" "+a.slice(0,4):""} & ${monthLong(b)}`}
function sumHead(lines){return `<div class="sumh">${lines.map((t,i)=>i===0?`<div class="t"><span class="ul">${esc(t)}</span></div>`:`<div>${esc(t)}</div>`).join("")}</div>`}
function chunkPages(rows,per,make){const ch=[];for(let i=0;i<rows.length;i+=per)ch.push(rows.slice(i,i+per));
  return ch.map((r,pi)=>`<div class="doc pg land">${make(r,pi,pi===ch.length-1)}${ch.length>1?`<div class="pno">Page ${pi+1} of ${ch.length}</div>`:""}</div>`).join("")}
function breakdownHTML(inv,dos){const g={};for(const d of dos)(g[d.service]=g[d.service]||[]).push(d);const c=custOf(inv.customer_id);
  return Object.entries(g).map(([svc,list])=>{const month=sumMonth(inv,list);
    if(svc==="TMA"&&!inv.project){
      const rows=list.map(d=>{const rr=findRate(d.customer_id,`TMA ${d.shift||"Day"}`,d.do_date),mx=baseHrsOf(rr),bh=Number(d.billable_hours)||0,sur=Number(d.surcharge)||0,tot=r2(Number(d.amount)||0),ot=r2(Math.max(0,bh-mx));
        if(isDayRate(rr)){const day=Number(d.rate)||0,otAmt=r2(tot-sur-day),otr=ot?r2(otAmt/ot):(Number(rr.ot_rate)||0);return{d,mx,th:Math.min(bh,mx),ot,day,hr:otr,amt:day,otAmt,sur,tot}}
        const hr=Number(d.rate)||0,otAmt=r2(ot*hr);return{d,mx,th:Math.min(bh,mx),ot,day:r2(hr*mx),hr,amt:r2(tot-otAmt-sur),otAmt,sur,tot}});
      const S2=k=>sum(rows,x=>x[k]);
      return chunkPages(rows,16,(rs,pi,last)=>`${sumHead([`Hire Of TMA Truck Summary Report For ${month}`,`INV NO : ${inv.invoice_no}`,`Customer : ${c.name||""}`])}
      <table class="sm"><colgroup><col style="width:4%"><col style="width:8%"><col style="width:8%"><col style="width:6.5%"><col style="width:6.5%"><col style="width:6.5%"><col style="width:5.5%"><col style="width:5.5%"><col style="width:5.5%"><col style="width:8%"><col style="width:7%"><col style="width:8%"><col style="width:7%"><col style="width:6.5%"><col style="width:8%"></colgroup>
      <thead><tr><th>S/N</th><th>DATE</th><th>VEHICLE NO</th><th>DO NO</th><th>START TIME</th><th>END TIME</th><th>TOTAL HR</th><th>MAX HR</th><th>OT HOUR</th><th>RATE</th><th>OT RATE</th><th>AMOUNT</th><th class="dk">OT AMT</th><th class="dk">Diesel Surcharge</th><th class="dk">TOTAL AMOUNT</th></tr></thead><tbody>
      ${rs.map((x,i)=>`<tr><td>${pi*16+i+1}</td><td>${dmy(x.d.do_date)}</td><td>${esc(x.d.plate||"")}</td><td>${esc(x.d.do_no)}</td><td>${tShort(x.d.start_time)}</td><td>${tShort(x.d.end_time)}</td><td>${r2(x.th)}</td><td>${x.mx}</td><td>${r2(x.ot)}</td>
        <td class="a">${acc(x.day)}</td><td class="a">${acc(x.hr)}</td><td class="a">${acc(x.amt)}</td><td class="a">${acc(x.otAmt)}</td><td class="a">${acc(x.sur)}</td><td class="a">${acc(x.tot)}</td></tr>`).join("")}
      ${last?`<tr class="tt"><td colspan="10"></td><td class="lb">Total</td><td class="u a">${acc(S2("amt"))}</td><td class="u a">${acc(S2("otAmt"))}</td><td class="u a">${acc(S2("sur"))}</td><td class="u a">${acc(S2("tot"))}</td></tr>`:""}</tbody></table>`)}
    const tma=svc==="TMA",hasSur=list.some(d=>Number(d.surcharge)),title=(L3H_DESC[svc]&&svc!=="Excavator")?`${svc} Transportation Record (G.S.G)`:`${svc} Transportation Record`;
    const head=[`${title} For ${month}`,`INV NO : ${inv.invoice_no}`,`Customer : ${c.name||""}`];if(inv.project)head.push(`Project : ${inv.project}`);
    const cols=tma?12:11;
    return chunkPages(list,16,(rs,pi,last)=>`${sumHead(head)}<table class="sm"><thead><tr><th>S/N</th><th>D/N</th><th>Date</th><th>From</th><th>To</th><th>Vehicle No</th><th>In</th><th>Out</th>${tma?"<th>TMA Day/Night Work</th>":""}<th>Rate</th><th>Total Hr</th><th>UOM</th>${hasSur?`<th class="dk">Diesel Surcharge</th>`:""}<th class="dk">Amount</th></tr></thead><tbody>
      ${rs.map((d,i)=>`<tr><td>${pi*16+i+1}</td><td>${esc(d.do_no)}</td><td>${dMonYY(d.do_date)}</td><td>${esc(d.from_loc||"")}</td><td>${esc(d.to_loc||"")}</td><td>${esc(d.plate||"")}</td>
      <td>${tShort(d.start_time)}</td><td>${tShort(d.end_time)}</td>${tma?`<td>${d.shift?d.shift+" Work":""}</td>`:""}<td class="a">${acc(d.rate)}</td><td>${Number(d.billable_hours||0).toFixed(2)}</td><td>hr</td>
      ${hasSur?`<td class="a">${acc(d.surcharge)}</td>`:""}<td class="a">${acc(d.amount)}</td></tr>`).join("")}
      ${last?`<tr class="tt"><td colspan="${tma?9:8}"></td><td class="lb">HRS</td><td class="u">${sum(list,d=>d.billable_hours).toFixed(2)}</td><td class="lb">TOTAL</td>${hasSur?`<td class="u a">${acc(sum(list,d=>d.surcharge))}</td>`:""}<td class="u a">${acc(sum(list,d=>d.amount))}</td></tr>`:""}</tbody></table>`)}).join("")}
let pdfLibs=null;
function loadPdfLibs(){if(window.html2canvas&&window.jspdf)return Promise.resolve();
  const one=src=>new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error(L("PDF 工具载入失败，请检查网络","Could not load the PDF tool")));document.head.appendChild(sc)});
  return pdfLibs||(pdfLibs=Promise.all([window.html2canvas?0:one("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),window.jspdf?0:one("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]).catch(e=>{pdfLibs=null;throw e}))}
async function makePdf(filename){
  const box=$("#print");toast(L("正在生成 PDF…","Creating PDF…"));
  try{await loadPdfLibs();box.classList.add("cap");if(document.fonts?.ready)await document.fonts.ready;await new Promise(r=>setTimeout(r,60));
    const{jsPDF}=window.jspdf;let pdf=null;
    for(const pg of box.querySelectorAll(".pg")){const land=pg.classList.contains("land"),W=land?297:210,H=land?210:297;
      const cv=await html2canvas(pg,{scale:2.5,backgroundColor:"#ffffff",logging:false,useCORS:true});
      const img=cv.toDataURL("image/jpeg",0.95);let w=W,h=cv.height*W/cv.width;if(h>H){h=H;w=cv.width*H/cv.height}
      if(!pdf)pdf=new jsPDF({orientation:land?"landscape":"portrait",unit:"mm",format:"a4"});else pdf.addPage("a4",land?"landscape":"portrait");
      pdf.addImage(img,"JPEG",0,0,w,h)}
    if(!pdf)throw new Error(L("没有内容","Nothing to print"));
    pdf.save(filename.replace(/[\\/:*?"<>|]+/g,"-")+".pdf");toast(L("PDF 已下载","PDF downloaded"))
  }catch(e){toast(e.message||String(e))}finally{box.classList.remove("cap")}}
async function printInv(id,mode){const inv=invById(id);try{const dos=await fetchAll(()=>sb.from("delivery_orders").select("*").eq("invoice_id",id).order("do_date").order("start_time"));
  $("#print").innerHTML=invoiceHTML(inv,dos.length>0)+breakdownHTML(inv,dos);const fn=inv.invoice_no.replace(/\//g,"-");
  if(mode==="print"){document.title=fn;setTimeout(()=>{window.print();document.title="ETK · L3H 开单系统"},100)}else await makePdf(fn)}catch(e){toast(e.message)}}

/* ---- SOA：照 ETK SOA template，一页 ---- */
const W1=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],W10=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const w999=n=>[n>=100?W1[Math.floor(n/100)]+" Hundred":"",(n%=100)>=20?W10[Math.floor(n/10)]+(n%10?" "+W1[n%10]:""):n?W1[n]:""].filter(Boolean).join(" ");
function amtWords(x){const neg=r2(x)<-0.005;x=Math.abs(r2(x));let d=Math.floor(x+1e-9);const c=Math.round((x-d)*100),p=[];
  for(const[v,w]of[[1e6,"Million"],[1e3,"Thousand"],[1,""]]){const q=Math.floor(d/v);if(q){p.push(w999(q)+(w?" "+w:""));d%=v}}
  return `${neg?"Credit Balance : ":""}Singapore Dollar ${p.join(" ")||"Zero"} Dollar${Math.floor(x)===1?"":"s"}${c?` and ${w999(c)} Cents`:""}.`}
function soaLedger(cid,asOf){
  const inv=S.d.invoices.filter(i=>i.customer_id===cid&&i.company===S.company&&i.status!=="Cancelled"&&i.invoice_date<=asOf)
    .map(i=>({date:i.invoice_date,type:"IN",ref:i.invoice_no,desc:/interest/i.test(i.description||"")?"Interest":"Invoice",dr:Number(i.total)||0,cr:0}));
  const pay=S.d.payments.filter(p=>p.customer_id===cid&&p.payment_date<=asOf).map(p=>{const ct=/contra/i.test(p.method||"");
    return{date:p.payment_date,type:ct?"Contra":"OR",ref:p.reference||(ct?"CONTRA":/cheque/i.test(p.method||"")?"CHEQUE":/paynow/i.test(p.method||"")?"PAYNOW":"FUND TRANSFER"),desc:ct?"Contra":"RECEIVED",dr:0,cr:Number(p.amount)||0}});
  let all=[...inv,...pay].sort((a,b)=>a.date.localeCompare(b.date)||(a.type==="IN"?-1:1)-(b.type==="IN"?-1:1)||String(a.ref).localeCompare(String(b.ref)));
  let bf=0;
  if(all.length>34){const open=S.d.invoices.filter(i=>i.customer_id===cid&&i.status!=="Cancelled"&&i.invoice_date<=asOf&&balOf(i)>0.005).map(i=>i.invoice_date).sort()[0]||asOf;
    const keep=[];for(const e of all){if(e.date<open)bf=r2(bf+e.dr-e.cr);else keep.push(e)}all=keep}
  let bal=bf;for(const e of all){bal=r2(bal+e.dr-e.cr);e.bal=bal}
  return{bf,rows:all,total:bal}}
function printSOA(mode){const cid=S.soaCust,c=custOf(cid),s=settingsOf(S.company),D=soaData(cid,S.soaAsOf),G=soaLedger(cid,S.soaAsOf);
  const bank=String(s.bank||"").replace(/^(DBS\s*)(\d{4})(\d{3})(\d{3})$/,"$1$2-$3-$4");
  const ad=String(c.address||"").split("\n").map(x=>x.trim().replace(/[.,]\s*$/,"")).filter(Boolean);
  const rows=(Math.abs(G.bf)>0.005?[{bfRow:1,bal:G.bf}]:[]).concat(G.rows);
  const n=rows.length,fs=n<=27?9.5:Math.max(5.5,9.5*27/n);
  const bl=v=>Math.abs(v)<0.005?`<div class="acc"><span>$</span><span>-</span></div>`:v<0?`<div class="acc"><span>$</span><span>(${money(-v)})</span></div>`:acc(v);
  const td=Number(c.payment_terms_days);
  $("#print").innerHTML=`<div class="doc pg soa">${coHeader(s,payeeOf(s))}<div class="st">STATEMENT OF ACCOUNT</div>
  <div class="sh"><div>Debtor : <b>${esc(c.name||"")}</b>${ad.map((a,i)=>`<br>${i===0?"Address :&nbsp; ":""}${esc(a)}${i===0&&ad.length>1?" ,":i===ad.length-1?".":""}`).join("")}</div>
    <div>Statement Date : ${S.soaAsOf.split("-").reverse().join("/")}<br>Terms : ${td===0?"COD":(c.payment_terms_days??30)+" DAYS"}</div></div>
  <div class="box"><table class="lg" style="font-size:${fs}pt"><colgroup><col style="width:13%"><col style="width:8%"><col style="width:21%"><col style="width:13%"><col style="width:16%"><col style="width:14%"><col style="width:15%"></colgroup>
  <thead><tr><th>Date</th><th></th><th>Ref</th><th>Description</th><th>DR (Invoice)</th><th>CR (Payment)</th><th>Balance</th></tr></thead><tbody>
  ${rows.map(r=>r.bfRow?`<tr><td></td><td></td><td></td><td>Balance B/F</td><td></td><td></td><td class="m">${bl(r.bal)}</td></tr>`
    :`<tr class="${r.type==="IN"?"":"or"}"><td>${dmy(r.date)}</td><td class="ty">${r.type}</td><td>${esc(r.ref)}</td><td>${r.desc}</td><td class="m">${r.dr?acc(r.dr):""}</td><td class="m">${r.cr?acc(r.cr):""}</td><td class="m">${bl(r.bal)}</td></tr>`).join("")}
  </tbody></table></div>
  <table class="wd"><colgroup><col style="width:85%"><col style="width:15%"></colgroup><tr><td>${esc(amtWords(G.total))}</td><td>${bl(G.total)}</td></tr></table>
  <div class="snote">Note : Payment should be made by crossed cheque in favour of <b>${esc(payeeOf(s))}</b><br>Bank transfer: ${esc(bank)}</div>
  <table class="ag"><tr><td>Current</td><td>30 days</td><td>60 days</td><td>90 days</td><td>90+</td>${D.credit>0.005?"<td>Less : Overpayment</td>":""}</tr>
  <tr>${[D.ag.cur,D.ag.d30,D.ag.d60,D.ag.d90,D.ag.over].map(v=>`<td>${v>0.005?"$"+money(v):""}</td>`).join("")}${D.credit>0.005?`<td>($${money(D.credit)})</td>`:""}</tr></table>
  <div class="nb2">- Invoices considered correct unless disputes notified to us within SEVEN (7) days from date of invoice<br>- Interest at the rate of 1.5% per month will be charged on all overdue amounts</div></div>`;
  const fn=`${S.company} SOA - ${(c.name||"").replace(/[\\/:*?"<>|]+/g," ")} ${S.soaAsOf.split("-").reverse().join("-")}`;
  if(mode==="print"){document.title=fn;setTimeout(()=>{window.print();document.title="ETK · L3H 开单系统"},100)}else makePdf(fn)}

/* ================= 弹出视窗 ================= */
function modalView(){const m=S.modal;const body=m.kind==="invForm"?invFormView(m.f):m.kind==="inv"?invDetailView(m.id):m.kind==="payForm"?payFormView(m.f):"";
  return `<div class="modal" onclick="if(event.target===this&&!S.dirty)closeModal()"><div class="box">${body}</div></div>`}
async function closeModal(){S.modal=null;done();await reload()}

/* ================= 动作 ================= */
async function doLogin(e){e.preventDefault();const fd=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:fd.get("email"),password:fd.get("password")});
  if(error)toast(L("登录失败：","Login failed: ")+error.message)}
async function logout(){await sb.auth.signOut()}
function confirmLeave(){return !S.dirty||confirm(L("还没保存，确定离开？","You have unsaved changes. Leave anyway?"))}
function setTab(x){if(!confirmLeave())return;S.tab=x;S.doForm=null;done();if(S.pending){S.pending=false;reload()}else render()}
async function setCompany(c){if(!confirmLeave())return;S.company=c;setPref("company",c);S.doForm=null;S.modal=null;done();await reload()}
async function setMonth(m){S.month=m;await loadDO();render()}
function toggleLang(){S.lang=S.lang==="zh"?"en":"zh";setPref("lang",S.lang);document.documentElement.lang=S.lang;render()}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";setPref("theme",S.theme);document.documentElement.dataset.theme=S.theme;render()}
sb.auth.onAuthStateChange((_ev,session)=>{const was=S.user?.id;S.user=session?.user||null;
  if(S.user&&S.user.id!==was){setTimeout(async()=>{await reload();startRealtime()},0)}
  if(!S.user){if(rt)sb.removeChannel(rt);render()}});
render();
